type: object
description: Individual food item with portion size and nutritional information
required:
  - name
  - portionSize
  - units
properties:
  name:
    type: string
    minLength: 1
    maxLength: 100
    description: Name of the food item
    example: "Grilled chicken breast"
  
  portionSize:
    type: number
    minimum: 0
    description: Portion size amount
    example: 150
  
  units:
    type: string
    minLength: 1
    maxLength: 20
    description: Units for portion size measurement
    example: "grams"
  
  protein_g:
    type: number
    minimum: 0
    description: Protein content in grams
    example: 31.0
  
  carbs_g:
    type: number
    minimum: 0
    description: Carbohydrate content in grams
    example: 0
  
  fat_g:
    type: number
    minimum: 0
    description: Fat content in grams
    example: 3.6
  
  calories:
    type: number
    minimum: 0
    description: Total calorie content
    example: 165
  
  fiber_g:
    type: number
    minimum: 0
    description: Fiber content in grams (optional)
    example: 0
  
  sugar_g:
    type: number
    minimum: 0
    description: Sugar content in grams (optional)
    example: 0
  
  sodium_mg:
    type: number
    minimum: 0
    description: Sodium content in milligrams (optional)
    example: 74

additionalProperties: false

example:
  name: "Salmon fillet"
  portionSize: 120
  units: "grams"
  protein_g: 25.4
  carbs_g: 0
  fat_g: 13.4
  calories: 231
  fiber_g: 0
  sugar_g: 0
  sodium_mg: 59 