type: object
description: Database error response for data transfer operations
required:
  - status
  - message
  - errorCode
properties:
  status:
    type: string
    enum: ['error']
    description: Error status indicator
    example: error
  message:
    type: string
    description: Human-readable error message
    example: "Failed to export data due to a database issue."
  errorCode:
    type: string
    enum: ['DATABASE_ERROR']
    description: Database error code
    example: "DATABASE_ERROR"
  details:
    type: object
    properties:
      operation:
        type: string
        enum: ['export', 'import', 'validation']
        description: Operation that failed
        example: "export"
      affectedDataType:
        type: string
        enum: ['profiles', 'workouts', 'workout_logs']
        description: Data type that caused the error
        example: "profiles"
      batchSize:
        type: integer
        description: Number of records being processed when error occurred
        example: 100
    description: Additional database error details
examples:
  exportDatabaseError:
    summary: Database error during export
    value:
      status: error
      message: "Failed to export data due to a database issue."
      errorCode: "DATABASE_ERROR"
      details:
        operation: "export"
        affectedDataType: "profiles"
  importDatabaseError:
    summary: Database error during import
    value:
      status: error
      message: "Failed to import data due to a database issue."
      errorCode: "DATABASE_ERROR"
      details:
        operation: "import"
        affectedDataType: "workout_logs"
        batchSize: 100
  batchInsertError:
    summary: Error during batch insert operation
    value:
      status: error
      message: "Database error importing XLSX data: Batch error for workout_plans"
      errorCode: "DATABASE_ERROR"
      details:
        operation: "import"
        affectedDataType: "workouts"
        batchSize: 50 