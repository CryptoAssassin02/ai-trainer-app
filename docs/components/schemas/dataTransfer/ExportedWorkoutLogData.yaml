type: object
description: Workout log data structure for export operations
required:
  - user_id
  - date
  - exercises_completed
properties:
  id:
    type: string
    format: uuid
    description: Workout log ID
    example: "789e0123-e89b-12d3-a456-426614174002"
  user_id:
    type: string
    format: uuid
    description: Associated user ID
    example: "123e4567-e89b-12d3-a456-426614174000"
  plan_id:
    type: string
    format: uuid
    nullable: true
    description: Associated workout plan ID (auto-linked if null during import)
    example: "456e7890-e89b-12d3-a456-426614174001"
  date:
    type: string
    format: date
    description: Date when workout was performed
    example: "2024-01-14"
  completed:
    type: boolean
    nullable: true
    description: Whether the workout was completed
    example: true
  exercises_completed:
    type: object
    description: Details of exercises performed (exported as JSON string in non-JSON formats)
    example:
      - exercise_id: "ex001"
        exercise_name: "Squats"
        sets_completed: 3
        reps_completed: [12, 10, 8]
        weights_used: [60, 65, 70]
        felt_difficulty: 7
        notes: "Good form, felt strong"
  overall_difficulty:
    type: integer
    minimum: 1
    maximum: 10
    nullable: true
    description: Overall difficulty rating (1-10 scale)
    example: 7
  energy_level:
    type: integer
    minimum: 1
    maximum: 10
    nullable: true
    description: Energy level during workout (1-10 scale)
    example: 8
  satisfaction:
    type: integer
    minimum: 1
    maximum: 10
    nullable: true
    description: Satisfaction with workout (1-10 scale)
    example: 9
  feedback:
    type: string
    nullable: true
    maxLength: 1000
    description: General feedback about the workout
    example: "Great workout, felt strong throughout. Plan to increase weight next session."
  created_at:
    type: string
    format: date-time
    nullable: true
    description: Log creation timestamp
    example: "2024-01-14T18:30:00.000Z"
  updated_at:
    type: string
    format: date-time
    nullable: true
    description: Log last update timestamp
    example: "2024-01-14T18:45:00.000Z"
examples:
  basicLog:
    summary: Basic workout log for export
    value:
      id: "789e0123-e89b-12d3-a456-426614174002"
      user_id: "123e4567-e89b-12d3-a456-426614174000"
      plan_id: "456e7890-e89b-12d3-a456-426614174001"
      date: "2024-01-14"
      completed: true
      exercises_completed:
        - exercise_id: "ex001"
          exercise_name: "Squats"
          sets_completed: 3
          reps_completed: [12, 12, 10]
          weights_used: [60, 60, 65]
      overall_difficulty: 6
  detailedLog:
    summary: Detailed workout log with all fields
    value:
      id: "789e0123-e89b-12d3-a456-426614174002"
      user_id: "123e4567-e89b-12d3-a456-426614174000"
      plan_id: "456e7890-e89b-12d3-a456-426614174001"
      date: "2024-01-14"
      completed: true
      exercises_completed:
        - exercise_id: "ex001"
          exercise_name: "Squats"
          sets_completed: 3
          reps_completed: [12, 10, 8]
          weights_used: [60, 65, 70]
          felt_difficulty: 7
          notes: "Good form, progressive overload working well"
        - exercise_id: "ex002"
          exercise_name: "Bench Press"
          sets_completed: 3
          reps_completed: [10, 8, 6]
          weights_used: [80, 85, 90]
          felt_difficulty: 8
          notes: "Challenging but completed all reps"
      overall_difficulty: 7
      energy_level: 8
      satisfaction: 9
      feedback: "Excellent session, felt strong and motivated. Ready to progress further."
      created_at: "2024-01-14T18:30:00.000Z"
      updated_at: "2024-01-14T18:45:00.000Z"
  orphanedLog:
    summary: Workout log without plan association
    value:
      id: "789e0123-e89b-12d3-a456-426614174003"
      user_id: "123e4567-e89b-12d3-a456-426614174000"
      plan_id: null
      date: "2024-01-13"
      completed: true
      exercises_completed:
        - exercise_id: "ex003"
          exercise_name: "Running"
          sets_completed: 1
          reps_completed: [1]
          weights_used: [0]
          felt_difficulty: 5
          notes: "30 minute jog" 