type: object
required: [status, error, message]
properties:
  status:
    type: string
    enum: [error]
    description: Response status
  error:
    type: string
    enum: [GOAL_NOT_FOUND]
    description: Error code
  message:
    type: string
    description: Human-readable error message
  details:
    type: object
    properties:
      resource:
        type: string
        enum: [goal, milestone, progress-data, related-goal]
        description: Type of resource that was not found
      resourceId:
        type: string
        description: ID of the specific resource that was not found
      searchCriteria:
        type: object
        description: Criteria used to search for the resource
      availableGoals:
        type: array
        items:
          type: object
          properties:
            id:
              type: string
              format: uuid
            type:
              type: string
            status:
              type: string
            createdDate:
              type: string
              format: date
        description: Available goals for this user
      suggestions:
        type: array
        items:
          type: string
        description: Suggestions for finding or creating goals
      relatedResources:
        type: array
        items:
          type: object
          properties:
            type:
              type: string
            id:
              type: string
            description:
              type: string
        description: Related resources that might be helpful
    description: Details about what was not found
  timestamp:
    type: string
    format: date-time
    description: Error timestamp
  requestId:
    type: string
    description: Unique request identifier for support 