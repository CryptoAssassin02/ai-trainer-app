type: object
required: [status, error, message]
properties:
  status:
    type: string
    enum: [error]
    description: Response status
  error:
    type: string
    enum: [GOAL_CONFLICT_ERROR]
    description: Error code
  message:
    type: string
    description: Human-readable error message
  details:
    type: object
    properties:
      conflictType:
        type: string
        enum: [duplicate_goal, contradictory_targets, overlapping_timeframes, resource_conflict, incompatible_constraints]
        description: Type of conflict detected
      conflictingGoals:
        type: array
        items:
          type: object
          properties:
            id:
              type: string
              format: uuid
            type:
              type: string
            target:
              type: object
            timeframe:
              type: string
            status:
              type: string
            conflictReason:
              type: string
        description: Goals that conflict with the requested operation
      conflictDescription:
        type: string
        description: Detailed description of the conflict
      resolutionOptions:
        type: array
        items:
          type: object
          properties:
            option:
              type: string
            description:
              type: string
            impact:
              type: string
            recommended:
              type: boolean
        description: Possible ways to resolve the conflict
      automaticResolution:
        type: object
        properties:
          available:
            type: boolean
          action:
            type: string
          description:
            type: string
        description: Whether automatic resolution is available
      userAction:
        type: string
        enum: [modify_goal, pause_conflicting, force_create, cancel_operation]
        description: Required user action to proceed
      priority:
        type: string
        enum: [low, medium, high, critical]
        description: Priority level of resolving this conflict
    description: Detailed conflict information
  timestamp:
    type: string
    format: date-time
    description: Error timestamp
  requestId:
    type: string
    description: Unique request identifier for support 