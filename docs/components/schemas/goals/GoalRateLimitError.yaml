type: object
required: [status, error, message]
properties:
  status:
    type: string
    enum: [error]
    description: Response status
  error:
    type: string
    enum: [GOAL_RATE_LIMIT_ERROR]
    description: Error code
  message:
    type: string
    description: Human-readable error message
  details:
    type: object
    properties:
      limitType:
        type: string
        enum: [goal_creation_per_day, goal_updates_per_hour, goal_predictions_per_day, milestone_updates_per_hour, progress_tracking_per_day]
        description: Type of rate limit exceeded
      current:
        type: integer
        description: Current usage count
      limit:
        type: integer
        description: Maximum allowed usage
      resetTime:
        type: string
        format: date-time
        description: When the rate limit resets
      retryAfter:
        type: integer
        description: Seconds to wait before retrying
      goalSpecific:
        type: object
        properties:
          goalTypes:
            type: array
            items:
              type: string
              enum: [weight_loss, muscle_gain, strength, endurance, body_composition]
            description: Types of goals affected by rate limiting
          operationType:
            type: string
            enum: [creation, modification, deletion, progress_update, prediction_request]
            description: Goal operation being rate limited
          complexityLevel:
            type: string
            enum: [simple, moderate, complex, very_complex]
            description: Complexity of goal operation
          aiInvolved:
            type: boolean
            description: Whether AI predictions are involved
        description: Goal-specific rate limiting factors
      recommendations:
        type: object
        properties:
          batchOperations:
            type: boolean
            description: Whether to batch multiple goal operations
          prioritizeGoals:
            type: boolean
            description: Whether to prioritize certain goals
          deferUpdates:
            type: boolean
            description: Whether to defer non-critical updates
          useCachedPredictions:
            type: boolean
            description: Whether to use cached predictions
        description: Optimization recommendations for goal management
      alternatives:
        type: object
        properties:
          viewGoals:
            type: boolean
            description: Whether goal viewing is still available
          manualTracking:
            type: boolean
            description: Whether manual progress tracking is available
          cachedProgress:
            type: boolean
            description: Whether cached progress data is available
          delayedPredictions:
            type: boolean
            description: Whether predictions can be delayed
        description: Alternative options during rate limiting
      quota:
        type: object
        properties:
          daily:
            type: object
            properties:
              goalCreation:
                type: object
                properties:
                  used:
                    type: integer
                  remaining:
                    type: integer
                  total:
                    type: integer
              goalPredictions:
                type: object
                properties:
                  used:
                    type: integer
                  remaining:
                    type: integer
                  total:
                    type: integer
              progressTracking:
                type: object
                properties:
                  used:
                    type: integer
                  remaining:
                    type: integer
                  total:
                    type: integer
          hourly:
            type: object
            properties:
              goalUpdates:
                type: object
                properties:
                  used:
                    type: integer
                  remaining:
                    type: integer
                  total:
                    type: integer
              milestoneUpdates:
                type: object
                properties:
                  used:
                    type: integer
                  remaining:
                    type: integer
                  total:
                    type: integer
        description: Detailed quota information for goal management
      goalManagement:
        type: object
        properties:
          activeGoals:
            type: integer
            description: Number of currently active goals
          maxGoals:
            type: integer
            description: Maximum allowed active goals
          completedGoals:
            type: integer
            description: Number of completed goals
          goalComplexityScore:
            type: number
            description: Overall complexity score of user's goals
          conflictingGoals:
            type: boolean
            description: Whether conflicting goals were detected
        description: Goal management status affecting rate limits
      behaviorAnalysis:
        type: object
        properties:
          goalSetPattern:
            type: string
            enum: [consistent, sporadic, excessive, realistic]
            description: User's goal setting pattern
          completionRate:
            type: number
            description: Goal completion rate (0-1)
          modificationFrequency:
            type: string
            enum: [low, moderate, high, excessive]
            description: Frequency of goal modifications
          engagementLevel:
            type: string
            enum: [high, moderate, low]
            description: User engagement with goals
        description: User behavior analysis affecting rate limits
      aiPredictions:
        type: object
        properties:
          predictionComplexity:
            type: string
            enum: [simple, moderate, complex, very_complex]
            description: Complexity of AI predictions requested
          computationalCost:
            type: string
            enum: [low, moderate, high, very_high]
            description: Computational cost of predictions
          accuracyRequirement:
            type: string
            enum: [basic, standard, high, maximum]
            description: Required accuracy level for predictions
          resourceIntensive:
            type: boolean
            description: Whether predictions are resource intensive
        description: AI prediction factors affecting rate limits
    description: Detailed goal rate limit information
  timestamp:
    type: string
    format: date-time
    description: Error timestamp
  requestId:
    type: string
    description: Unique request identifier for support 