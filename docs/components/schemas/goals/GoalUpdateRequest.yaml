type: object
properties:
  target:
    type: object
    properties:
      value:
        type: number
        description: Updated target value
      unit:
        type: string
        description: Updated unit of measurement
      metric:
        type: string
        description: Updated metric being targeted
      description:
        type: string
        maxLength: 500
        description: Updated target description
    description: Updated target for the goal
  timeframe:
    type: string
    enum: [1month, 3months, 6months, 1year, custom]
    description: Updated time period to achieve the goal
  customTimeframe:
    type: object
    properties:
      startDate:
        type: string
        format: date
      endDate:
        type: string
        format: date
    description: Updated custom date range
  priority:
    type: string
    enum: [low, medium, high, critical]
    description: Updated goal priority level
  status:
    type: string
    enum: [active, paused, completed, abandoned, modified]
    description: Updated goal status
  motivation:
    type: string
    maxLength: 1000
    description: Updated personal motivation
  milestones:
    type: array
    items:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Milestone ID (for updates to existing milestones)
        percentage:
          type: number
          minimum: 0
          maximum: 100
        description:
          type: string
          maxLength: 200
        targetDate:
          type: string
          format: date
        reward:
          type: string
          maxLength: 200
        completed:
          type: boolean
        completedDate:
          type: string
          format: date
        action:
          type: string
          enum: [add, update, delete, complete]
          description: Action to perform on this milestone
    description: Updated milestones for the goal
  constraints:
    type: object
    properties:
      medicalRestrictions:
        type: array
        items:
          type: string
        description: Updated medical constraints
      timeConstraints:
        type: array
        items:
          type: string
        description: Updated time constraints
      equipmentLimitations:
        type: array
        items:
          type: string
        description: Updated equipment limitations
      budgetConstraints:
        type: object
        properties:
          maxCost:
            type: number
          currency:
            type: string
        description: Updated budget constraints
    description: Updated constraints
  relatedGoals:
    type: array
    items:
      type: string
      format: uuid
    description: Updated list of related goal IDs
  trackingMetrics:
    type: array
    items:
      type: string
      enum: [weight, body_fat, measurements, strength, endurance, habits, performance]
    description: Updated tracking metrics
  notifications:
    type: object
    properties:
      reminders:
        type: boolean
      frequency:
        type: string
        enum: [daily, weekly, biweekly, monthly]
      milestoneAlerts:
        type: boolean
      progressReports:
        type: boolean
    description: Updated notification preferences
  publicVisibility:
    type: boolean
    description: Updated visibility setting
  accountabilityPartner:
    type: string
    format: uuid
    description: Updated accountability partner ID
  progressUpdate:
    type: object
    properties:
      currentValue:
        type: number
        description: Current progress value
      notes:
        type: string
        maxLength: 1000
        description: Progress notes
      confidence:
        type: integer
        minimum: 1
        maximum: 10
        description: Confidence in achieving goal (1-10)
      adjustmentReason:
        type: string
        maxLength: 500
        description: Reason for goal adjustment
    description: Progress update information
  updateReason:
    type: string
    maxLength: 500
    description: Reason for updating the goal 