type: object
description: Comprehensive goal progress tracking with velocity analysis, confidence scoring, and detailed progress metrics
required:
  - goalId
  - percentage
  - onTrack
  - velocity
  - projectedCompletion
  - confidenceScore
  - lastUpdate
properties:
  goalId:
    type: string
    format: uuid
    description: Unique identifier for the associated goal
    example: "456e7890-f12a-34b5-c678-def012345678"
  percentage:
    type: number
    format: float
    minimum: 0
    maximum: 1
    description: Current progress as a percentage (0-1, where 1 is 100% complete)
    example: 0.25
  onTrack:
    type: boolean
    description: Whether the goal is on track to be completed by the target date
    example: true
  velocity:
    type: number
    format: float
    minimum: 0
    description: Current progress velocity (progress per day as decimal)
    example: 0.0075
  projectedCompletion:
    type: string
    format: date-time
    description: Projected completion date based on current velocity
    example: "2024-04-10T00:00:00Z"
  confidenceScore:
    type: number
    format: float
    minimum: 0
    maximum: 1
    description: Confidence score in achieving the goal (0-1, where 1 is highest confidence)
    example: 0.82
  remainingValue:
    type: number
    format: float
    minimum: 0
    description: Remaining value to achieve the goal target
    example: 7.5
  timeRemaining:
    type: integer
    minimum: 0
    description: Days remaining until target date
    example: 89
  averageDaily:
    type: number
    format: float
    description: Average daily progress required to meet target date
    example: 0.084
  actualDaily:
    type: number
    format: float
    description: Actual average daily progress over the last 7 days
    example: 0.091
  streak:
    type: object
    description: Current and historical streak information
    required:
      - current
      - longest
      - type
    properties:
      current:
        type: integer
        minimum: 0
        description: Current active streak in days
        example: 14
      longest:
        type: integer
        minimum: 0
        description: Longest streak achieved for this goal
        example: 21
      type:
        type: string
        enum: [adherence, improvement, consistency, milestone_completion]
        description: Type of streak being tracked
        example: adherence
      lastBroken:
        type: string
        format: date-time
        description: Date when streak was last broken
        example: "2023-12-28T00:00:00Z"
      streakValue:
        type: number
        format: float
        description: Value associated with the streak (if applicable)
        example: 0.15
  trendAnalysis:
    type: object
    description: Analysis of progress trends over different time periods
    properties:
      last7Days:
        type: object
        properties:
          trend:
            type: string
            enum: [improving, stable, declining]
            description: Trend direction over the last 7 days
            example: improving
          rate:
            type: number
            format: float
            description: Rate of change in the trend
            example: 0.02
          confidence:
            type: number
            format: float
            minimum: 0
            maximum: 1
            description: Confidence in the trend analysis
            example: 0.78
      last30Days:
        type: object
        properties:
          trend:
            type: string
            enum: [improving, stable, declining]
            description: Trend direction over the last 30 days
            example: stable
          rate:
            type: number
            format: float
            description: Rate of change in the trend
            example: 0.005
          confidence:
            type: number
            format: float
            minimum: 0
            maximum: 1
            description: Confidence in the trend analysis
            example: 0.85
      overall:
        type: object
        properties:
          trend:
            type: string
            enum: [improving, stable, declining]
            description: Overall trend since goal start
            example: improving
          rate:
            type: number
            format: float
            description: Overall rate of change
            example: 0.018
          consistency:
            type: number
            format: float
            minimum: 0
            maximum: 1
            description: Consistency of progress (0-1)
            example: 0.72
  milestoneProgress:
    type: object
    description: Progress tracking for goal milestones
    properties:
      completed:
        type: integer
        minimum: 0
        description: Number of milestones completed
        example: 1
      total:
        type: integer
        minimum: 0
        description: Total number of milestones
        example: 4
      nextMilestone:
        type: object
        description: Information about the next milestone
        properties:
          id:
            type: string
            description: Milestone identifier
            example: "milestone_002"
          progress:
            type: number
            format: float
            minimum: 0
            maximum: 1
            description: Progress towards next milestone (0-1)
            example: 0.6
          estimatedCompletion:
            type: string
            format: date-time
            description: Estimated completion date for next milestone
            example: "2024-02-28T00:00:00Z"
      overdue:
        type: integer
        minimum: 0
        description: Number of overdue milestones
        example: 0
  performanceMetrics:
    type: object
    description: Performance metrics and analysis
    properties:
      efficiency:
        type: number
        format: float
        minimum: 0
        description: Efficiency score based on effort vs. results
        example: 0.78
      momentum:
        type: string
        enum: [building, strong, moderate, weak, declining]
        description: Current momentum assessment
        example: strong
      plateauRisk:
        type: string
        enum: [low, medium, high]
        description: Risk of hitting a plateau
        example: low
      adaptationNeeded:
        type: boolean
        description: Whether strategy adaptation is recommended
        example: false
      optimalRange:
        type: object
        description: Optimal performance range
        properties:
          min:
            type: number
            format: float
            description: Minimum recommended daily progress
            example: 0.07
          max:
            type: number
            format: float
            description: Maximum sustainable daily progress
            example: 0.12
          current:
            type: number
            format: float
            description: Current daily progress rate
            example: 0.091
  motivationIndicators:
    type: object
    description: Indicators of motivation and engagement
    properties:
      engagementScore:
        type: number
        format: float
        minimum: 0
        maximum: 1
        description: Engagement score based on activity patterns (0-1)
        example: 0.84
      challengeLevel:
        type: string
        enum: [too_easy, appropriate, challenging, too_difficult]
        description: Assessment of current challenge level
        example: appropriate
      satisfactionTrend:
        type: string
        enum: [increasing, stable, decreasing]
        description: Trend in satisfaction/motivation
        example: stable
      burnoutRisk:
        type: string
        enum: [low, medium, high]
        description: Risk of burnout based on patterns
        example: low
  adjustmentHistory:
    type: array
    description: History of goal adjustments and their impact
    items:
      type: object
      required:
        - date
        - type
        - impact
      properties:
        date:
          type: string
          format: date-time
          description: Date of adjustment
          example: "2024-01-10T00:00:00Z"
        type:
          type: string
          enum: [target_value, timeline, strategy, milestone]
          description: Type of adjustment made
          example: strategy
        impact:
          type: string
          enum: [positive, neutral, negative]
          description: Impact of the adjustment on progress
          example: positive
        description:
          type: string
          description: Description of the adjustment
          example: "Added strength training 2x per week"
        progressBefore:
          type: number
          format: float
          description: Progress velocity before adjustment
          example: 0.055
        progressAfter:
          type: number
          format: float
          description: Progress velocity after adjustment
          example: 0.075
    example:
      - date: "2024-01-10T00:00:00Z"
        type: strategy
        impact: positive
        description: "Added strength training 2x per week"
        progressBefore: 0.055
        progressAfter: 0.075
  lastUpdate:
    type: string
    format: date-time
    description: Timestamp of the last progress update
    example: "2024-01-15T08:00:00Z"
  nextReview:
    type: string
    format: date-time
    description: Recommended date for next progress review
    example: "2024-01-22T10:30:00Z"
examples:
  - goalId: "456e7890-f12a-34b5-c678-def012345678"
    percentage: 0.25
    onTrack: true
    velocity: 0.0075
    projectedCompletion: "2024-04-10T00:00:00Z"
    confidenceScore: 0.82
    remainingValue: 7.5
    timeRemaining: 89
    averageDaily: 0.084
    actualDaily: 0.091
    streak:
      current: 14
      longest: 21
      type: adherence
      lastBroken: "2023-12-28T00:00:00Z"
      streakValue: 0.15
    trendAnalysis:
      last7Days:
        trend: improving
        rate: 0.02
        confidence: 0.78
      last30Days:
        trend: stable
        rate: 0.005
        confidence: 0.85
      overall:
        trend: improving
        rate: 0.018
        consistency: 0.72
    milestoneProgress:
      completed: 1
      total: 4
      nextMilestone:
        id: "milestone_002"
        progress: 0.6
        estimatedCompletion: "2024-02-28T00:00:00Z"
      overdue: 0
    performanceMetrics:
      efficiency: 0.78
      momentum: strong
      plateauRisk: low
      adaptationNeeded: false
      optimalRange:
        min: 0.07
        max: 0.12
        current: 0.091
    motivationIndicators:
      engagementScore: 0.84
      challengeLevel: appropriate
      satisfactionTrend: stable
      burnoutRisk: low
    adjustmentHistory:
      - date: "2024-01-10T00:00:00Z"
        type: strategy
        impact: positive
        description: "Added strength training 2x per week"
        progressBefore: 0.055
        progressAfter: 0.075
    lastUpdate: "2024-01-15T08:00:00Z"
    nextReview: "2024-01-22T10:30:00Z" 