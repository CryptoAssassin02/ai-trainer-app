type: object
description: Comprehensive fitness goal with targets, milestones, progress tracking, and achievement metrics
required:
  - goalId
  - userId
  - title
  - category
  - status
  - target
  - currentValue
  - startingValue
  - targetDate
  - progress
  - createdAt
  - updatedAt
properties:
  goalId:
    type: string
    format: uuid
    description: Unique identifier for this goal
    example: "456e7890-f12a-34b5-c678-def012345678"
  userId:
    type: string
    format: uuid
    description: Unique identifier for the user
    example: "123e4567-e89b-12d3-a456-426614174000"
  title:
    type: string
    minLength: 1
    maxLength: 100
    description: Short, descriptive title for the goal
    example: "Lose 10kg"
  description:
    type: string
    maxLength: 500
    description: Detailed description of the goal and motivation
    example: "Achieve a healthy weight loss of 10kg through consistent exercise and nutrition to improve overall health and confidence"
  category:
    type: string
    enum: [weight_loss, weight_gain, muscle_gain, strength, endurance, flexibility, body_composition, performance, habit_formation, rehabilitation]
    description: Category classification for the goal
    example: weight_loss
  priority:
    type: string
    enum: [low, medium, high, critical]
    description: Priority level of the goal
    default: medium
    example: high
  status:
    type: string
    enum: [draft, active, paused, completed, cancelled, failed]
    description: Current status of the goal
    example: active
  target:
    $ref: './GoalTarget.yaml'
  currentValue:
    type: number
    format: float
    description: Current value for the goal metric
    example: 72.5
  startingValue:
    type: number
    format: float
    description: Starting value when the goal was created
    example: 75.0
  targetDate:
    type: string
    format: date-time
    description: Target completion date for the goal
    example: "2024-04-15T00:00:00Z"
  startDate:
    type: string
    format: date-time
    description: Date when the goal was started
    example: "2024-01-01T10:00:00Z"
  progress:
    $ref: './GoalProgress.yaml'
  milestones:
    type: array
    description: Intermediate milestones for this goal
    items:
      $ref: './GoalMilestone.yaml'
    example:
      - id: "milestone_001"
        title: "First 2.5kg"
        targetValue: 72.5
        targetDate: "2024-02-15T00:00:00Z"
        status: completed
        completedDate: "2024-01-15T00:00:00Z"
      - id: "milestone_002"
        title: "Halfway point - 5kg"
        targetValue: 70.0
        targetDate: "2024-03-01T00:00:00Z"
        status: active
  tags:
    type: array
    description: Optional tags for categorizing and filtering goals
    items:
      type: string
    example: ["health", "weight-management", "2024-goals"]
  isPublic:
    type: boolean
    description: Whether this goal can be shared publicly or with other users
    default: false
    example: false
  accountability:
    type: object
    description: Accountability settings and partners
    properties:
      hasAccountabilityPartner:
        type: boolean
        description: Whether user has an accountability partner for this goal
        example: true
      partnerUserId:
        type: string
        format: uuid
        description: User ID of accountability partner
        example: "789abc12-def3-4567-8901-234567890abc"
      sharingLevel:
        type: string
        enum: [private, partner_only, community, public]
        description: Level of sharing for goal progress
        example: partner_only
      checkInFrequency:
        type: string
        enum: [daily, weekly, bi_weekly, monthly]
        description: How often to check in on goal progress
        example: weekly
  motivation:
    type: object
    description: Motivation and reward system for the goal
    properties:
      whyStatement:
        type: string
        maxLength: 200
        description: Personal reason why this goal is important
        example: "I want to feel more confident and energetic for my wedding day"
      rewards:
        type: array
        description: Rewards for achieving milestones or the final goal
        items:
          type: object
          required:
            - milestone
            - reward
          properties:
            milestone:
              type: string
              description: Milestone or goal achievement trigger
              example: "Complete first 5kg"
            reward:
              type: string
              description: Reward for achieving the milestone
              example: "New workout outfit"
        example:
          - milestone: "Complete first 5kg"
            reward: "New workout outfit"
          - milestone: "Complete full goal"
            reward: "Weekend spa retreat"
  barriers:
    type: array
    description: Identified potential barriers to achieving the goal
    items:
      type: object
      required:
        - barrier
        - mitigation
      properties:
        barrier:
          type: string
          description: Description of the potential barrier
          example: "Busy work schedule limiting workout time"
        mitigation:
          type: string
          description: Strategy to overcome the barrier
          example: "Schedule 6 AM workouts before work starts"
        severity:
          type: string
          enum: [low, medium, high]
          description: Severity of the barrier
          example: medium
    example:
      - barrier: "Busy work schedule limiting workout time"
        mitigation: "Schedule 6 AM workouts before work starts"
        severity: medium
  resources:
    type: object
    description: Resources and support systems for achieving the goal
    properties:
      trainer:
        type: boolean
        description: Whether user has access to a personal trainer
        example: false
      nutritionist:
        type: boolean
        description: Whether user has access to a nutritionist
        example: true
      equipment:
        type: array
        description: Available equipment for achieving the goal
        items:
          type: string
        example: ["home gym", "resistance bands", "smart scale"]
      supportSystems:
        type: array
        description: Available support systems
        items:
          type: string
        example: ["family support", "fitness community", "mobile app"]
  adjustments:
    type: array
    description: Historical adjustments made to the goal
    items:
      type: object
      required:
        - date
        - type
        - description
      properties:
        date:
          type: string
          format: date-time
          description: Date when adjustment was made
          example: "2024-01-20T10:00:00Z"
        type:
          type: string
          enum: [target_value, target_date, strategy, milestone]
          description: Type of adjustment made
          example: target_date
        description:
          type: string
          description: Description of the adjustment and reason
          example: "Extended target date by 2 weeks due to illness recovery period"
        previousValue:
          type: string
          description: Previous value before adjustment
          example: "2024-04-01T00:00:00Z"
        newValue:
          type: string
          description: New value after adjustment
          example: "2024-04-15T00:00:00Z"
  completion:
    type: object
    description: Goal completion details (only present if goal is completed)
    properties:
      completedDate:
        type: string
        format: date-time
        description: Date when goal was completed
        example: "2024-04-10T00:00:00Z"
      finalValue:
        type: number
        format: float
        description: Final achieved value
        example: 65.2
      actualDuration:
        type: integer
        description: Actual duration to complete goal in days
        example: 98
      successFactors:
        type: array
        description: Key factors that contributed to success
        items:
          type: string
        example: ["Consistent morning workouts", "Meal prep on Sundays", "Accountability partner check-ins"]
      lessonsLearned:
        type: string
        maxLength: 300
        description: Key lessons learned during goal pursuit
        example: "Consistency was more important than perfection. Having rest days scheduled prevented burnout."
  metadata:
    type: object
    description: Goal metadata and system information
    properties:
      difficulty:
        type: string
        enum: [very_easy, easy, moderate, challenging, very_challenging]
        description: Assessed difficulty level of the goal
        example: moderate
      estimatedDuration:
        type: integer
        description: Estimated duration to complete goal in days
        example: 105
      aiGenerated:
        type: boolean
        description: Whether this goal was generated or suggested by AI
        example: false
      templateId:
        type: string
        format: uuid
        description: ID of goal template used (if any)
        example: "template_weight_loss_001"
  createdAt:
    type: string
    format: date-time
    description: Timestamp when goal was created
    example: "2024-01-01T10:00:00Z"
  updatedAt:
    type: string
    format: date-time
    description: Timestamp when goal was last updated
    example: "2024-01-15T10:30:00Z"
examples:
  - goalId: "456e7890-f12a-34b5-c678-def012345678"
    userId: "123e4567-e89b-12d3-a456-426614174000"
    title: "Lose 10kg"
    description: "Achieve a healthy weight loss of 10kg through consistent exercise and nutrition to improve overall health and confidence"
    category: weight_loss
    priority: high
    status: active
    target:
      value: 65.0
      unit: kg
      metric: weight
      direction: decrease
      targetType: absolute
    currentValue: 72.5
    startingValue: 75.0
    targetDate: "2024-04-15T00:00:00Z"
    startDate: "2024-01-01T10:00:00Z"
    progress:
      percentage: 0.25
      onTrack: true
      velocity: 0.18
      projectedCompletion: "2024-04-10T00:00:00Z"
      confidenceScore: 0.82
    milestones:
      - id: "milestone_001"
        title: "First 2.5kg"
        targetValue: 72.5
        targetDate: "2024-02-15T00:00:00Z"
        status: completed
        completedDate: "2024-01-15T00:00:00Z"
      - id: "milestone_002"
        title: "Halfway point - 5kg"
        targetValue: 70.0
        targetDate: "2024-03-01T00:00:00Z"
        status: active
    tags: ["health", "weight-management", "2024-goals"]
    isPublic: false
    accountability:
      hasAccountabilityPartner: true
      partnerUserId: "789abc12-def3-4567-8901-234567890abc"
      sharingLevel: partner_only
      checkInFrequency: weekly
    motivation:
      whyStatement: "I want to feel more confident and energetic for my wedding day"
      rewards:
        - milestone: "Complete first 5kg"
          reward: "New workout outfit"
        - milestone: "Complete full goal"
          reward: "Weekend spa retreat"
    barriers:
      - barrier: "Busy work schedule limiting workout time"
        mitigation: "Schedule 6 AM workouts before work starts"
        severity: medium
    resources:
      trainer: false
      nutritionist: true
      equipment: ["home gym", "resistance bands", "smart scale"]
      supportSystems: ["family support", "fitness community", "mobile app"]
    adjustments:
      - date: "2024-01-20T10:00:00Z"
        type: target_date
        description: "Extended target date by 2 weeks due to illness recovery period"
        previousValue: "2024-04-01T00:00:00Z"
        newValue: "2024-04-15T00:00:00Z"
    metadata:
      difficulty: moderate
      estimatedDuration: 105
      aiGenerated: false
      templateId: "template_weight_loss_001"
    createdAt: "2024-01-01T10:00:00Z"
    updatedAt: "2024-01-15T10:30:00Z" 