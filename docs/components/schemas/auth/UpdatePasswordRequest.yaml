type: object
required: [newPassword]
properties:
  newPassword:
    type: string
    minLength: 8
    pattern: "^(?=.*[a-z])(?=.*[A-Z])(?=.*\\d)(?=.*[@$!%*?&])[A-Za-z\\d@$!%*?&]"
    description: New password with complexity requirements
    example: NewSecurePass456!
example:
  newPassword: NewSecurePass456! 