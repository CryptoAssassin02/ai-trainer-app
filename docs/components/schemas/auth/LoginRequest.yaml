type: object
required: [email, password]
properties:
  email:
    type: string
    format: email
    description: User's email address
    example: user@example.com
  password:
    type: string
    minLength: 1
    description: User's password
    example: MySecurePassword123!
example:
  email: user@example.com
  password: MySecurePassword123! 