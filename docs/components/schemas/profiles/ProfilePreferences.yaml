type: object
required: [userId, updatedAt]
properties:
  userId:
    type: string
    format: uuid
    description: User's unique identifier
  unitPreference:
    type: string
    enum: [metric, imperial]
    description: Preferred unit system for measurements
  goals:
    type: array
    items:
      type: string
    nullable: true
    description: User's fitness objectives
  equipment:
    type: array
    items:
      type: string
    nullable: true
    description: Available fitness equipment
  experienceLevel:
    type: string
    enum: [beginner, intermediate, advanced]
    nullable: true
    description: User's fitness experience level
  workoutFrequency:
    type: string
    nullable: true
    description: Preferred workout frequency
  updatedAt:
    type: string
    format: date-time
    description: Preferences last update timestamp 