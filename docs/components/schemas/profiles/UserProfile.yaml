type: object
required: [id, userId, unitPreference, createdAt, updatedAt]
properties:
  id:
    type: string
    format: uuid
    description: Profile's unique identifier
  userId:
    type: string
    format: uuid
    description: User's unique identifier
  name:
    type: string
    nullable: true
    description: User's display name
  age:
    type: integer
    minimum: 13
    maximum: 120
    nullable: true
    description: User's age in years
  gender:
    type: string
    enum: [male, female, other, prefer_not_to_say, non-binary, ""]
    nullable: true
    description: User's gender identity
  height:
    oneOf:
      - type: number
        minimum: 0
        description: Height in centimeters (metric)
        example: 175.5
      - type: object
        required: [feet, inches]
        properties:
          feet:
            type: integer
            minimum: 0
            description: Height in feet
            example: 5
          inches:
            type: integer
            minimum: 0
            maximum: 11
            description: Height in inches
            example: 9
        description: Height in feet and inches (imperial)
        example: {feet: 5, inches: 9}
    nullable: true
    description: User's height (format depends on unitPreference - number for metric, object for imperial)
  weight:
    type: number
    minimum: 0
    nullable: true
    description: User's weight (kg for metric, lbs for imperial)
  unitPreference:
    type: string
    enum: [metric, imperial]
    description: Preferred unit system for measurements
  experienceLevel:
    type: string
    enum: [beginner, intermediate, advanced]
    nullable: true
    description: User's fitness experience level
  goals:
    type: array
    items:
      type: string
    nullable: true
    description: User's fitness objectives
  equipment:
    type: array
    items:
      type: string
    nullable: true
    description: Available fitness equipment
  medicalConditions:
    type: array
    items:
      type: string
    maxItems: 10
    nullable: true
    description: Medical conditions or limitations (healthcare data)
  workoutFrequency:
    type: string
    nullable: true
    description: Preferred workout frequency
  createdAt:
    type: string
    format: date-time
    description: Profile creation timestamp
  updatedAt:
    type: string
    format: date-time
    description: Profile last update timestamp 