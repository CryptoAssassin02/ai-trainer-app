type: object
properties:
  name:
    type: string
    minLength: 2
    maxLength: 100
    nullable: true
    description: User's display name
  age:
    type: integer
    minimum: 13
    maximum: 120
    nullable: true
    description: User's age in years
  gender:
    type: string
    enum: [male, female, other, prefer_not_to_say, non-binary, ""]
    nullable: true
    description: User's gender identity
  height:
    oneOf:
      - type: number
        minimum: 0
        description: Height in centimeters (metric)
      - type: object
        required: [feet, inches]
        properties:
          feet:
            type: integer
            minimum: 0
            description: Height in feet
          inches:
            type: integer
            minimum: 0
            maximum: 11
            description: Height in inches
        description: Height in feet and inches (imperial)
    nullable: true
    description: User's height (format depends on unit preference)
  weight:
    type: number
    minimum: 0
    nullable: true
    description: User's weight (kg for metric, lbs for imperial)
  unitPreference:
    type: string
    enum: [metric, imperial]
    description: Preferred unit system for measurements
  experienceLevel:
    type: string
    enum: [beginner, intermediate, advanced]
    nullable: true
    description: User's fitness experience level
  goals:
    type: array
    items:
      type: string
    nullable: true
    description: User's fitness objectives
  equipment:
    type: array
    items:
      type: string
    nullable: true
    description: Available fitness equipment
  exercisePreferences:
    type: array
    items:
      type: string
    nullable: true
    description: Preferred exercise types (mapped to equipment field in storage)
  equipmentPreferences:
    type: array
    items:
      type: string
    nullable: true
    description: Preferred equipment types (mapped to equipment field in storage)
  medicalConditions:
    type: array
    items:
      type: string
      minLength: 1
      maxLength: 200
      pattern: "^[a-zA-Z0-9\\s\\-.,()_]+$"
    maxItems: 10
    nullable: true
    description: Medical conditions or limitations (healthcare data with sanitization)
  workoutFrequency:
    type: string
    nullable: true
    description: Preferred workout frequency
description: Partial update of user profile - all fields optional
example:
  age: 31
  weight: 73.0
  goals: ["muscle_gain", "endurance"] 