type: object
description: Comprehensive progress metrics tracking fitness performance, improvements, and adherence indicators
required:
  - workoutFrequency
  - adherenceScore
  - strengthImprovement
  - enduranceImprovement
  - flexibilityScore
  - balanceScore
  - functionalMovementScore
properties:
  workoutFrequency:
    type: integer
    minimum: 0
    maximum: 14
    description: Number of workouts completed per week (averaged over measurement period)
    example: 5
  adherenceScore:
    type: number
    format: float
    minimum: 0
    maximum: 1
    description: Overall adherence to fitness plan (0-1, where 1 is perfect adherence)
    example: 0.87
  strengthImprovement:
    type: number
    format: float
    minimum: -1
    description: Strength improvement rate as a percentage (negative indicates decline)
    example: 0.18
  enduranceImprovement:
    type: number
    format: float
    minimum: -1
    description: Endurance improvement rate as a percentage (negative indicates decline)
    example: 0.12
  flexibilityScore:
    type: integer
    minimum: 1
    maximum: 10
    description: Self-assessed flexibility score on a scale of 1-10
    example: 7
  balanceScore:
    type: integer
    minimum: 1
    maximum: 10
    description: Self-assessed balance score on a scale of 1-10
    example: 8
  functionalMovementScore:
    type: integer
    minimum: 1
    maximum: 10
    description: Functional movement quality score on a scale of 1-10
    example: 8
  consistencyRating:
    type: number
    format: float
    minimum: 0
    maximum: 1
    description: Consistency in workout timing and execution (0-1)
    example: 0.82
  intensityProgression:
    type: number
    format: float
    minimum: -1
    description: Rate of intensity progression as a percentage
    example: 0.08
  volumeProgression:
    type: number
    format: float
    minimum: -1
    description: Rate of training volume progression as a percentage
    example: 0.15
  exerciseVariety:
    type: integer
    minimum: 0
    description: Number of different exercises performed in the measurement period
    example: 24
  personalRecords:
    type: object
    description: Personal records achieved during the measurement period
    properties:
      count:
        type: integer
        minimum: 0
        description: Number of personal records achieved
        example: 3
      categories:
        type: array
        description: Categories where personal records were achieved
        items:
          type: string
          enum: [strength, endurance, flexibility, balance, speed, power]
        example: ["strength", "endurance"]
      details:
        type: array
        description: Detailed list of personal records
        items:
          type: object
          required:
            - exercise
            - metric
            - value
            - dateAchieved
          properties:
            exercise:
              type: string
              description: Name of the exercise
              example: "Bench Press"
            metric:
              type: string
              enum: [weight, reps, duration, distance, speed]
              description: Type of metric for the record
              example: weight
            value:
              type: number
              format: float
              description: Value of the personal record
              example: 92.5
            unit:
              type: string
              description: Unit of measurement
              example: "kg"
            dateAchieved:
              type: string
              format: date-time
              description: Date when the record was achieved
              example: "2024-01-10T14:30:00Z"
            previousRecord:
              type: number
              format: float
              description: Previous record value for comparison
              example: 90.0
        example:
          - exercise: "Bench Press"
            metric: weight
            value: 92.5
            unit: "kg"
            dateAchieved: "2024-01-10T14:30:00Z"
            previousRecord: 90.0
  injuryRate:
    type: number
    format: float
    minimum: 0
    description: Rate of injuries per workout (lower is better)
    example: 0.02
  recoveryScore:
    type: integer
    minimum: 1
    maximum: 10
    description: Self-assessed recovery score on a scale of 1-10
    example: 7
  workoutSatisfaction:
    type: number
    format: float
    minimum: 1
    maximum: 10
    description: Average satisfaction rating for workouts (1-10)
    example: 8.3
  effortRating:
    type: number
    format: float
    minimum: 1
    maximum: 10
    description: Average perceived effort rating for workouts (1-10)
    example: 7.8
  progressConsistency:
    type: number
    format: float
    minimum: 0
    maximum: 1
    description: Consistency of progress over time (0-1, where 1 is perfectly consistent)
    example: 0.75
  plateauRisk:
    type: object
    description: Assessment of plateau risk across different fitness domains
    properties:
      overall:
        type: string
        enum: [low, medium, high]
        description: Overall plateau risk assessment
        example: low
      strength:
        type: string
        enum: [low, medium, high]
        description: Strength plateau risk
        example: medium
      endurance:
        type: string
        enum: [low, medium, high]
        description: Endurance plateau risk
        example: low
      recommendations:
        type: array
        description: Recommendations to avoid plateaus
        items:
          type: string
        example: ["Increase training variety", "Implement periodization"]
  adaptationRate:
    type: number
    format: float
    minimum: 0
    description: Rate of physiological adaptation to training (higher indicates faster adaptation)
    example: 0.73
  muscularEndurance:
    type: object
    description: Muscular endurance metrics
    properties:
      upperBody:
        type: integer
        minimum: 0
        description: Upper body muscular endurance score
        example: 78
      lowerBody:
        type: integer
        minimum: 0
        description: Lower body muscular endurance score
        example: 82
      core:
        type: integer
        minimum: 0
        description: Core muscular endurance score
        example: 75
  powerOutput:
    type: object
    description: Power output measurements
    properties:
      peak:
        type: number
        format: float
        minimum: 0
        description: Peak power output in watts
        example: 485.2
      average:
        type: number
        format: float
        minimum: 0
        description: Average power output in watts
        example: 312.7
      powerToWeightRatio:
        type: number
        format: float
        minimum: 0
        description: Power-to-weight ratio in watts/kg
        example: 4.16
examples:
  - workoutFrequency: 5
    adherenceScore: 0.87
    strengthImprovement: 0.18
    enduranceImprovement: 0.12
    flexibilityScore: 7
    balanceScore: 8
    functionalMovementScore: 8
    consistencyRating: 0.82
    intensityProgression: 0.08
    volumeProgression: 0.15
    exerciseVariety: 24
    personalRecords:
      count: 3
      categories: ["strength", "endurance"]
      details:
        - exercise: "Bench Press"
          metric: weight
          value: 92.5
          unit: "kg"
          dateAchieved: "2024-01-10T14:30:00Z"
          previousRecord: 90.0
        - exercise: "5K Run"
          metric: duration
          value: 1425
          unit: "seconds"
          dateAchieved: "2024-01-08T09:15:00Z"
          previousRecord: 1485
    injuryRate: 0.02
    recoveryScore: 7
    workoutSatisfaction: 8.3
    effortRating: 7.8
    progressConsistency: 0.75
    plateauRisk:
      overall: low
      strength: medium
      endurance: low
      recommendations: ["Increase training variety", "Implement periodization"]
    adaptationRate: 0.73
    muscularEndurance:
      upperBody: 78
      lowerBody: 82
      core: 75
    powerOutput:
      peak: 485.2
      average: 312.7
      powerToWeightRatio: 4.16 