type: object
description: Response containing a paginated list of progress check-ins with filtering, sorting, and summary metadata
required:
  - status
  - data
  - pagination
  - metadata
properties:
  status:
    type: string
    enum: [success]
    description: Response status indicator
    example: success
  data:
    type: array
    description: Array of check-in objects
    items:
      $ref: './CheckIn.yaml'
    minItems: 0
    maxItems: 100
  pagination:
    type: object
    description: Pagination information for the check-ins list
    required:
      - currentPage
      - totalPages
      - totalItems
      - itemsPerPage
    properties:
      currentPage:
        type: integer
        minimum: 1
        description: Current page number
        example: 1
      totalPages:
        type: integer
        minimum: 0
        description: Total number of pages available
        example: 3
      totalItems:
        type: integer
        minimum: 0
        description: Total number of check-ins matching the query
        example: 25
      itemsPerPage:
        type: integer
        minimum: 1
        maximum: 100
        description: Number of items per page
        example: 10
      hasNextPage:
        type: boolean
        description: Whether there are more pages after the current one
        example: true
      hasPreviousPage:
        type: boolean
        description: Whether there are pages before the current one
        example: false
      nextPageUrl:
        type: string
        format: uri
        description: URL to fetch the next page
        example: "/v1/progress/check-ins?page=2&limit=10"
      previousPageUrl:
        type: string
        format: uri
        description: URL to fetch the previous page
        example: null
  metadata:
    type: object
    description: Response metadata including filters, sorting, and summary statistics
    required:
      - timestamp
      - appliedFilters
      - sortOrder
    properties:
      timestamp:
        type: string
        format: date-time
        description: Response generation timestamp
        example: "2024-01-15T10:30:00Z"
      appliedFilters:
        type: object
        description: Filters that were applied to this query
        properties:
          dateRange:
            type: object
            properties:
              from:
                type: string
                format: date-time
                example: "2024-01-01T00:00:00Z"
              to:
                type: string
                format: date-time
                example: "2024-01-31T23:59:59Z"
          checkInType:
            type: array
            items:
              type: string
              enum: [weekly, bi_weekly, monthly, custom, milestone]
            example: ["weekly", "monthly"]
          completionStatus:
            type: array
            items:
              type: string
              enum: [complete, partial, draft]
            example: ["complete"]
          hasPhotos:
            type: boolean
            description: Filter for check-ins with or without photos
            example: true
          tags:
            type: array
            items:
              type: string
            example: ["strength_week"]
      sortOrder:
        type: object
        description: Applied sorting configuration
        properties:
          field:
            type: string
            enum: [checkInDate, createdAt, completionStatus, mood]
            description: Field used for sorting
            example: checkInDate
          direction:
            type: string
            enum: [asc, desc]
            description: Sort direction
            example: desc
      summary:
        type: object
        description: Summary statistics for the filtered check-ins
        properties:
          totalCheckIns:
            type: integer
            description: Total number of check-ins in the filtered set
            example: 25
          completedCheckIns:
            type: integer
            description: Number of completed check-ins
            example: 23
          averageMood:
            type: number
            format: float
            minimum: 1
            maximum: 10
            description: Average mood rating across check-ins
            example: 7.3
          checkInFrequency:
            type: object
            description: Check-in frequency breakdown
            properties:
              weekly:
                type: integer
                example: 18
              bi_weekly:
                type: integer
                example: 4
              monthly:
                type: integer
                example: 3
          photoCount:
            type: integer
            description: Total number of progress photos
            example: 47
          averageCompletionTime:
            type: number
            format: float
            description: Average time spent on check-ins in minutes
            example: 12.7
      processingTime:
        type: number
        format: float
        description: Response processing time in milliseconds
        example: 89.3
examples:
  - status: success
    data:
      - checkInId: "987fcdeb-51a2-43d7-9abc-def012345678"
        userId: "123e4567-e89b-12d3-a456-426614174000"
        checkInDate: "2024-01-15T10:30:00Z"
        bodyMeasurements:
          weight: 75.2
          height: 175.5
          bodyFatPercentage: 18.5
        wellnessMetrics:
          energyLevel: 8
          mood: 7
          sleepQuality: 8
        progressMetrics:
          workoutFrequency: 5
          adherenceScore: 0.87
        checkInType: weekly
        completionStatus: complete
        createdAt: "2024-01-15T10:30:00Z"
      - checkInId: "876fedcb-42a1-54d8-8bcd-cde123456789"
        userId: "123e4567-e89b-12d3-a456-426614174000"
        checkInDate: "2024-01-08T09:15:00Z"
        bodyMeasurements:
          weight: 75.5
          height: 175.5
          bodyFatPercentage: 18.8
        wellnessMetrics:
          energyLevel: 7
          mood: 8
          sleepQuality: 7
        progressMetrics:
          workoutFrequency: 4
          adherenceScore: 0.82
        checkInType: weekly
        completionStatus: complete
        createdAt: "2024-01-08T09:15:00Z"
    pagination:
      currentPage: 1
      totalPages: 3
      totalItems: 25
      itemsPerPage: 10
      hasNextPage: true
      hasPreviousPage: false
      nextPageUrl: "/v1/progress/check-ins?page=2&limit=10"
      previousPageUrl: null
    metadata:
      timestamp: "2024-01-15T10:30:00Z"
      appliedFilters:
        dateRange:
          from: "2024-01-01T00:00:00Z"
          to: "2024-01-31T23:59:59Z"
        checkInType: ["weekly", "monthly"]
        completionStatus: ["complete"]
        hasPhotos: true
        tags: ["strength_week"]
      sortOrder:
        field: checkInDate
        direction: desc
      summary:
        totalCheckIns: 25
        completedCheckIns: 23
        averageMood: 7.3
        checkInFrequency:
          weekly: 18
          bi_weekly: 4
          monthly: 3
        photoCount: 47
        averageCompletionTime: 12.7
      processingTime: 89.3 