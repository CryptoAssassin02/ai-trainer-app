type: object
description: Individual progress check-in containing comprehensive fitness and wellness tracking data
required:
  - checkInId
  - userId
  - checkInDate
  - bodyMeasurements
  - wellnessMetrics
  - progressMetrics
  - createdAt
properties:
  checkInId:
    type: string
    format: uuid
    description: Unique identifier for this check-in
    example: "987fcdeb-51a2-43d7-9abc-def012345678"
  userId:
    type: string
    format: uuid
    description: Unique identifier for the user
    example: "123e4567-e89b-12d3-a456-426614174000"
  checkInDate:
    type: string
    format: date-time
    description: Date and time when the check-in was recorded
    example: "2024-01-15T10:30:00Z"
  bodyMeasurements:
    $ref: './BodyMeasurements.yaml'
  wellnessMetrics:
    $ref: './WellnessMetrics.yaml'
  progressMetrics:
    $ref: './ProgressMetrics.yaml'
  notes:
    type: string
    description: Optional user notes for this check-in
    maxLength: 1000
    example: "Feeling strong and motivated this week. Sleep has been better."
  photos:
    type: array
    description: Progress photos associated with this check-in
    items:
      type: object
      required:
        - photoId
        - type
        - url
      properties:
        photoId:
          type: string
          description: Unique identifier for the photo
          example: "photo_001"
        type:
          type: string
          enum: [front, side, back, custom]
          description: Type of progress photo
          example: front
        url:
          type: string
          format: uri
          description: URL to access the photo
          example: "https://storage.example.com/photos/photo_001.jpg"
        uploadedAt:
          type: string
          format: date-time
          description: When the photo was uploaded
          example: "2024-01-15T10:25:00Z"
        metadata:
          type: object
          description: Additional photo metadata
          properties:
            fileSize:
              type: integer
              description: File size in bytes
              example: 2048576
            dimensions:
              type: object
              properties:
                width:
                  type: integer
                  example: 1920
                height:
                  type: integer
                  example: 1080
            format:
              type: string
              enum: [jpg, jpeg, png, webp]
              example: jpg
  mood:
    type: integer
    minimum: 1
    maximum: 10
    description: Self-reported mood on a scale of 1-10
    example: 7
  checkInType:
    type: string
    enum: [weekly, bi_weekly, monthly, custom, milestone]
    description: Type of check-in performed
    example: weekly
  completionStatus:
    type: string
    enum: [complete, partial, draft]
    description: Status of the check-in completion
    example: complete
  duration:
    type: integer
    minimum: 0
    description: Time spent on check-in in minutes
    example: 15
  location:
    type: object
    description: Location where check-in was performed
    properties:
      type:
        type: string
        enum: [home, gym, office, outdoor, other]
        description: Type of location
        example: home
      name:
        type: string
        description: Name or description of the location
        example: "Home gym"
  deviceInfo:
    type: object
    description: Information about the device used for check-in
    properties:
      platform:
        type: string
        enum: [ios, android, web]
        description: Platform used for check-in
        example: ios
      appVersion:
        type: string
        description: Version of the app used
        example: "1.2.3"
  tags:
    type: array
    description: Optional tags for categorizing check-ins
    items:
      type: string
    example: ["strength_week", "recovery_focus"]
  isPublic:
    type: boolean
    description: Whether this check-in can be shared publicly
    default: false
    example: false
  createdAt:
    type: string
    format: date-time
    description: Timestamp when check-in was created
    example: "2024-01-15T10:30:00Z"
  updatedAt:
    type: string
    format: date-time
    description: Timestamp when check-in was last updated
    example: "2024-01-15T10:35:00Z"
examples:
  - checkInId: "987fcdeb-51a2-43d7-9abc-def012345678"
    userId: "123e4567-e89b-12d3-a456-426614174000"
    checkInDate: "2024-01-15T10:30:00Z"
    bodyMeasurements:
      weight: 75.2
      height: 175.5
      bodyFatPercentage: 18.5
      muscleMass: 61.3
      waistCircumference: 82.0
      chestCircumference: 102.5
      armCircumference: 35.2
      thighCircumference: 58.1
    wellnessMetrics:
      energyLevel: 8
      mood: 7
      sleepQuality: 8
      sleepDuration: 7.5
      stressLevel: 4
      motivation: 9
      overallWellness: 8
    progressMetrics:
      workoutFrequency: 5
      adherenceScore: 0.87
      strengthImprovement: 0.15
      enduranceImprovement: 0.12
      flexibilityScore: 7
      balanceScore: 8
      functionalMovementScore: 8
    notes: "Feeling strong and motivated this week. Sleep has been much better since adjusting bedtime routine."
    photos:
      - photoId: "photo_001"
        type: front
        url: "https://storage.example.com/photos/photo_001.jpg"
        uploadedAt: "2024-01-15T10:25:00Z"
        metadata:
          fileSize: 2048576
          dimensions:
            width: 1920
            height: 1080
          format: jpg
    mood: 7
    checkInType: weekly
    completionStatus: complete
    duration: 15
    location:
      type: home
      name: "Home gym"
    deviceInfo:
      platform: ios
      appVersion: "1.2.3"
    tags: ["strength_week", "recovery_focus"]
    isPublic: false
    createdAt: "2024-01-15T10:30:00Z"
    updatedAt: "2024-01-15T10:35:00Z" 