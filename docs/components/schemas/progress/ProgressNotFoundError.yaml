type: object
required: [status, error, message]
properties:
  status:
    type: string
    enum: [error]
    description: Response status
  error:
    type: string
    enum: [PROGRESS_NOT_FOUND]
    description: Error code
  message:
    type: string
    description: Human-readable error message
  details:
    type: object
    properties:
      resource:
        type: string
        enum: [check-in, progress-data, metrics, goals]
        description: Type of resource that was not found
      resourceId:
        type: string
        description: ID of the specific resource that was not found
      searchCriteria:
        type: object
        description: Criteria used to search for the resource
      alternatives:
        type: array
        items:
          type: object
          properties:
            type:
              type: string
            id:
              type: string
            date:
              type: string
              format: date
        description: Alternative resources that might be relevant
      suggestions:
        type: array
        items:
          type: string
        description: Suggestions for finding the desired data
    description: Details about what was not found
  timestamp:
    type: string
    format: date-time
    description: Error timestamp
  requestId:
    type: string
    description: Unique request identifier for support 