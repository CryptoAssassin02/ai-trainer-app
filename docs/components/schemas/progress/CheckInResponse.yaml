type: object
description: Response containing individual progress check-in data with validation and processing metadata
required:
  - status
  - data
  - metadata
properties:
  status:
    type: string
    enum: [success]
    description: Response status indicator
    example: success
  data:
    $ref: './CheckIn.yaml'
  metadata:
    type: object
    description: Response metadata including validation results and processing information
    required:
      - timestamp
      - checkInId
      - validationStatus
    properties:
      timestamp:
        type: string
        format: date-time
        description: Response generation timestamp
        example: "2024-01-15T10:30:00Z"
      checkInId:
        type: string
        format: uuid
        description: Unique identifier for this check-in
        example: "987fcdeb-51a2-43d7-9abc-def012345678"
      validationStatus:
        type: object
        description: Validation results for the check-in data
        required:
          - isValid
          - completeness
        properties:
          isValid:
            type: boolean
            description: Whether the check-in passed all validation rules
            example: true
          completeness:
            type: number
            format: float
            minimum: 0
            maximum: 1
            description: Completeness score of the check-in data (0-1)
            example: 0.87
          missingFields:
            type: array
            description: List of optional fields that were not provided
            items:
              type: string
            example: ["body_fat_percentage", "additional_notes"]
          warnings:
            type: array
            description: Non-critical validation warnings
            items:
              type: string
            example: ["Weight measurement outside typical range"]
      processingTime:
        type: number
        format: float
        description: Response processing time in milliseconds
        example: 23.4
      dataQuality:
        type: object
        description: Assessment of check-in data quality
        properties:
          score:
            type: number
            format: float
            minimum: 0
            maximum: 1
            description: Overall data quality score (0-1)
            example: 0.92
          factors:
            type: array
            description: Factors affecting data quality
            items:
              type: string
            example: ["Complete measurements", "Consistent timing", "Reasonable values"]
      nextCheckInRecommended:
        type: string
        format: date-time
        description: Recommended date/time for next check-in
        example: "2024-01-22T10:30:00Z"
examples:
  - status: success
    data:
      checkInId: "987fcdeb-51a2-43d7-9abc-def012345678"
      userId: "123e4567-e89b-12d3-a456-426614174000"
      checkInDate: "2024-01-15T10:30:00Z"
      bodyMeasurements:
        weight: 75.2
        height: 175.5
        bodyFatPercentage: 18.5
        muscleMass: 61.3
      wellnessMetrics:
        energyLevel: 8
        mood: 7
        sleepQuality: 8
        stressLevel: 4
        motivation: 9
      progressMetrics:
        workoutFrequency: 5
        adherenceScore: 0.87
        strengthImprovement: 0.15
      notes: "Feeling strong and motivated this week"
      photos:
        - photoId: "photo_001"
          type: front
          url: "https://storage.example.com/photos/photo_001.jpg"
      createdAt: "2024-01-15T10:30:00Z"
    metadata:
      timestamp: "2024-01-15T10:30:00Z"
      checkInId: "987fcdeb-51a2-43d7-9abc-def012345678"
      validationStatus:
        isValid: true
        completeness: 0.87
        missingFields: ["body_fat_percentage"]
        warnings: []
      processingTime: 23.4
      dataQuality:
        score: 0.92
        factors: ["Complete measurements", "Consistent timing", "Reasonable values"]
      nextCheckInRecommended: "2024-01-22T10:30:00Z" 