type: object
required: [status, error, message]
properties:
  status:
    type: string
    enum: [error]
    description: Response status
  error:
    type: string
    enum: [PROGRESS_RATE_LIMIT_ERROR]
    description: Error code
  message:
    type: string
    description: Human-readable error message
  details:
    type: object
    properties:
      limitType:
        type: string
        enum: [check_ins_per_day, metrics_calculations_per_hour, photo_uploads_per_day, measurement_updates_per_hour, wellness_tracking_per_day]
        description: Type of rate limit exceeded
      current:
        type: integer
        description: Current usage count
      limit:
        type: integer
        description: Maximum allowed usage
      resetTime:
        type: string
        format: date-time
        description: When the rate limit resets
      retryAfter:
        type: integer
        description: Seconds to wait before retrying
      progressSpecific:
        type: object
        properties:
          checkInFrequency:
            type: string
            enum: [too_frequent, daily_limit_reached, bulk_submission_detected]
            description: Check-in frequency issue
          measurementTypes:
            type: array
            items:
              type: string
              enum: [weight, body_fat, measurements, photos, wellness]
            description: Types of measurements affected
          dataQuality:
            type: string
            enum: [acceptable, suspicious_patterns, rapid_fluctuations]
            description: Quality of submitted progress data
          bulkOperations:
            type: boolean
            description: Whether bulk operations are being rate limited
        description: Progress-specific rate limiting factors
      recommendations:
        type: object
        properties:
          spacing:
            type: string
            description: Recommended spacing between check-ins
          batchOptimization:
            type: boolean
            description: Whether to batch multiple measurements
          prioritizeMetrics:
            type: boolean
            description: Whether to prioritize certain metrics
          useCaching:
            type: boolean
            description: Whether to use cached calculations
        description: Optimization recommendations for progress tracking
      alternatives:
        type: object
        properties:
          viewOnly:
            type: boolean
            description: Whether view-only mode is available
          cachedMetrics:
            type: boolean
            description: Whether cached metrics can be displayed
          manualEntry:
            type: boolean
            description: Whether manual entry is still allowed
          photoSubmission:
            type: boolean
            description: Whether photo submission is still allowed
        description: Alternative options during rate limiting
      quota:
        type: object
        properties:
          daily:
            type: object
            properties:
              checkIns:
                type: object
                properties:
                  used:
                    type: integer
                  remaining:
                    type: integer
                  total:
                    type: integer
              photoUploads:
                type: object
                properties:
                  used:
                    type: integer
                  remaining:
                    type: integer
                  total:
                    type: integer
          hourly:
            type: object
            properties:
              metricsCalculations:
                type: object
                properties:
                  used:
                    type: integer
                  remaining:
                    type: integer
                  total:
                    type: integer
              measurementUpdates:
                type: object
                properties:
                  used:
                    type: integer
                  remaining:
                    type: integer
                  total:
                    type: integer
        description: Detailed quota information for progress tracking
      userBehavior:
        type: object
        properties:
          checkInPattern:
            type: string
            enum: [consistent, sporadic, binge, automated]
            description: User's check-in pattern
          dataAccuracy:
            type: string
            enum: [high, moderate, low, questionable]
            description: Accuracy of submitted data
          engagementLevel:
            type: string
            enum: [high, moderate, low]
            description: User engagement level
          adaptiveLimit:
            type: boolean
            description: Whether adaptive limiting is applied
        description: User behavior analysis affecting rate limits
      healthAndSafety:
        type: object
        properties:
          rapidWeightChange:
            type: boolean
            description: Whether rapid weight changes were detected
          extremeValues:
            type: boolean
            description: Whether extreme measurement values were submitted
          consistencyCheck:
            type: string
            enum: [passed, warning, failed]
            description: Data consistency check result
          safetyAlert:
            type: boolean
            description: Whether safety alert was triggered
        description: Health and safety considerations
    description: Detailed progress rate limit information
  timestamp:
    type: string
    format: date-time
    description: Error timestamp
  requestId:
    type: string
    description: Unique request identifier for support 