type: object
description: Comprehensive body measurements tracking physical changes and body composition metrics
required:
  - weight
  - height
properties:
  weight:
    type: number
    format: float
    minimum: 0
    maximum: 1000
    description: Body weight in kilograms
    example: 75.2
  height:
    type: number
    format: float
    minimum: 0
    maximum: 300
    description: Height in centimeters
    example: 175.5
  bodyFatPercentage:
    type: number
    format: float
    minimum: 0
    maximum: 100
    description: Body fat percentage
    example: 18.5
  muscleMass:
    type: number
    format: float
    minimum: 0
    description: Muscle mass in kilograms
    example: 61.3
  boneMass:
    type: number
    format: float
    minimum: 0
    description: Bone mass in kilograms
    example: 3.2
  waterPercentage:
    type: number
    format: float
    minimum: 0
    maximum: 100
    description: Body water percentage
    example: 62.3
  visceralFat:
    type: integer
    minimum: 1
    maximum: 60
    description: Visceral fat rating (1-60, lower is better)
    example: 8
  metabolicAge:
    type: integer
    minimum: 10
    maximum: 100
    description: Metabolic age in years
    example: 28
  circumferences:
    type: object
    description: Body circumference measurements in centimeters
    properties:
      neck:
        type: number
        format: float
        minimum: 0
        description: Neck circumference in cm
        example: 38.5
      chest:
        type: number
        format: float
        minimum: 0
        description: Chest circumference in cm
        example: 102.5
      waist:
        type: number
        format: float
        minimum: 0
        description: Waist circumference in cm
        example: 82.0
      hips:
        type: number
        format: float
        minimum: 0
        description: Hip circumference in cm
        example: 95.3
      leftArm:
        type: number
        format: float
        minimum: 0
        description: Left arm circumference in cm
        example: 35.2
      rightArm:
        type: number
        format: float
        minimum: 0
        description: Right arm circumference in cm
        example: 35.0
      leftThigh:
        type: number
        format: float
        minimum: 0
        description: Left thigh circumference in cm
        example: 58.1
      rightThigh:
        type: number
        format: float
        minimum: 0
        description: Right thigh circumference in cm
        example: 58.3
      leftCalf:
        type: number
        format: float
        minimum: 0
        description: Left calf circumference in cm
        example: 37.8
      rightCalf:
        type: number
        format: float
        minimum: 0
        description: Right calf circumference in cm
        example: 37.5
      forearm:
        type: number
        format: float
        minimum: 0
        description: Forearm circumference in cm
        example: 28.2
  skinfolds:
    type: object
    description: Skinfold measurements in millimeters for body fat calculation
    properties:
      bicep:
        type: number
        format: float
        minimum: 0
        description: Bicep skinfold in mm
        example: 8.5
      tricep:
        type: number
        format: float
        minimum: 0
        description: Tricep skinfold in mm
        example: 12.3
      subscapular:
        type: number
        format: float
        minimum: 0
        description: Subscapular skinfold in mm
        example: 15.7
      suprailiac:
        type: number
        format: float
        minimum: 0
        description: Suprailiac skinfold in mm
        example: 18.2
      abdominal:
        type: number
        format: float
        minimum: 0
        description: Abdominal skinfold in mm
        example: 22.1
      thigh:
        type: number
        format: float
        minimum: 0
        description: Thigh skinfold in mm
        example: 16.4
      chest:
        type: number
        format: float
        minimum: 0
        description: Chest skinfold in mm
        example: 9.8
  bodySegmentAnalysis:
    type: object
    description: Detailed body segment composition analysis
    properties:
      torso:
        type: object
        properties:
          fatPercentage:
            type: number
            format: float
            example: 16.2
          musclePercentage:
            type: number
            format: float
            example: 83.8
      leftArm:
        type: object
        properties:
          fatPercentage:
            type: number
            format: float
            example: 15.8
          musclePercentage:
            type: number
            format: float
            example: 84.2
      rightArm:
        type: object
        properties:
          fatPercentage:
            type: number
            format: float
            example: 15.9
          musclePercentage:
            type: number
            format: float
            example: 84.1
      leftLeg:
        type: object
        properties:
          fatPercentage:
            type: number
            format: float
            example: 19.3
          musclePercentage:
            type: number
            format: float
            example: 80.7
      rightLeg:
        type: object
        properties:
          fatPercentage:
            type: number
            format: float
            example: 19.1
          musclePercentage:
            type: number
            format: float
            example: 80.9
  ratios:
    type: object
    description: Body measurement ratios for health and aesthetics assessment
    properties:
      waistToHipRatio:
        type: number
        format: float
        minimum: 0
        description: Waist-to-hip ratio
        example: 0.86
      waistToHeightRatio:
        type: number
        format: float
        minimum: 0
        description: Waist-to-height ratio
        example: 0.47
      shoulderToWaistRatio:
        type: number
        format: float
        minimum: 0
        description: Shoulder-to-waist ratio
        example: 1.25
      armToWaistRatio:
        type: number
        format: float
        minimum: 0
        description: Arm-to-waist ratio
        example: 0.43
  measurementConditions:
    type: object
    description: Conditions under which measurements were taken
    properties:
      timeOfDay:
        type: string
        enum: [morning, afternoon, evening]
        description: Time of day when measured
        example: morning
      postWorkout:
        type: boolean
        description: Whether measured after workout
        example: false
      hydrationStatus:
        type: string
        enum: [well_hydrated, normal, dehydrated]
        description: Hydration status during measurement
        example: well_hydrated
      lastMeal:
        type: integer
        minimum: 0
        description: Hours since last meal
        example: 12
      clothingType:
        type: string
        enum: [minimal, workout_clothes, regular_clothes]
        description: Type of clothing worn during measurement
        example: minimal
      measurementTool:
        type: string
        enum: [bioimpedance_scale, dexa_scan, bod_pod, hydrostatic_weighing, skinfold_calipers, tape_measure]
        description: Primary tool used for measurements
        example: bioimpedance_scale
  measurementAccuracy:
    type: object
    description: Assessment of measurement accuracy and reliability
    properties:
      reliability:
        type: string
        enum: [high, medium, low]
        description: Overall reliability of measurements
        example: high
      precision:
        type: number
        format: float
        minimum: 0
        maximum: 1
        description: Precision score (0-1)
        example: 0.92
      calibrationStatus:
        type: string
        enum: [recently_calibrated, needs_calibration, unknown]
        description: Equipment calibration status
        example: recently_calibrated
      environmentalFactors:
        type: array
        description: Environmental factors that may affect accuracy
        items:
          type: string
          enum: [temperature_extreme, humidity_high, humidity_low, electromagnetic_interference, movement_during_measurement]
        example: []
examples:
  - weight: 75.2
    height: 175.5
    bodyFatPercentage: 18.5
    muscleMass: 61.3
    boneMass: 3.2
    waterPercentage: 62.3
    visceralFat: 8
    metabolicAge: 28
    circumferences:
      neck: 38.5
      chest: 102.5
      waist: 82.0
      hips: 95.3
      leftArm: 35.2
      rightArm: 35.0
      leftThigh: 58.1
      rightThigh: 58.3
      leftCalf: 37.8
      rightCalf: 37.5
      forearm: 28.2
    skinfolds:
      bicep: 8.5
      tricep: 12.3
      subscapular: 15.7
      suprailiac: 18.2
      abdominal: 22.1
      thigh: 16.4
      chest: 9.8
    bodySegmentAnalysis:
      torso:
        fatPercentage: 16.2
        musclePercentage: 83.8
      leftArm:
        fatPercentage: 15.8
        musclePercentage: 84.2
      rightArm:
        fatPercentage: 15.9
        musclePercentage: 84.1
      leftLeg:
        fatPercentage: 19.3
        musclePercentage: 80.7
      rightLeg:
        fatPercentage: 19.1
        musclePercentage: 80.9
    ratios:
      waistToHipRatio: 0.86
      waistToHeightRatio: 0.47
      shoulderToWaistRatio: 1.25
      armToWaistRatio: 0.43
    measurementConditions:
      timeOfDay: morning
      postWorkout: false
      hydrationStatus: well_hydrated
      lastMeal: 12
      clothingType: minimal
      measurementTool: bioimpedance_scale
    measurementAccuracy:
      reliability: high
      precision: 0.92
      calibrationStatus: recently_calibrated
      environmentalFactors: [] 