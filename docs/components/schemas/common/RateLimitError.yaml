type: object
required:
  - status
  - message
  - code
properties:
  status:
    type: string
    enum: [error]
  message:
    type: string
    description: Rate limit error message
  code:
    type: string
    enum: 
      - RATE_LIMIT_EXCEEDED
      - AUTH_RATE_LIMIT_EXCEEDED
      - API_RATE_LIMIT_EXCEEDED
      - WORKOUT_GEN_LIMIT_EXCEEDED
      - AI_OPERATION_LIMIT_EXCEEDED
    description: Specific rate limit error code
example:
  status: error
  message: Too many requests. Please try again later.
  code: RATE_LIMIT_EXCEEDED 