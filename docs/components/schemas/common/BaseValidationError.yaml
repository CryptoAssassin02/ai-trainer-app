type: object
description: Base validation error schema with common fields across all categories
required:
  - status
  - error
  - message
properties:
  status:
    type: string
    enum: [error]
    description: Response status indicator
    example: "error"
  error:
    type: string
    description: Category-specific error code (defined in extending schemas)
    example: "VALIDATION_ERROR"
  message:
    type: string
    description: Human-readable error message
    example: "Validation failed"
  details:
    type: object
    description: Detailed validation error information (structure varies by category)
    properties:
      field:
        type: string
        description: Field that failed validation
        example: "email"
      value:
        type: string
        description: Invalid value provided
        example: "invalid-value"
      constraint:
        type: string
        description: Validation constraint that was violated
        example: "required"
    additionalProperties: true
  timestamp:
    type: string
    format: date-time
    description: Error timestamp
    example: "2024-01-15T10:30:00Z"
  requestId:
    type: string
    description: Unique request identifier for support
    example: "req_abc123xyz" 