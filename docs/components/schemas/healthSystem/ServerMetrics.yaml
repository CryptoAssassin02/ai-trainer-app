type: object
description: Comprehensive server resource metrics and system information
properties:
  uptime:
    $ref: './UptimeMetrics.yaml'
    description: Formatted server uptime information
  
  nodeVersion:
    type: string
    description: Node.js version currently running
    pattern: '^v\d+\.\d+\.\d+$'
    example: "v18.17.0"
  
  memoryUsage:
    type: object
    description: Node.js process memory usage statistics
    properties:
      rss:
        type: integer
        description: Resident Set Size - total memory allocated for the process in bytes
        minimum: 0
        example: 125829120
      
      heapTotal:
        type: integer
        description: Total heap memory allocated in bytes
        minimum: 0
        example: 83886080
      
      heapUsed:
        type: integer
        description: Heap memory currently in use in bytes
        minimum: 0
        example: 56234896
      
      external:
        type: integer
        description: Memory used by C++ objects bound to JavaScript objects in bytes
        minimum: 0
        example: 2048576
      
      arrayBuffers:
        type: integer
        description: Memory allocated for ArrayBuffers and SharedArrayBuffers in bytes
        minimum: 0
        example: 1024000
    
    required:
      - rss
      - heapTotal
      - heapUsed
      - external
      - arrayBuffers
    
    additionalProperties: false
  
  cpuLoad:
    type: array
    description: System CPU load averages for 1, 5, and 15 minutes
    items:
      type: number
      minimum: 0
    minItems: 3
    maxItems: 3
    example: [0.15, 0.23, 0.18]
  
  platform:
    type: string
    description: Operating system platform
    enum: [linux, darwin, win32, freebsd, openbsd, aix]
    example: "linux"
  
  arch:
    type: string
    description: CPU architecture
    enum: [x64, x32, arm64, arm, s390x, ppc64]
    example: "x64"

required:
  - uptime
  - nodeVersion
  - memoryUsage
  - cpuLoad
  - platform
  - arch

additionalProperties: false

example:
  uptime:
    days: 5
    hours: 12
    minutes: 34
    seconds: 28
  nodeVersion: "v18.17.0"
  memoryUsage:
    rss: 125829120
    heapTotal: 83886080
    heapUsed: 56234896
    external: 2048576
    arrayBuffers: 1024000
  cpuLoad: [0.15, 0.23, 0.18]
  platform: "linux"
  arch: "x64" 