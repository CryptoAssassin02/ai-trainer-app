type: object
description: Comprehensive system health response with detailed server metrics
properties:
  status:
    type: string
    enum: [ok]
    description: Overall system health status
    example: "ok"
  
  timestamp:
    type: string
    format: date-time
    description: ISO timestamp when the health check was performed
    example: "2024-01-15T10:30:45.123Z"
  
  environment:
    type: string
    description: Current deployment environment
    enum: [development, staging, production]
    example: "production"
  
  server:
    $ref: './ServerMetrics.yaml'

required:
  - status
  - timestamp
  - environment
  - server

additionalProperties: false

example:
  status: "ok"
  timestamp: "2024-01-15T10:30:45.123Z"
  environment: "production"
  server:
    uptime:
      days: 5
      hours: 12
      minutes: 34
      seconds: 28
    nodeVersion: "v18.17.0"
    memoryUsage:
      rss: 125829120
      heapTotal: 83886080
      heapUsed: 56234896
      external: 2048576
      arrayBuffers: 1024000
    cpuLoad: [0.15, 0.23, 0.18]
    platform: "linux"
    arch: "x64" 