type: object
description: Database connectivity health check response
properties:
  status:
    type: string
    enum: [ok, error]
    description: Database connectivity status
    example: "ok"
  
  info:
    $ref: './DatabaseConnectionInfo.yaml'
    description: Connection information (present when status is 'ok')
  
  message:
    type: string
    description: Error message (present when status is 'error')
    example: "Failed to check Supabase connection"
  
  error:
    type: string
    description: Detailed error information (present when status is 'error')
    example: "Connection timeout after 5000ms"

required:
  - status

additionalProperties: false

examples:
  success:
    summary: Successful database connection
    value:
      status: "ok"
      info:
        connected: true
        responseTime: "45ms"
        timestamp: "2024-01-15T10:30:45.123Z"
  
  error:
    summary: Failed database connection
    value:
      status: "error"
      message: "Failed to check Supabase connection"
      error: "Connection timeout after 5000ms" 