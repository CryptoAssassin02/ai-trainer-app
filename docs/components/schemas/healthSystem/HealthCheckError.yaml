type: object
description: Generic health check failure response
properties:
  status:
    type: string
    enum: [error]
    description: Error status indicator
    example: "error"
  
  message:
    type: string
    description: Human-readable error message
    example: "Health check failed due to system unavailability"
  
  timestamp:
    type: string
    format: date-time
    description: ISO timestamp when the error occurred
    example: "2024-01-15T10:30:45.123Z"
  
  details:
    type: object
    description: Additional error details and context
    properties:
      component:
        type: string
        description: System component that failed
        example: "system-health"
      
      errorCode:
        type: string
        description: Internal error code for troubleshooting
        enum: [CONFIGURATION_ERROR, EXTERNAL_SERVICE_ERROR, RESOURCE_ERROR]
        example: "RESOURCE_ERROR"
      
      retryable:
        type: boolean
        description: Whether the operation can be retried
        example: true
    
    additionalProperties: true

required:
  - status
  - message
  - timestamp

additionalProperties: false

example:
  status: "error"
  message: "Health check failed due to system unavailability"
  timestamp: "2024-01-15T10:30:45.123Z"
  details:
    component: "system-health"
    errorCode: "RESOURCE_ERROR"
    retryable: true 