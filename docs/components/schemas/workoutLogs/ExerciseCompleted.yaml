type: object
description: Schema representing a single completed exercise within a workout log
required:
  - exercise_id
  - exercise_name
  - sets_completed
  - reps_completed
  - weights_used
properties:
  exercise_id:
    type: string
    description: Unique identifier for the exercise
    example: "bench-press"
  exercise_name:
    type: string
    description: Display name of the exercise
    example: "Bench Press"
  sets_completed:
    type: integer
    minimum: 1
    description: Number of sets completed for this exercise
    example: 3
  reps_completed:
    type: array
    description: Array of repetitions completed for each set
    items:
      type: integer
      minimum: 0
    example: [10, 8, 6]
  weights_used:
    type: array
    description: Array of weights used for each set (in pounds or kilograms)
    items:
      type: number
      minimum: 0
    example: [135, 155, 175]
  felt_difficulty:
    type: integer
    minimum: 1
    maximum: 10
    nullable: true
    description: Subjective difficulty rating for this exercise from 1-10
    example: 7
  notes:
    type: string
    nullable: true
    maxLength: 500
    description: Optional notes about the performance of this specific exercise
    example: "Good form on last set"

example:
  exercise_id: "bench-press"
  exercise_name: "Bench Press"
  sets_completed: 3
  reps_completed: [10, 8, 6]
  weights_used: [135, 155, 175]
  felt_difficulty: 7
  notes: "Good form on last set" 