type: object
description: Error response when workout log operation rate limits are exceeded
required:
  - status
  - message
  - retryAfter
properties:
  status:
    type: string
    enum: ["error"]
    description: Status indicating a rate limit error
    example: "error"
  message:
    type: string
    description: Error message indicating rate limit exceeded
    example: "Rate limit exceeded for workout log operations"
  retryAfter:
    type: integer
    description: Seconds to wait before retrying the request
    example: 60
  limit:
    type: integer
    description: Maximum number of requests allowed
    example: 100
  window:
    type: string
    description: Time window for the rate limit
    example: "1 hour"
  timestamp:
    type: string
    format: date-time
    description: Timestamp when the error occurred
    example: "2025-01-15T18:30:00Z"

example:
  status: "error"
  message: "Rate limit exceeded for workout log operations"
  retryAfter: 60
  limit: 100
  window: "1 hour"
  timestamp: "2025-01-15T18:30:00Z" 