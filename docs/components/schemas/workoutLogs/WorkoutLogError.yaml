type: object
description: General error response for workout log operations
required:
  - status
  - message
properties:
  status:
    type: string
    enum: ["error"]
    description: Status indicating an error occurred
    example: "error"
  message:
    type: string
    description: Human-readable error message
    example: "An error occurred while processing the workout log"
  timestamp:
    type: string
    format: date-time
    description: Timestamp when the error occurred
    example: "2025-01-15T18:30:00Z"

example:
  status: "error"
  message: "An error occurred while processing the workout log"
  timestamp: "2025-01-15T18:30:00Z" 