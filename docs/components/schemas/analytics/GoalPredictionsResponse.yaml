type: object
description: Response containing AI-powered goal achievement predictions with detailed analysis and probability assessments
required:
  - status
  - data
  - metadata
properties:
  status:
    type: string
    enum: [success]
    description: Response status indicator
    example: success
  data:
    $ref: './GoalPredictions.yaml'
  metadata:
    type: object
    description: Response metadata including prediction parameters and AI processing information
    required:
      - timestamp
      - aiGenerated
      - predictionScope
      - processingTime
    properties:
      timestamp:
        type: string
        format: date-time
        description: Response generation timestamp
        example: "2024-01-15T10:30:00Z"
      aiGenerated:
        type: boolean
        description: Confirms these predictions were generated by AI
        example: true
      predictionScope:
        type: object
        description: Scope and parameters used for goal predictions
        required:
          - goalTypes
          - timeHorizons
          - confidenceThreshold
        properties:
          goalTypes:
            type: array
            description: Types of goals included in predictions
            items:
              type: string
              enum: [weight_loss, muscle_gain, strength, endurance, body_composition]
            example: ["weight_loss", "strength"]
          timeHorizons:
            type: array
            description: Time horizons analyzed for predictions
            items:
              type: string
              enum: [1_month, 3_months, 6_months, 1_year]
            example: ["3_months", "6_months"]
          confidenceThreshold:
            type: number
            format: float
            minimum: 0
            maximum: 1
            description: Minimum confidence threshold for predictions (0-1)
            example: 0.6
          dataPointsAnalyzed:
            type: integer
            minimum: 0
            description: Number of historical data points used for predictions
            example: 847
      processingTime:
        type: number
        format: float
        description: AI processing time in milliseconds
        example: 2156.4
      modelVersion:
        type: string
        description: AI model version used for predictions
        example: "goal-predictor-v2.8"
      overallPredictionConfidence:
        type: number
        format: float
        minimum: 0
        maximum: 1
        description: Overall confidence score for all predictions (0-1)
        example: 0.78
examples:
  - status: success
    data:
      userId: "123e4567-e89b-12d3-a456-426614174000"
      analysisDate: "2024-01-15T10:30:00Z"
      goalPredictions:
        - goalId: "goal_123"
          goalType: weight_loss
          currentProgress: 0.45
          predictions:
            - timeframe: "3_months"
              achievementProbability: 0.85
              estimatedCompletion: "2024-04-10"
              trajectory: "on_track"
              confidence: 0.87
            - timeframe: "6_months"
              achievementProbability: 0.96
              estimatedCompletion: "2024-04-10"
              trajectory: "ahead_of_schedule"
              confidence: 0.92
          riskFactors:
            - factor: "Weekend adherence"
              impact: "medium"
              mitigation: "Schedule weekend workouts"
          recommendations:
            - "Maintain current workout consistency"
            - "Focus on weekend adherence improvement"
      overallAssessment:
        trajectory: positive
        keyInsights:
          - "Current rate suggests early goal completion"
          - "Weekend consistency is primary risk factor"
        recommendedActions:
          - "Continue current routine"
          - "Address weekend workout gaps"
    metadata:
      timestamp: "2024-01-15T10:30:00Z"
      aiGenerated: true
      predictionScope:
        goalTypes: ["weight_loss", "strength"]
        timeHorizons: ["3_months", "6_months"]
        confidenceThreshold: 0.6
        dataPointsAnalyzed: 847
      processingTime: 2156.4
      modelVersion: "goal-predictor-v2.8"
      overallPredictionConfidence: 0.78 