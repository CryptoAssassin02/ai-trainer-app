type: object
description: Response containing AI-generated personalized recommendations with detailed implementation guidance and expected outcomes
required:
  - status
  - data
  - metadata
properties:
  status:
    type: string
    enum: [success]
    description: Response status indicator
    example: success
  data:
    $ref: './PersonalizedRecommendations.yaml'
  metadata:
    type: object
    description: Response metadata including recommendation generation parameters and AI processing information
    required:
      - timestamp
      - aiGenerated
      - recommendationScope
      - processingTime
    properties:
      timestamp:
        type: string
        format: date-time
        description: Response generation timestamp
        example: "2024-01-15T10:30:00Z"
      aiGenerated:
        type: boolean
        description: Confirms these recommendations were generated by AI
        example: true
      recommendationScope:
        type: object
        description: Scope and parameters used for recommendation generation
        required:
          - categories
          - priority
          - timeHorizon
        properties:
          categories:
            type: array
            description: Categories of recommendations included
            items:
              type: string
              enum: [workout, nutrition, recovery, motivation, goals, habits]
            example: ["workout", "nutrition", "recovery"]
          priority:
            type: string
            description: Priority filter applied to recommendations
            enum: [all, high_only, medium_and_high]
            example: all
          timeHorizon:
            type: string
            description: Time horizon for recommendation implementation
            enum: [immediate, short_term, medium_term, long_term]
            example: short_term
          maxRecommendations:
            type: integer
            minimum: 1
            maximum: 50
            description: Maximum number of recommendations to include
            example: 10
      processingTime:
        type: number
        format: float
        description: AI processing time in milliseconds
        example: 1523.8
      modelVersion:
        type: string
        description: AI model version used for recommendation generation
        example: "recommendation-engine-v3.2"
      confidenceScore:
        type: number
        format: float
        minimum: 0
        maximum: 1
        description: Overall confidence score for recommendations (0-1)
        example: 0.85
examples:
  - status: success
    data:
      userId: "123e4567-e89b-12d3-a456-426614174000"
      generatedAt: "2024-01-15T10:30:00Z"
      recommendations:
        - id: "rec_001"
          category: workout
          priority: high
          title: "Optimize Weekend Workout Timing"
          description: "Schedule weekend workouts for Saturday mornings to improve consistency"
          rationale: "Data shows 67% weekend adherence vs 92% weekday. Morning slots show higher completion rates."
          implementation:
            steps: ["Set Saturday 8 AM alarm", "Prepare workout clothes Friday night"]
            difficulty: easy
            timeToImplement: "1 week"
          expectedOutcome:
            metric: "weekend_adherence"
            improvement: "25% increase"
            timeframe: "4 weeks"
          confidence: 0.89
      summary:
        totalRecommendations: 8
        byCategory:
          workout: 3
          nutrition: 2
          recovery: 2
          motivation: 1
        byPriority:
          high: 3
          medium: 4
          low: 1
    metadata:
      timestamp: "2024-01-15T10:30:00Z"
      aiGenerated: true
      recommendationScope:
        categories: ["workout", "nutrition", "recovery"]
        priority: all
        timeHorizon: short_term
        maxRecommendations: 10
      processingTime: 1523.8
      modelVersion: "recommendation-engine-v3.2"
      confidenceScore: 0.85 