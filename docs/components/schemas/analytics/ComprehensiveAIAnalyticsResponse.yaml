type: object
description: Response containing comprehensive AI analytics combining insights, patterns, recommendations, and predictions into a complete analysis
required:
  - status
  - data
  - metadata
properties:
  status:
    type: string
    enum: [success]
    description: Response status indicator
    example: success
  data:
    $ref: './ComprehensiveAIAnalytics.yaml'
  metadata:
    type: object
    description: Response metadata including comprehensive analysis parameters and processing information
    required:
      - timestamp
      - aiGenerated
      - analysisScope
      - processingTime
    properties:
      timestamp:
        type: string
        format: date-time
        description: Response generation timestamp
        example: "2024-01-15T10:30:00Z"
      aiGenerated:
        type: boolean
        description: Confirms this comprehensive analysis was generated by AI
        example: true
      analysisScope:
        type: object
        description: Comprehensive scope of the AI analysis
        required:
          - components
          - timeframe
          - dataCategories
        properties:
          components:
            type: array
            description: AI analysis components included
            items:
              type: string
              enum: [insights, patterns, recommendations, predictions, correlations, assessments]
            minItems: 1
            example: ["insights", "patterns", "recommendations", "predictions"]
          timeframe:
            type: string
            description: Primary timeframe for analysis
            example: "12 weeks"
          dataCategories:
            type: array
            description: Categories of data analyzed
            items:
              type: string
              enum: [workouts, nutrition, progress, wellness, goals, habits, timing]
            example: ["workouts", "nutrition", "progress", "wellness", "goals"]
          analysisDepth:
            type: string
            description: Depth level of the comprehensive analysis
            enum: [surface, detailed, deep, comprehensive]
            example: comprehensive
      processingTime:
        type: number
        format: float
        description: Total AI processing time in milliseconds
        example: 4672.1
      modelVersions:
        type: object
        description: AI model versions used for different analysis components
        properties:
          insights:
            type: string
            example: "gpt-4-turbo-2024-01-15"
          patterns:
            type: string
            example: "pattern-analyzer-v2.1"
          recommendations:
            type: string
            example: "recommendation-engine-v3.2"
          predictions:
            type: string
            example: "goal-predictor-v2.8"
      overallConfidence:
        type: number
        format: float
        minimum: 0
        maximum: 1
        description: Overall confidence score for the comprehensive analysis (0-1)
        example: 0.86
      dataQualityScore:
        type: number
        format: float
        minimum: 0
        maximum: 1
        description: Overall data quality score affecting analysis reliability (0-1)
        example: 0.91
examples:
  - status: success
    data:
      userId: "123e4567-e89b-12d3-a456-426614174000"
      analysisDate: "2024-01-15T10:30:00Z"
      executiveSummary:
        overallProgress: excellent
        keyHighlights:
          - "83% goal achievement probability within timeframe"
          - "Consistent strength gains with 18% improvement"
          - "Weekend adherence identified as primary optimization area"
        priorityActions:
          - "Focus on weekend workout consistency"
          - "Consider strength plateau prevention strategies"
        confidenceLevel: high
      insights:
        totalInsights: 12
        highPriorityInsights: 4
        categories: ["performance", "adherence", "progression"]
        topInsights:
          - category: performance
            title: "Strength Plateau Approaching"
            confidence: 0.92
            urgency: medium
      patterns:
        totalPatterns: 8
        highConfidencePatterns: 5
        behavioralPatterns: 3
        performancePatterns: 2
        temporalPatterns: 3
        keyFindings:
          - "Weekend adherence drops 25%"
          - "Morning workouts 15% more successful"
      recommendations:
        totalRecommendations: 10
        implementationComplexity: moderate
        estimatedImpact: high
        priorityRecommendations:
          - category: workout
            title: "Weekend Schedule Optimization"
            impact: "25% adherence improvement"
      predictions:
        activeGoals: 3
        averageAchievementProbability: 0.83
        onTrackGoals: 2
        atRiskGoals: 1
        estimatedTimeToCompletion: "14 weeks average"
    metadata:
      timestamp: "2024-01-15T10:30:00Z"
      aiGenerated: true
      analysisScope:
        components: ["insights", "patterns", "recommendations", "predictions"]
        timeframe: "12 weeks"
        dataCategories: ["workouts", "nutrition", "progress", "wellness", "goals"]
        analysisDepth: comprehensive
      processingTime: 4672.1
      modelVersions:
        insights: "gpt-4-turbo-2024-01-15"
        patterns: "pattern-analyzer-v2.1"
        recommendations: "recommendation-engine-v3.2"
        predictions: "goal-predictor-v2.8"
      overallConfidence: 0.86
      dataQualityScore: 0.91 