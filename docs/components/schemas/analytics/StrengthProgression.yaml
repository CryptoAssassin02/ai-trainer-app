type: object
description: Comprehensive strength progression analysis with exercise-specific metrics and overall performance trends
required:
  - userId
  - timeframe
  - hasData
  - overallProgression
  - exerciseProgression
properties:
  userId:
    type: string
    format: uuid
    description: Unique identifier for the user
    example: "123e4567-e89b-12d3-a456-426614174000"
  timeframe:
    type: string
    description: Time period for the strength progression analysis
    pattern: '^\d+\s+(days?|weeks?|months?)$'
    example: "12 weeks"
  hasData:
    type: boolean
    description: Indicates whether sufficient data is available for strength analysis
    example: true
  overallProgression:
    type: object
    description: Overall strength progression summary and metrics
    required:
      - strengthGain
      - totalVolumeIncrease
      - progressionRate
      - strengthScore
    properties:
      strengthGain:
        type: number
        format: float
        minimum: 0
        description: Overall strength gain percentage
        example: 18.5
      totalVolumeIncrease:
        type: number
        format: float
        description: Total training volume increase percentage
        example: 24.2
      progressionRate:
        type: string
        description: Assessment of progression consistency
        enum: [accelerating, consistent, slowing, plateau, declining]
        example: consistent
      strengthScore:
        type: integer
        minimum: 0
        description: Composite strength score based on all exercises
        example: 847
      compoundMovementFocus:
        type: number
        format: float
        minimum: 0
        maximum: 1
        description: Percentage focus on compound movements (0-1)
        example: 0.72
      muscleBalance:
        type: object
        description: Analysis of muscle group development balance
        properties:
          pushPullRatio:
            type: number
            format: float
            description: Ratio of pushing to pulling strength
            example: 1.15
          upperLowerRatio:
            type: number
            format: float
            description: Ratio of upper body to lower body strength
            example: 0.85
          balanceScore:
            type: string
            enum: [excellent, good, moderate, poor]
            description: Overall muscle balance assessment
            example: good
  exerciseProgression:
    type: array
    description: Detailed progression analysis for individual exercises
    minItems: 0
    items:
      type: object
      required:
        - exerciseName
        - category
        - muscleGroups
        - progression
        - volumeProgression
      properties:
        exerciseName:
          type: string
          description: Name of the exercise
          example: "Bench Press"
        category:
          type: string
          description: Exercise category classification
          enum: [chest, back, shoulders, arms, legs, core, full_body]
          example: chest
        muscleGroups:
          type: array
          description: Primary and secondary muscle groups targeted
          items:
            type: string
            enum: [chest, back, shoulders, biceps, triceps, forearms, quadriceps, hamstrings, glutes, calves, core, traps, lats]
          minItems: 1
          example: ["chest", "triceps", "shoulders"]
        progression:
          type: object
          description: Strength progression metrics for this exercise
          required:
            - initialMax
            - currentMax
            - improvement
            - trend
          properties:
            initialMax:
              type: number
              format: float
              minimum: 0
              description: Initial one-rep max or equivalent in kg
              example: 80.0
            currentMax:
              type: number
              format: float
              minimum: 0
              description: Current one-rep max or equivalent in kg
              example: 92.5
            improvement:
              type: number
              format: float
              description: Improvement percentage since baseline
              example: 15.6
            trend:
              type: string
              description: Progression trend for this exercise
              enum: [increasing, decreasing, stable, fluctuating]
              example: increasing
            plateauRisk:
              type: string
              enum: [low, medium, high]
              description: Risk assessment for strength plateau
              example: low
            personalRecord:
              type: number
              format: float
              minimum: 0
              description: All-time personal record for this exercise in kg
              example: 95.0
        volumeProgression:
          type: object
          description: Training volume progression for this exercise
          required:
            - initialVolume
            - currentVolume
            - volumeIncrease
          properties:
            initialVolume:
              type: number
              format: float
              minimum: 0
              description: Initial weekly training volume (sets × reps × weight)
              example: 2400
            currentVolume:
              type: number
              format: float
              minimum: 0
              description: Current weekly training volume
              example: 3150
            volumeIncrease:
              type: number
              format: float
              description: Volume increase percentage since baseline
              example: 31.3
            averageIntensity:
              type: number
              format: float
              minimum: 0
              maximum: 1
              description: Average training intensity as percentage of 1RM (0-1)
              example: 0.78
        frequencyAnalysis:
          type: object
          description: Exercise frequency and consistency analysis
          properties:
            weeklyFrequency:
              type: number
              format: float
              minimum: 0
              description: Average times per week this exercise is performed
              example: 2.3
            consistency:
              type: number
              format: float
              minimum: 0
              maximum: 1
              description: Consistency score for this exercise (0-1)
              example: 0.85
            lastPerformed:
              type: string
              format: date-time
              description: Date when this exercise was last performed
              example: "2024-01-14T18:30:00Z"
  categoryProgression:
    type: object
    description: Progression summary by exercise category
    additionalProperties:
      type: object
      properties:
        strengthGain:
          type: number
          format: float
          description: Average strength gain for this category
          example: 16.8
        exerciseCount:
          type: integer
          minimum: 0
          description: Number of exercises in this category
          example: 4
        topExercise:
          type: string
          description: Exercise with best progression in this category
          example: "Incline Dumbbell Press"
    example:
      chest:
        strengthGain: 16.8
        exerciseCount: 4
        topExercise: "Incline Dumbbell Press"
      legs:
        strengthGain: 22.1
        exerciseCount: 6
        topExercise: "Bulgarian Split Squat"
examples:
  - userId: "123e4567-e89b-12d3-a456-426614174000"
    timeframe: "12 weeks"
    hasData: true
    overallProgression:
      strengthGain: 18.5
      totalVolumeIncrease: 24.2
      progressionRate: consistent
      strengthScore: 847
      compoundMovementFocus: 0.72
      muscleBalance:
        pushPullRatio: 1.15
        upperLowerRatio: 0.85
        balanceScore: good
    exerciseProgression:
      - exerciseName: "Bench Press"
        category: "chest"
        muscleGroups: ["chest", "triceps", "shoulders"]
        progression:
          initialMax: 80.0
          currentMax: 92.5
          improvement: 15.6
          trend: increasing
          plateauRisk: low
          personalRecord: 95.0
        volumeProgression:
          initialVolume: 2400
          currentVolume: 3150
          volumeIncrease: 31.3
          averageIntensity: 0.78
        frequencyAnalysis:
          weeklyFrequency: 2.3
          consistency: 0.85
          lastPerformed: "2024-01-14T18:30:00Z"
    categoryProgression:
      chest:
        strengthGain: 16.8
        exerciseCount: 4
        topExercise: "Incline Dumbbell Press"
      legs:
        strengthGain: 22.1
        exerciseCount: 6
        topExercise: "Bulgarian Split Squat" 