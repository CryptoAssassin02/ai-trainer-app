type: object
description: Comprehensive analytics overview containing key fitness metrics and progress indicators
required:
  - userId
  - timeframe
  - hasData
  - overview
properties:
  userId:
    type: string
    format: uuid
    description: Unique identifier for the user
    example: "123e4567-e89b-12d3-a456-426614174000"
  timeframe:
    type: string
    description: Time period for the analytics data
    pattern: '^\d+\s+(days?|weeks?|months?)$'
    example: "30 days"
  hasData:
    type: boolean
    description: Indicates whether sufficient data is available for analytics
    example: true
  overview:
    type: object
    description: Core analytics metrics organized by category
    required:
      - workouts
      - physical
      - wellness
      - adherence
    properties:
      workouts:
        type: object
        description: Workout-related analytics and performance metrics
        required:
          - completed
          - totalExercises
          - avgDifficulty
          - avgSatisfaction
          - consistency
        properties:
          completed:
            type: integer
            minimum: 0
            description: Total number of completed workouts
            example: 24
          totalExercises:
            type: integer
            minimum: 0
            description: Total number of exercises performed
            example: 144
          avgDifficulty:
            type: number
            format: float
            minimum: 1
            maximum: 10
            description: Average workout difficulty rating (1-10)
            example: 7.2
          avgSatisfaction:
            type: number
            format: float
            minimum: 1
            maximum: 10
            description: Average workout satisfaction rating (1-10)
            example: 8.1
          consistency:
            type: number
            format: float
            minimum: 0
            maximum: 1
            description: Workout consistency percentage (0-1)
            example: 0.85
          weeklyAverage:
            type: number
            format: float
            minimum: 0
            description: Average workouts per week
            example: 5.6
      physical:
        type: object
        description: Physical metrics and body composition changes
        required:
          - currentWeight
          - weightChange
        properties:
          currentWeight:
            type: number
            format: float
            minimum: 0
            description: Current weight in kg
            example: 75.2
          weightChange:
            type: number
            format: float
            description: Weight change in kg (positive = gain, negative = loss)
            example: -2.3
          currentBodyFat:
            type: number
            format: float
            minimum: 0
            maximum: 100
            description: Current body fat percentage
            example: 18.5
          bodyFatChange:
            type: number
            format: float
            description: Body fat percentage change
            example: -1.2
          muscleMass:
            type: number
            format: float
            minimum: 0
            description: Current muscle mass in kg
            example: 58.7
          muscleMassChange:
            type: number
            format: float
            description: Muscle mass change in kg
            example: 1.8
      wellness:
        type: object
        description: Wellness and lifestyle metrics
        required:
          - overallScore
          - mood
          - sleep
          - energy
          - stress
        properties:
          overallScore:
            type: number
            format: float
            minimum: 1
            maximum: 10
            description: Overall wellness score (1-10)
            example: 8.2
          mood:
            type: number
            format: float
            minimum: 1
            maximum: 10
            description: Average mood rating (1-10)
            example: 7.8
          sleep:
            type: number
            format: float
            minimum: 1
            maximum: 10
            description: Average sleep quality rating (1-10)
            example: 8.0
          energy:
            type: number
            format: float
            minimum: 1
            maximum: 10
            description: Average energy level rating (1-10)
            example: 7.9
          stress:
            type: number
            format: float
            minimum: 1
            maximum: 10
            description: Average stress level rating (1-10, higher = more stressed)
            example: 6.5
      adherence:
        type: object
        description: Adherence metrics for different aspects of the fitness plan
        required:
          - workout
          - nutrition
          - overall
        properties:
          workout:
            type: number
            format: float
            minimum: 0
            maximum: 1
            description: Workout adherence percentage (0-1)
            example: 0.85
          nutrition:
            type: number
            format: float
            minimum: 0
            maximum: 1
            description: Nutrition adherence percentage (0-1)
            example: 0.78
          overall:
            type: number
            format: float
            minimum: 0
            maximum: 1
            description: Overall adherence percentage (0-1)
            example: 0.82
          checkIns:
            type: number
            format: float
            minimum: 0
            maximum: 1
            description: Check-in adherence percentage (0-1)
            example: 0.90
examples:
  - userId: "123e4567-e89b-12d3-a456-426614174000"
    timeframe: "30 days"
    hasData: true
    overview:
      workouts:
        completed: 24
        totalExercises: 144
        avgDifficulty: 7.2
        avgSatisfaction: 8.1
        consistency: 0.85
        weeklyAverage: 5.6
      physical:
        currentWeight: 75.2
        weightChange: -2.3
        currentBodyFat: 18.5
        bodyFatChange: -1.2
        muscleMass: 58.7
        muscleMassChange: 1.8
      wellness:
        overallScore: 8.2
        mood: 7.8
        sleep: 8.0
        energy: 7.9
        stress: 6.5
      adherence:
        workout: 0.85
        nutrition: 0.78
        overall: 0.82
        checkIns: 0.90 