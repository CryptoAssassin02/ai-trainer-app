type: object
description: Response containing AI-powered insights with comprehensive analysis, pattern recognition, and personalized recommendations
required:
  - status
  - data
  - metadata
properties:
  status:
    type: string
    enum: [success]
    description: Response status indicator
    example: success
  data:
    $ref: './AIInsights.yaml'
  metadata:
    type: object
    description: Response metadata including AI processing information and quality metrics
    required:
      - timestamp
      - aiGenerated
      - processingTime
    properties:
      timestamp:
        type: string
        format: date-time
        description: Response generation timestamp
        example: "2024-01-15T10:30:00Z"
      aiGenerated:
        type: boolean
        description: Confirms this content was generated by AI
        example: true
      processingTime:
        type: number
        format: float
        description: AI processing time in milliseconds
        example: 1847.3
      modelVersion:
        type: string
        description: AI model version used for insights generation
        example: "gpt-4-turbo-2024-01-15"
      confidenceScore:
        type: number
        format: float
        minimum: 0
        maximum: 1
        description: Overall confidence score for AI insights (0-1)
        example: 0.87
      dataQuality:
        type: object
        description: Quality assessment of input data used for AI analysis
        required:
          - score
          - factors
        properties:
          score:
            type: number
            format: float
            minimum: 0
            maximum: 1
            description: Data quality score (0-1)
            example: 0.92
          factors:
            type: array
            description: Key factors affecting data quality
            items:
              type: string
            example: ["High workout consistency", "Regular check-ins", "Complete nutrition logging"]
      analysisScope:
        type: object
        description: Scope of data analyzed by AI
        required:
          - dataPoints
          - timespan
        properties:
          dataPoints:
            type: integer
            minimum: 0
            description: Total number of data points analyzed
            example: 847
          timespan:
            type: string
            description: Time period of data analyzed
            example: "12 weeks"
          categories:
            type: array
            description: Data categories included in analysis
            items:
              type: string
              enum: [workouts, nutrition, progress, wellness, goals]
            example: ["workouts", "nutrition", "progress", "wellness"]
examples:
  - status: success
    data:
      userId: "123e4567-e89b-12d3-a456-426614174000"
      analysisDate: "2024-01-15T10:30:00Z"
      insightCategories:
        - performance
        - adherence
        - progression
        - motivation
      insights:
        - id: "insight_001"
          category: performance
          priority: high
          confidence: 0.92
          title: "Strength Plateau Warning"
          summary: "Your bench press progress has plateaued for 3 weeks"
          details: "Analysis shows your bench press has remained at 92.5kg for the past 3 workouts..."
          recommendations:
            - "Increase training volume by 10-15%"
            - "Add pause reps to break through plateau"
          impact: high
          urgency: medium
      keyPatterns:
        - pattern: "Lower weekend adherence"
          confidence: 0.89
          description: "Workout adherence drops by 25% on weekends"
          frequency: "consistent"
          impact: "Affects weekly progress by 15%"
      personalizedRecommendations:
        - category: workout_optimization
          title: "Optimize Rest Days"
          description: "Schedule active recovery on Sundays to maintain momentum"
          expectedBenefit: "15-20% improvement in weekly consistency"
          difficulty: easy
          timeToImplement: "1 week"
    metadata:
      timestamp: "2024-01-15T10:30:00Z"
      aiGenerated: true
      processingTime: 1847.3
      modelVersion: "gpt-4-turbo-2024-01-15"
      confidenceScore: 0.87
      dataQuality:
        score: 0.92
        factors: ["High workout consistency", "Regular check-ins", "Complete nutrition logging"]
      analysisScope:
        dataPoints: 847
        timespan: "12 weeks"
        categories: ["workouts", "nutrition", "progress", "wellness"] 