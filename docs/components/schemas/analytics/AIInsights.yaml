type: object
description: Comprehensive AI-generated insights with detailed analysis, pattern recognition, and personalized recommendations based on user fitness data
required:
  - userId
  - analysisDate
  - insightCategories
  - insights
  - keyPatterns
  - personalizedRecommendations
properties:
  userId:
    type: string
    format: uuid
    description: Unique identifier for the user
    example: "123e4567-e89b-12d3-a456-426614174000"
  analysisDate:
    type: string
    format: date-time
    description: Date and time when AI analysis was performed
    example: "2024-01-15T10:30:00Z"
  insightCategories:
    type: array
    description: Categories of insights included in this analysis
    items:
      type: string
      enum: [performance, adherence, progression, motivation, health_optimization, goal_achievement]
    minItems: 1
    example: ["performance", "adherence", "progression", "motivation"]
  insights:
    type: array
    description: Individual AI-generated insights with detailed analysis
    minItems: 0
    items:
      type: object
      required:
        - id
        - category
        - priority
        - confidence
        - title
        - summary
        - details
        - recommendations
        - impact
        - urgency
      properties:
        id:
          type: string
          description: Unique identifier for this insight
          pattern: '^insight_[a-zA-Z0-9]{3,}$'
          example: "insight_001"
        category:
          type: string
          description: Category of this insight
          enum: [performance, adherence, progression, motivation, health_optimization, goal_achievement]
          example: performance
        priority:
          type: string
          description: Priority level of this insight
          enum: [high, medium, low]
          example: high
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: AI confidence score for this insight (0-1)
          example: 0.92
        title:
          type: string
          description: Concise title summarizing the insight
          maxLength: 100
          example: "Strength Plateau Warning"
        summary:
          type: string
          description: Brief summary of the insight
          maxLength: 200
          example: "Your bench press progress has plateaued for 3 weeks"
        details:
          type: string
          description: Detailed explanation of the insight and supporting data
          maxLength: 1000
          example: "Analysis shows your bench press has remained at 92.5kg for the past 3 workouts. This is typical after 8-12 weeks of consistent training..."
        recommendations:
          type: array
          description: Specific actionable recommendations based on this insight
          items:
            type: string
            maxLength: 200
          minItems: 1
          example: 
            - "Increase training volume by 10-15%"
            - "Add pause reps to break through plateau"
            - "Consider deload week to promote recovery"
        impact:
          type: string
          description: Expected impact of addressing this insight
          enum: [high, medium, low]
          example: high
        urgency:
          type: string
          description: Urgency of addressing this insight
          enum: [high, medium, low, none]
          example: medium
        dataPoints:
          type: array
          description: Key data points supporting this insight
          items:
            type: object
            properties:
              metric:
                type: string
                description: Metric name
                example: "bench_press_1rm"
              value:
                type: number
                format: float
                description: Current value
                example: 92.5
              trend:
                type: string
                enum: [increasing, decreasing, stable, fluctuating]
                example: stable
              duration:
                type: string
                description: Duration of this trend
                example: "3 weeks"
        relatedGoals:
          type: array
          description: User goals related to this insight
          items:
            type: string
            format: uuid
          example: ["goal_123", "goal_456"]
  keyPatterns:
    type: array
    description: Key behavioral and performance patterns identified by AI
    items:
      type: object
      required:
        - pattern
        - confidence
        - description
        - frequency
        - impact
      properties:
        pattern:
          type: string
          description: Name of the identified pattern
          maxLength: 100
          example: "Lower weekend adherence"
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Confidence level in pattern identification (0-1)
          example: 0.89
        description:
          type: string
          description: Detailed description of the pattern
          maxLength: 300
          example: "Workout adherence drops by 25% on weekends, particularly Saturdays, likely due to social commitments"
        frequency:
          type: string
          description: How often this pattern occurs
          enum: [always, frequently, occasionally, rarely]
          example: frequently
        impact:
          type: string
          description: Description of how this pattern affects progress
          maxLength: 200
          example: "Affects weekly progress by 15% and consistency metrics"
        severity:
          type: string
          description: Severity of this pattern's impact
          enum: [high, medium, low]
          example: medium
        category:
          type: string
          description: Category of pattern
          enum: [behavioral, performance, temporal, environmental, physiological]
          example: behavioral
        timeframe:
          type: string
          description: Timeframe over which pattern was observed
          example: "8 weeks"
  personalizedRecommendations:
    type: array
    description: AI-generated personalized recommendations for improvement
    items:
      type: object
      required:
        - category
        - title
        - description
        - expectedBenefit
        - difficulty
        - timeToImplement
      properties:
        category:
          type: string
          description: Category of recommendation
          enum: [workout_optimization, nutrition_adjustment, habit_formation, goal_modification, recovery_enhancement, motivation_boost]
          example: workout_optimization
        title:
          type: string
          description: Title of the recommendation
          maxLength: 100
          example: "Optimize Rest Days"
        description:
          type: string
          description: Detailed description of the recommendation
          maxLength: 500
          example: "Schedule active recovery sessions on Sundays to maintain momentum without overtraining"
        expectedBenefit:
          type: string
          description: Expected benefit of implementing this recommendation
          maxLength: 200
          example: "15-20% improvement in weekly consistency"
        difficulty:
          type: string
          description: Difficulty level of implementing this recommendation
          enum: [easy, moderate, challenging, difficult]
          example: easy
        timeToImplement:
          type: string
          description: Expected time to see results from this recommendation
          example: "1 week"
        priority:
          type: string
          description: Priority level for implementation
          enum: [high, medium, low]
          example: medium
        specificActions:
          type: array
          description: Specific actions to implement this recommendation
          items:
            type: string
            maxLength: 150
          example:
            - "Add 30-minute walk or yoga session on Sundays"
            - "Set reminder for Sunday morning activity"
            - "Track active recovery sessions"
        successMetrics:
          type: array
          description: Metrics to track success of this recommendation
          items:
            type: string
          example: ["Weekly workout consistency", "Sunday activity completion rate"]
  correlationInsights:
    type: array
    description: AI-identified correlations between different metrics
    items:
      type: object
      required:
        - variables
        - strength
        - description
        - actionable
      properties:
        variables:
          type: array
          description: Variables involved in the correlation
          items:
            type: string
          minItems: 2
          example: ["sleep_quality", "workout_performance"]
        strength:
          type: number
          format: float
          minimum: -1
          maximum: 1
          description: Correlation strength (-1 to 1)
          example: 0.73
        description:
          type: string
          description: Description of the correlation and its implications
          maxLength: 300
          example: "Strong positive correlation between sleep quality and next-day workout performance"
        actionable:
          type: boolean
          description: Whether this correlation suggests actionable insights
          example: true
        recommendation:
          type: string
          description: Recommendation based on this correlation
          maxLength: 200
          example: "Prioritize 7-8 hours of quality sleep before workout days"
  overallAssessment:
    type: object
    description: AI's overall assessment of user's fitness journey
    required:
      - progressRating
      - keyStrengths
      - areasForImprovement
      - nextSteps
    properties:
      progressRating:
        type: string
        description: Overall progress rating
        enum: [excellent, good, satisfactory, needs_improvement, concerning]
        example: good
      keyStrengths:
        type: array
        description: Key strengths identified in user's fitness approach
        items:
          type: string
          maxLength: 100
        minItems: 1
        example: 
          - "Consistent workout schedule"
          - "Good progressive overload application"
          - "Excellent nutrition logging"
      areasForImprovement:
        type: array
        description: Areas where user can improve
        items:
          type: string
          maxLength: 100
        example:
          - "Weekend adherence consistency"
          - "Recovery optimization"
      nextSteps:
        type: array
        description: Recommended next steps for continued progress
        items:
          type: string
          maxLength: 150
        minItems: 1
        example:
          - "Focus on weekend workout consistency"
          - "Implement structured deload weeks"
          - "Consider strength plateau strategies"
      motivationalMessage:
        type: string
        description: Personalized motivational message
        maxLength: 300
        example: "You're making excellent progress! Your consistency is paying off with steady strength gains. Focus on weekend workouts to accelerate your results."
examples:
  - userId: "123e4567-e89b-12d3-a456-426614174000"
    analysisDate: "2024-01-15T10:30:00Z"
    insightCategories: ["performance", "adherence", "progression", "motivation"]
    insights:
      - id: "insight_001"
        category: performance
        priority: high
        confidence: 0.92
        title: "Strength Plateau Warning"
        summary: "Your bench press progress has plateaued for 3 weeks"
        details: "Analysis shows your bench press has remained at 92.5kg for the past 3 workouts. This is typical after 8-12 weeks of consistent training and indicates your body has adapted to the current stimulus."
        recommendations:
          - "Increase training volume by 10-15%"
          - "Add pause reps to break through plateau"
          - "Consider deload week to promote recovery"
        impact: high
        urgency: medium
        dataPoints:
          - metric: "bench_press_1rm"
            value: 92.5
            trend: stable
            duration: "3 weeks"
        relatedGoals: ["goal_123"]
    keyPatterns:
      - pattern: "Lower weekend adherence"
        confidence: 0.89
        description: "Workout adherence drops by 25% on weekends, particularly Saturdays, likely due to social commitments"
        frequency: frequently
        impact: "Affects weekly progress by 15% and consistency metrics"
        severity: medium
        category: behavioral
        timeframe: "8 weeks"
    personalizedRecommendations:
      - category: workout_optimization
        title: "Optimize Rest Days"
        description: "Schedule active recovery sessions on Sundays to maintain momentum without overtraining"
        expectedBenefit: "15-20% improvement in weekly consistency"
        difficulty: easy
        timeToImplement: "1 week"
        priority: medium
        specificActions:
          - "Add 30-minute walk or yoga session on Sundays"
          - "Set reminder for Sunday morning activity"
        successMetrics: ["Weekly workout consistency", "Sunday activity completion rate"]
    correlationInsights:
      - variables: ["sleep_quality", "workout_performance"]
        strength: 0.73
        description: "Strong positive correlation between sleep quality and next-day workout performance"
        actionable: true
        recommendation: "Prioritize 7-8 hours of quality sleep before workout days"
    overallAssessment:
      progressRating: good
      keyStrengths:
        - "Consistent workout schedule"
        - "Good progressive overload application"
        - "Excellent nutrition logging"
      areasForImprovement:
        - "Weekend adherence consistency"
        - "Recovery optimization"
      nextSteps:
        - "Focus on weekend workout consistency"
        - "Implement structured deload weeks"
        - "Consider strength plateau strategies"
      motivationalMessage: "You're making excellent progress! Your consistency is paying off with steady strength gains. Focus on weekend workouts to accelerate your results." 