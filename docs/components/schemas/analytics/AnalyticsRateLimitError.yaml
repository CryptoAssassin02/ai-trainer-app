type: object
required: [status, error, message]
properties:
  status:
    type: string
    enum: [error]
    description: Response status
  error:
    type: string
    enum: [ANALYTICS_RATE_LIMIT_EXCEEDED]
    description: Error code
  message:
    type: string
    description: Human-readable error message
  details:
    type: object
    properties:
      limit:
        type: integer
        description: Rate limit threshold
      window:
        type: string
        description: Time window for rate limit (e.g., '15 minutes', '1 hour')
      remaining:
        type: integer
        description: Requests remaining in current window
      resetTime:
        type: string
        format: date-time
        description: When the rate limit window resets
      retryAfter:
        type: integer
        description: Seconds to wait before retrying
    description: Rate limit details
  timestamp:
    type: string
    format: date-time
    description: Error timestamp
  requestId:
    type: string
    description: Unique request identifier for support 