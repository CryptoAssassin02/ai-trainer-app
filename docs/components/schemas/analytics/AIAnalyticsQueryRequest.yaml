type: object
required: [analysisType]
properties:
  analysisType:
    type: string
    enum: [insights, patterns, recommendations, predictions, comprehensive]
    description: Type of AI analysis to perform
  timeframe:
    type: string
    enum: [1week, 2weeks, 1month, 3months, 6months, 1year, all]
    default: 1month
    description: Time period for analysis
  focus:
    type: array
    items:
      type: string
      enum: [workouts, nutrition, progress, goals, habits, recovery, performance]
    description: Specific areas to focus AI analysis on
  includeRecommendations:
    type: boolean
    default: true
    description: Whether to include actionable recommendations
  confidenceThreshold:
    type: number
    minimum: 0.1
    maximum: 1.0
    default: 0.5
    description: Minimum confidence level for insights (0.1-1.0)
  maxInsights:
    type: integer
    minimum: 1
    maximum: 50
    default: 10
    description: Maximum number of insights to return
  includePatterns:
    type: boolean
    default: true
    description: Whether to include pattern detection in analysis
  contextData:
    type: object
    properties:
      currentGoals:
        type: array
        items:
          type: string
      recentChanges:
        type: array
        items:
          type: string
      specificConcerns:
        type: array
        items:
          type: string
    description: Additional context to inform AI analysis
  personalizeLevel:
    type: string
    enum: [basic, standard, advanced, comprehensive]
    default: standard
    description: Level of personalization in AI analysis
  includeComparisons:
    type: boolean
    default: false
    description: Whether to include peer comparisons (anonymized) 