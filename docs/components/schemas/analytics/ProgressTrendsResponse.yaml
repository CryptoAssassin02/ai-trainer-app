type: object
description: Response containing progress trend analysis with time-series data and statistical insights
required:
  - status
  - data
  - metadata
properties:
  status:
    type: string
    enum: [success]
    description: Response status indicator
    example: success
  data:
    $ref: './ProgressTrends.yaml'
  metadata:
    type: object
    description: Response metadata including data quality and processing information
    required:
      - timestamp
      - dataPoints
      - lastUpdated
    properties:
      timestamp:
        type: string
        format: date-time
        description: Response generation timestamp
        example: "2024-01-15T10:30:00Z"
      dataPoints:
        type: integer
        minimum: 0
        description: Total number of data points included in the analysis
        example: 30
      lastUpdated:
        type: string
        format: date-time
        description: Timestamp when trend data was last refreshed
        example: "2024-01-15T09:00:00Z"
      processingTime:
        type: number
        format: float
        description: Response processing time in milliseconds
        example: 89.3
      analysisMethod:
        type: string
        description: Statistical method used for trend analysis
        enum: [linear_regression, moving_average, polynomial_fit]
        example: linear_regression
      confidenceLevel:
        type: number
        format: float
        minimum: 0
        maximum: 1
        description: Statistical confidence level of trend analysis (0-1)
        example: 0.95
examples:
  - status: success
    data:
      userId: "123e4567-e89b-12d3-a456-426614174000"
      timeframe: "12 weeks"
      groupBy: week
