type: object
description: Response containing AI-powered pattern analysis with comprehensive behavioral and performance pattern identification and impact assessment
required:
  - status
  - data
  - metadata
properties:
  status:
    type: string
    enum: [success]
    description: Response status indicator
    example: success
  data:
    $ref: './PatternAnalysis.yaml'
  metadata:
    type: object
    description: Response metadata including pattern analysis parameters and AI processing information
    required:
      - timestamp
      - aiGenerated
      - analysisScope
      - processingTime
    properties:
      timestamp:
        type: string
        format: date-time
        description: Response generation timestamp
        example: "2024-01-15T10:30:00Z"
      aiGenerated:
        type: boolean
        description: Confirms this content was generated by AI pattern recognition
        example: true
      analysisScope:
        type: object
        description: Scope and parameters of the pattern analysis
        required:
          - timeframe
          - dataCategories
          - patternTypes
        properties:
          timeframe:
            type: string
            description: Time period analyzed for patterns
            example: "12 weeks"
          dataCategories:
            type: array
            description: Categories of data analyzed for patterns
            items:
              type: string
              enum: [workouts, nutrition, wellness, progress, timing, environmental]
            example: ["workouts", "nutrition", "wellness", "timing"]
          patternTypes:
            type: array
            description: Types of patterns searched for
            items:
              type: string
              enum: [behavioral, performance, temporal, cyclical, environmental, physiological]
            example: ["behavioral", "performance", "temporal"]
          minimumConfidence:
            type: number
            format: float
            minimum: 0
            maximum: 1
            description: Minimum confidence threshold for pattern inclusion (0-1)
            example: 0.7
      processingTime:
        type: number
        format: float
        description: AI processing time in milliseconds
        example: 2341.7
      modelVersion:
        type: string
        description: AI model version used for pattern analysis
        example: "pattern-analyzer-v2.1"
      patternsFound:
        type: integer
        minimum: 0
        description: Total number of patterns identified
        example: 7
      highConfidencePatterns:
        type: integer
        minimum: 0
        description: Number of patterns with confidence > 0.8
        example: 4
examples:
  - status: success
    data:
      userId: "123e4567-e89b-12d3-a456-426614174000"
      analysisDate: "2024-01-15T10:30:00Z"
      patterns:
        - id: "pattern_001"
          type: behavioral
          name: "Weekend Workout Avoidance"
          confidence: 0.89
          description: "Consistent pattern of skipping workouts on weekends"
          impact: medium
          frequency: high
          dataSupport:
            - metric: "workout_completion_rate"
              weekday: 0.92
              weekend: 0.67
          recommendations:
            - "Schedule Friday evening prep for weekend workouts"
            - "Find workout buddy for weekend sessions"
        - id: "pattern_002"
          type: performance
          name: "Post-Rest Day Performance Boost"
          confidence: 0.94
          description: "Consistently higher performance after rest days"
          impact: high
          frequency: high
      insights:
        behavioral:
          - insight: "Strong weekly routine adherence"
            confidence: 0.87
            impact: "Positive for consistency"
        performance:
          - insight: "Progressive overload plateau approaching"
            confidence: 0.82
            impact: "May limit future gains"
        temporal:
          - insight: "Morning workouts show 15% better completion rates"
            confidence: 0.91
            impact: "Scheduling optimization opportunity"
    metadata:
      timestamp: "2024-01-15T10:30:00Z"
      aiGenerated: true
      analysisScope:
        timeframe: "12 weeks"
        dataCategories: ["workouts", "nutrition", "wellness", "timing"]
        patternTypes: ["behavioral", "performance", "temporal"]
        minimumConfidence: 0.7
      processingTime: 2341.7
      modelVersion: "pattern-analyzer-v2.1"
      patternsFound: 7
      highConfidencePatterns: 4 