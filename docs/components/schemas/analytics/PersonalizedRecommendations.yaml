type: object
description: AI-generated personalized recommendations with detailed implementation guidance and expected outcomes
required:
  - userId
  - generatedAt
  - recommendations
  - summary
properties:
  userId:
    type: string
    format: uuid
    description: Unique identifier for the user
    example: "123e4567-e89b-12d3-a456-426614174000"
  generatedAt:
    type: string
    format: date-time
    description: Date and time when recommendations were generated
    example: "2024-01-15T10:30:00Z"
  recommendations:
    type: array
    description: Individual personalized recommendations
    minItems: 0
    items:
      type: object
      required:
        - id
        - category
        - priority
        - title
        - description
        - rationale
        - implementation
        - expectedOutcome
        - confidence
      properties:
        id:
          type: string
          description: Unique identifier for this recommendation
          pattern: '^rec_[a-zA-Z0-9]{3,}$'
          example: "rec_001"
        category:
          type: string
          description: Category of this recommendation
          enum: [workout, nutrition, recovery, motivation, goals, habits, equipment, scheduling]
          example: workout
        priority:
          type: string
          description: Priority level for implementation
          enum: [high, medium, low]
          example: high
        title:
          type: string
          description: Concise title for the recommendation
          maxLength: 100
          example: "Optimize Weekend Workout Timing"
        description:
          type: string
          description: Detailed description of the recommendation
          maxLength: 300
          example: "Schedule weekend workouts for Saturday mornings to improve consistency"
        rationale:
          type: string
          description: AI reasoning behind this recommendation
          maxLength: 500
          example: "Data shows 67% weekend adherence vs 92% weekday. Morning slots show higher completion rates."
        implementation:
          type: object
          description: How to implement this recommendation
          required:
            - steps
            - difficulty
            - timeToImplement
          properties:
            steps:
              type: array
              description: Specific implementation steps
              items:
                type: string
                maxLength: 150
              minItems: 1
              example: ["Set Saturday 8 AM alarm", "Prepare workout clothes Friday night", "Block calendar for Saturday morning"]
            difficulty:
              type: string
              description: Implementation difficulty level
              enum: [easy, moderate, challenging, difficult]
              example: easy
            timeToImplement:
              type: string
              description: Expected time to fully implement
              example: "1 week"
            resources:
              type: array
              description: Resources needed for implementation
              items:
                type: string
              example: ["Alarm clock", "Workout clothes"]
            prerequisites:
              type: array
              description: Prerequisites before implementation
              items:
                type: string
              example: ["Current gym membership", "Basic workout routine"]
        expectedOutcome:
          type: object
          description: Expected results from implementing this recommendation
          required:
            - metric
            - improvement
            - timeframe
          properties:
            metric:
              type: string
              description: Metric that should improve
              example: "weekend_adherence"
            improvement:
              type: string
              description: Expected improvement amount
              example: "25% increase"
            timeframe:
              type: string
              description: Expected timeframe to see results
              example: "4 weeks"
            additionalBenefits:
              type: array
              description: Additional benefits beyond primary metric
              items:
                type: string
              example: ["Better sleep schedule", "More consistent energy levels"]
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: AI confidence in this recommendation (0-1)
          example: 0.89
        relatedGoals:
          type: array
          description: User goals this recommendation supports
          items:
            type: string
            format: uuid
          example: ["goal_123", "goal_456"]
        tags:
          type: array
          description: Tags for categorizing and filtering recommendations
          items:
            type: string
          example: ["time_management", "consistency", "weekend"]
        successCriteria:
          type: array
          description: Criteria to measure recommendation success
          items:
            type: string
            maxLength: 100
          example: ["Complete 80% of weekend workouts", "Maintain for 4 consecutive weeks"]
  summary:
    type: object
    description: Summary statistics of the recommendations
    required:
      - totalRecommendations
      - byCategory
      - byPriority
    properties:
      totalRecommendations:
        type: integer
        minimum: 0
        description: Total number of recommendations provided
        example: 8
      byCategory:
        type: object
        description: Breakdown of recommendations by category
        additionalProperties:
          type: integer
          minimum: 0
        example:
          workout: 3
          nutrition: 2
          recovery: 2
          motivation: 1
      byPriority:
        type: object
        description: Breakdown of recommendations by priority level
        properties:
          high:
            type: integer
            minimum: 0
            example: 3
          medium:
            type: integer
            minimum: 0
            example: 4
          low:
            type: integer
            minimum: 0
            example: 1
      averageConfidence:
        type: number
        format: float
        minimum: 0
        maximum: 1
        description: Average confidence score across all recommendations
        example: 0.84
      implementationComplexity:
        type: object
        description: Overall implementation complexity assessment
        properties:
          easy:
            type: integer
            minimum: 0
            example: 5
          moderate:
            type: integer
            minimum: 0
            example: 2
          challenging:
            type: integer
            minimum: 0
            example: 1
          difficult:
            type: integer
            minimum: 0
            example: 0
      estimatedTimeToFullImplementation:
        type: string
        description: Estimated time to implement all recommendations
        example: "6-8 weeks"
examples:
  - userId: "123e4567-e89b-12d3-a456-426614174000"
    generatedAt: "2024-01-15T10:30:00Z"
    recommendations:
      - id: "rec_001"
        category: workout
        priority: high
        title: "Optimize Weekend Workout Timing"
        description: "Schedule weekend workouts for Saturday mornings to improve consistency"
        rationale: "Data shows 67% weekend adherence vs 92% weekday. Morning slots show higher completion rates."
        implementation:
          steps: ["Set Saturday 8 AM alarm", "Prepare workout clothes Friday night", "Block calendar for Saturday morning"]
          difficulty: easy
          timeToImplement: "1 week"
          resources: ["Alarm clock", "Workout clothes"]
        expectedOutcome:
          metric: "weekend_adherence"
          improvement: "25% increase"
          timeframe: "4 weeks"
          additionalBenefits: ["Better sleep schedule", "More consistent energy levels"]
        confidence: 0.89
        relatedGoals: ["goal_123"]
        tags: ["time_management", "consistency", "weekend"]
        successCriteria: ["Complete 80% of weekend workouts", "Maintain for 4 consecutive weeks"]
    summary:
      totalRecommendations: 8
      byCategory:
        workout: 3
        nutrition: 2
        recovery: 2
        motivation: 1
      byPriority:
        high: 3
        medium: 4
        low: 1
      averageConfidence: 0.84
      implementationComplexity:
        easy: 5
        moderate: 2
        challenging: 1
        difficult: 0
      estimatedTimeToFullImplementation: "6-8 weeks" 