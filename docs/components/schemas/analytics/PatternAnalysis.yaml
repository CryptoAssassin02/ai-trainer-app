type: object
description: AI-powered pattern analysis with behavioral and performance pattern identification
required:
  - userId
  - analysisDate
  - patterns
  - insights
properties:
  userId:
    type: string
    format: uuid
    description: Unique identifier for the user
    example: "123e4567-e89b-12d3-a456-426614174000"
  analysisDate:
    type: string
    format: date-time
    description: Date and time when pattern analysis was performed
    example: "2024-01-15T10:30:00Z"
  patterns:
    type: array
    description: Individual patterns identified by AI analysis
    items:
      type: object
      required:
        - id
        - type
        - name
        - confidence
        - description
        - impact
        - frequency
      properties:
        id:
          type: string
          pattern: '^pattern_[a-zA-Z0-9]{3,}$'
          example: "pattern_001"
        type:
          type: string
          enum: [behavioral, performance, temporal, cyclical, environmental, physiological]
          example: behavioral
        name:
          type: string
          maxLength: 100
          example: "Weekend Workout Avoidance"
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          example: 0.89
        description:
          type: string
          maxLength: 300
          example: "Consistent pattern of skipping workouts on weekends"
        impact:
          type: string
          enum: [high, medium, low]
          example: medium
        frequency:
          type: string
          enum: [high, medium, low, rare]
          example: high
        dataSupport:
          type: array
          description: Supporting data for this pattern
          items:
            type: object
            properties:
              metric:
                type: string
                example: "workout_completion_rate"
              values:
                type: object
                additionalProperties: true
                example: {"weekday": 0.92, "weekend": 0.67}
        recommendations:
          type: array
          items:
            type: string
            maxLength: 150
          example: ["Schedule Friday evening prep for weekend workouts"]
  insights:
    type: object
    description: Categorized insights from pattern analysis
    additionalProperties:
      type: array
      items:
        type: object
        properties:
          insight:
            type: string
            maxLength: 200
          confidence:
            type: number
            format: float
            minimum: 0
            maximum: 1
          impact:
            type: string
            maxLength: 150
    example:
      behavioral:
        - insight: "Strong weekly routine adherence"
          confidence: 0.87
          impact: "Positive for consistency"
      performance:
        - insight: "Progressive overload plateau approaching"
          confidence: 0.82
          impact: "May limit future gains"
      temporal:
        - insight: "Morning workouts show 15% better completion rates"
          confidence: 0.91
          impact: "Scheduling optimization opportunity"
  summary:
    type: object
    description: Summary of pattern analysis results
    properties:
      totalPatterns:
        type: integer
        minimum: 0
        example: 7
      highConfidencePatterns:
        type: integer
        minimum: 0
        example: 4
      keyFindings:
        type: array
        items:
          type: string
          maxLength: 100
        example: ["Weekend adherence drops significantly", "Morning workouts more successful"]
      actionableInsights:
        type: integer
        minimum: 0
        description: Number of insights that suggest specific actions
        example: 5
examples:
  - userId: "123e4567-e89b-12d3-a456-426614174000"
    analysisDate: "2024-01-15T10:30:00Z"
    patterns:
      - id: "pattern_001"
        type: behavioral
        name: "Weekend Workout Avoidance"
        confidence: 0.89
        description: "Consistent pattern of skipping workouts on weekends"
        impact: medium
        frequency: high
        dataSupport:
          - metric: "workout_completion_rate"
            values: {"weekday": 0.92, "weekend": 0.67}
        recommendations:
          - "Schedule Friday evening prep for weekend workouts"
          - "Find workout buddy for weekend sessions"
      - id: "pattern_002"
        type: performance
        name: "Post-Rest Day Performance Boost"
        confidence: 0.94
        description: "Consistently higher performance after rest days"
        impact: high
        frequency: high
    insights:
      behavioral:
        - insight: "Strong weekly routine adherence"
          confidence: 0.87
          impact: "Positive for consistency"
      performance:
        - insight: "Progressive overload plateau approaching"
          confidence: 0.82
          impact: "May limit future gains"
      temporal:
        - insight: "Morning workouts show 15% better completion rates"
          confidence: 0.91
          impact: "Scheduling optimization opportunity"
    summary:
      totalPatterns: 7
      highConfidencePatterns: 4
      keyFindings: ["Weekend adherence drops significantly", "Morning workouts more successful"]
      actionableInsights: 5 