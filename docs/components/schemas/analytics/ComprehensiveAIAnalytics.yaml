type: object
description: Comprehensive AI analytics combining insights, patterns, recommendations, and predictions into a complete fitness analysis
required:
  - userId
  - analysisDate
  - executiveSummary
  - insights
  - patterns
  - recommendations
  - predictions
properties:
  userId:
    type: string
    format: uuid
    description: Unique identifier for the user
    example: "123e4567-e89b-12d3-a456-426614174000"
  analysisDate:
    type: string
    format: date-time
    description: Date and time when comprehensive analysis was performed
    example: "2024-01-15T10:30:00Z"
  executiveSummary:
    type: object
    description: High-level summary of the comprehensive analysis
    required:
      - overallProgress
      - keyHighlights
      - priorityActions
      - confidenceLevel
    properties:
      overallProgress:
        type: string
        enum: [excellent, good, moderate, needs_improvement, concerning]
        description: Overall assessment of user's fitness progress
        example: excellent
      keyHighlights:
        type: array
        description: Most important findings from the comprehensive analysis
        items:
          type: string
        minItems: 3
        maxItems: 10
        example: 
          - "83% goal achievement probability within timeframe"
          - "Consistent strength gains with 18% improvement"
          - "Weekend adherence identified as primary optimization area"
      priorityActions:
        type: array
        description: Top recommended actions based on comprehensive analysis
        items:
          type: string
        minItems: 1
        maxItems: 5
        example:
          - "Focus on weekend workout consistency"
          - "Consider strength plateau prevention strategies"
      confidenceLevel:
        type: string
        enum: [very_high, high, medium, low]
        description: Overall confidence in the comprehensive analysis
        example: high
  insights:
    type: object
    description: Summary of AI-generated insights from the comprehensive analysis
    required:
      - totalInsights
      - highPriorityInsights
      - categories
      - topInsights
    properties:
      totalInsights:
        type: integer
        minimum: 0
        description: Total number of insights generated
        example: 12
      highPriorityInsights:
        type: integer
        minimum: 0
        description: Number of high-priority insights
        example: 4
      categories:
        type: array
        description: Categories of insights included
        items:
          type: string
          enum: [performance, adherence, progression, motivation, health_optimization, goal_achievement]
        example: ["performance", "adherence", "progression"]
      topInsights:
        type: array
        description: Most important insights from the analysis
        items:
          type: object
          required:
            - category
            - title
            - confidence
            - urgency
          properties:
            category:
              type: string
              enum: [performance, adherence, progression, motivation, health_optimization, goal_achievement]
            title:
              type: string
              description: Brief title of the insight
            confidence:
              type: number
              format: float
              minimum: 0
              maximum: 1
              description: Confidence score for this insight
            urgency:
              type: string
              enum: [low, medium, high, critical]
              description: Urgency level of addressing this insight
        example:
          - category: performance
            title: "Strength Plateau Approaching"
            confidence: 0.92
            urgency: medium
          - category: adherence
            title: "Weekend Consistency Gap"
            confidence: 0.89
            urgency: high
  patterns:
    type: object
    description: Summary of patterns identified in the comprehensive analysis
    required:
      - totalPatterns
      - highConfidencePatterns
      - behavioralPatterns
      - performancePatterns
      - temporalPatterns
      - keyFindings
    properties:
      totalPatterns:
        type: integer
        minimum: 0
        description: Total number of patterns identified
        example: 8
      highConfidencePatterns:
        type: integer
        minimum: 0
        description: Number of patterns with confidence > 0.8
        example: 5
      behavioralPatterns:
        type: integer
        minimum: 0
        description: Number of behavioral patterns identified
        example: 3
      performancePatterns:
        type: integer
        minimum: 0
        description: Number of performance patterns identified
        example: 2
      temporalPatterns:
        type: integer
        minimum: 0
        description: Number of temporal/timing patterns identified
        example: 3
      keyFindings:
        type: array
        description: Most significant pattern findings
        items:
          type: string
        example:
          - "Weekend adherence drops 25%"
          - "Morning workouts 15% more successful"
          - "Sleep quality directly impacts next-day performance"
  recommendations:
    type: object
    description: Summary of personalized recommendations from comprehensive analysis
    required:
      - totalRecommendations
      - implementationComplexity
      - estimatedImpact
      - priorityRecommendations
    properties:
      totalRecommendations:
        type: integer
        minimum: 0
        description: Total number of recommendations generated
        example: 10
      implementationComplexity:
        type: string
        enum: [very_easy, easy, moderate, difficult, very_difficult]
        description: Overall complexity of implementing recommendations
        example: moderate
      estimatedImpact:
        type: string
        enum: [very_high, high, medium, low, minimal]
        description: Expected impact of implementing recommendations
        example: high
      priorityRecommendations:
        type: array
        description: Top priority recommendations with expected outcomes
        items:
          type: object
          required:
            - category
            - title
            - impact
          properties:
            category:
              type: string
              enum: [workout, nutrition, recovery, motivation, lifestyle]
            title:
              type: string
              description: Brief title of the recommendation
            impact:
              type: string
              description: Expected impact description
        example:
          - category: workout
            title: "Weekend Schedule Optimization"
            impact: "25% adherence improvement"
          - category: recovery
            title: "Sleep Schedule Optimization"
            impact: "15% performance boost"
  predictions:
    type: object
    description: Summary of goal achievement predictions from comprehensive analysis
    required:
      - activeGoals
      - averageAchievementProbability
      - onTrackGoals
      - atRiskGoals
      - estimatedTimeToCompletion
    properties:
      activeGoals:
        type: integer
        minimum: 0
        description: Number of active goals analyzed
        example: 3
      averageAchievementProbability:
        type: number
        format: float
        minimum: 0
        maximum: 1
        description: Average probability of achieving all goals
        example: 0.83
      onTrackGoals:
        type: integer
        minimum: 0
        description: Number of goals currently on track
        example: 2
      atRiskGoals:
        type: integer
        minimum: 0
        description: Number of goals at risk of not being achieved
        example: 1
      estimatedTimeToCompletion:
        type: string
        description: Estimated time to complete all goals
        example: "14 weeks average"
  correlationInsights:
    type: object
    description: Cross-metric correlations and relationships identified
    properties:
      strongCorrelations:
        type: array
        description: Strong correlations identified between different metrics
        items:
          type: object
          required:
            - metric1
            - metric2
            - correlationStrength
            - relationship
          properties:
            metric1:
              type: string
              description: First metric in correlation
            metric2:
              type: string
              description: Second metric in correlation
            correlationStrength:
              type: number
              format: float
              minimum: -1
              maximum: 1
              description: Correlation coefficient (-1 to 1)
            relationship:
              type: string
              description: Description of the relationship
        example:
          - metric1: "sleep_quality"
            metric2: "workout_performance"
            correlationStrength: 0.78
            relationship: "Better sleep strongly correlates with workout performance"
          - metric1: "weekend_adherence"
            metric2: "weekly_progress"
            correlationStrength: 0.71
            relationship: "Weekend workout consistency significantly impacts weekly progress"
  riskAssessment:
    type: object
    description: Risk assessment for fitness goals and health outcomes
    properties:
      overallRiskLevel:
        type: string
        enum: [very_low, low, moderate, high, very_high]
        description: Overall risk level assessment
        example: low
      identifiedRisks:
        type: array
        description: Specific risks identified in the analysis
        items:
          type: object
          required:
            - riskType
            - severity
            - description
            - mitigation
          properties:
            riskType:
              type: string
              enum: [overtraining, plateau, injury, burnout, goal_failure]
            severity:
              type: string
              enum: [low, medium, high, critical]
            description:
              type: string
              description: Description of the identified risk
            mitigation:
              type: string
              description: Recommended mitigation strategy
        example:
          - riskType: plateau
            severity: medium
            description: "Strength gains may plateau within 2-3 weeks"
            mitigation: "Implement progressive overload variation"
  metadata:
    type: object
    description: Metadata about the comprehensive analysis
    required:
      - dataQualityScore
      - analysisCompletenesss
      - processingComponents
    properties:
      dataQualityScore:
        type: number
        format: float
        minimum: 0
        maximum: 1
        description: Overall quality score of input data used
        example: 0.91
      analysisCompleteness:
        type: number
        format: float
        minimum: 0
        maximum: 1
        description: Completeness score of the comprehensive analysis
        example: 0.95
      processingComponents:
        type: array
        description: AI components used in comprehensive analysis
        items:
          type: string
          enum: [insight_engine, pattern_detector, recommendation_system, prediction_model, correlation_analyzer]
        example: ["insight_engine", "pattern_detector", "recommendation_system", "prediction_model"]
examples:
  - userId: "123e4567-e89b-12d3-a456-426614174000"
    analysisDate: "2024-01-15T10:30:00Z"
    executiveSummary:
      overallProgress: excellent
      keyHighlights:
        - "83% goal achievement probability within timeframe"
        - "Consistent strength gains with 18% improvement"
        - "Weekend adherence identified as primary optimization area"
        - "Strong correlation between sleep and performance identified"
      priorityActions:
        - "Focus on weekend workout consistency"
        - "Consider strength plateau prevention strategies"
        - "Optimize sleep schedule for better performance"
      confidenceLevel: high
    insights:
      totalInsights: 12
      highPriorityInsights: 4
      categories: ["performance", "adherence", "progression"]
      topInsights:
        - category: performance
          title: "Strength Plateau Approaching"
          confidence: 0.92
          urgency: medium
        - category: adherence
          title: "Weekend Consistency Gap"
          confidence: 0.89
          urgency: high
    patterns:
      totalPatterns: 8
      highConfidencePatterns: 5
      behavioralPatterns: 3
      performancePatterns: 2
      temporalPatterns: 3
      keyFindings:
        - "Weekend adherence drops 25%"
        - "Morning workouts 15% more successful"
        - "Sleep quality directly impacts next-day performance"
    recommendations:
      totalRecommendations: 10
      implementationComplexity: moderate
      estimatedImpact: high
      priorityRecommendations:
        - category: workout
          title: "Weekend Schedule Optimization"
          impact: "25% adherence improvement"
        - category: recovery
          title: "Sleep Schedule Optimization"
          impact: "15% performance boost"
    predictions:
      activeGoals: 3
      averageAchievementProbability: 0.83
      onTrackGoals: 2
      atRiskGoals: 1
      estimatedTimeToCompletion: "14 weeks average"
    correlationInsights:
      strongCorrelations:
        - metric1: "sleep_quality"
          metric2: "workout_performance"
          correlationStrength: 0.78
          relationship: "Better sleep strongly correlates with workout performance"
        - metric1: "weekend_adherence"
          metric2: "weekly_progress"
          correlationStrength: 0.71
          relationship: "Weekend workout consistency significantly impacts weekly progress"
    riskAssessment:
      overallRiskLevel: low
      identifiedRisks:
        - riskType: plateau
          severity: medium
          description: "Strength gains may plateau within 2-3 weeks"
          mitigation: "Implement progressive overload variation"
    metadata:
      dataQualityScore: 0.91
      analysisCompleteness: 0.95
      processingComponents: ["insight_engine", "pattern_detector", "recommendation_system", "prediction_model"] 