type: object
description: Response containing comprehensive adherence analysis with detailed compliance metrics across all fitness plan components
required:
  - status
  - data
  - metadata
properties:
  status:
    type: string
    enum: [success]
    description: Response status indicator
    example: success
  data:
    $ref: './AdherenceMetrics.yaml'
  metadata:
    type: object
    description: Response metadata including analysis parameters and quality metrics
    required:
      - timestamp
      - analysisScope
      - lastUpdated
    properties:
      timestamp:
        type: string
        format: date-time
        description: Response generation timestamp
        example: "2024-01-15T10:30:00Z"
      analysisScope:
        type: object
        description: Scope and parameters of the adherence analysis
        required:
          - components
          - dataPoints
        properties:
          components:
            type: array
            description: Plan components included in adherence analysis
            items:
              type: string
              enum: [workouts, nutrition, check_ins, sleep, hydration]
            minItems: 1
            example: ["workouts", "nutrition", "check_ins"]
          dataPoints:
            type: integer
            minimum: 0
            description: Total number of data points analyzed
            example: 90
      lastUpdated:
        type: string
        format: date-time
        description: Timestamp when adherence data was last calculated
        example: "2024-01-15T09:00:00Z"
      processingTime:
        type: number
        format: float
        description: Response processing time in milliseconds
        example: 67.2
      qualityScore:
        type: number
        format: float
        minimum: 0
        maximum: 1
        description: Overall data quality score for adherence calculation (0-1)
        example: 0.92
examples:
  - status: success
    data:
      userId: "123e4567-e89b-12d3-a456-426614174000"
      timeframe: "30 days"
      hasData: true
      overall:
        adherenceScore: 0.82
        category: good
        trend: improving
        consistency: 0.78
      components:
        workouts:
          adherence: 0.85
          planned: 24
          completed: 20
          missed: 4
          streaks:
            current: 5
            longest: 12
        nutrition:
          adherence: 0.78
          loggedDays: 23
          totalDays: 30
          macroCompliance: 0.82
          calorieCompliance: 0.75
        checkIns:
          adherence: 0.90
          completed: 27
          total: 30
          consistency: excellent
    metadata:
      timestamp: "2024-01-15T10:30:00Z"
      analysisScope:
        components: ["workouts", "nutrition", "check_ins"]
        dataPoints: 90
      lastUpdated: "2024-01-15T09:00:00Z"
      processingTime: 67.2
      qualityScore: 0.92 