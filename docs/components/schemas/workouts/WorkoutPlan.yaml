type: object
required: [id, name, planData, aiGenerated, status, createdAt, updatedAt]
properties:
  id:
    type: string
    format: uuid
    description: Unique workout plan identifier
  name:
    type: string
    description: Name of the workout plan
    example: "Upper Body Strength Focus"
  description:
    type: string
    nullable: true
    description: Detailed description of the plan
    example: "AI-generated workout plan focusing on compound movements"
  planData:
    type: object
    required: [exercises]
    properties:
      exercises:
        type: array
        items:
          $ref: './Exercise.yaml'
        minItems: 1
        description: Array of exercises in the plan
      weeklySchedule:
        type: object
        properties:
          daysPerWeek:
            type: integer
            minimum: 1
            maximum: 7
            description: Number of workout days per week
          workoutDays:
            type: array
            items:
              type: string
            description: Specific days for workouts
          restDays:
            type: array
            items:
              type: string
            description: Rest days in the schedule
        description: Weekly workout schedule structure
      researchInsights:
        type: array
        items:
          type: string
        description: AI-researched insights and tips
        example: ["Progressive overload is key for strength gains"]
      reasoning:
        type: string
        description: AI explanation of plan construction logic
        example: "Plan designed for intermediate lifters focusing on compound movements"
      warnings:
        type: array
        items:
          type: string
        description: Safety warnings or considerations
      errors:
        type: array
        items:
          type: string
        description: Any errors encountered during generation
    description: Complete workout plan data structure
  aiGenerated:
    type: boolean
    description: Whether plan was AI-generated
    example: true
  status:
    type: string
    enum: [draft, active, archived]
    description: Current status of the workout plan
    example: active
  difficultyLevel:
    type: string
    enum: [beginner, intermediate, advanced]
    nullable: true
    description: Plan difficulty level
  estimatedDuration:
    type: integer
    nullable: true
    description: Estimated workout duration in minutes
    example: 75
  tags:
    type: array
    items:
      type: string
    nullable: true
    description: Plan tags for categorization
    example: ["strength", "upper-body", "compound"]
  goals:
    type: array
    items:
      type: string
    nullable: true
    description: Fitness goals addressed by this plan
    example: ["muscle_gain", "strength"]
  equipmentRequired:
    type: array
    items:
      type: string
    nullable: true
    description: Equipment needed for this plan
    example: ["barbell", "dumbbells", "pull-up-bar"]
  version:
    type: integer
    description: Plan version for optimistic concurrency control
    example: 1
  createdAt:
    type: string
    format: date-time
    description: Plan creation timestamp
  updatedAt:
    type: string
    format: date-time
    description: Plan last update timestamp 