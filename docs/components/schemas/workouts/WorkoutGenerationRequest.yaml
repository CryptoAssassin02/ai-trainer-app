type: object
required: [fitnessLevel, goals]
properties:
  fitnessLevel:
    type: string
    enum: [beginner, intermediate, advanced]
    description: User's fitness experience level
    example: intermediate
  goals:
    type: array
    items:
      type: string
      enum: [weight_loss, muscle_gain, strength, endurance, flexibility, general_fitness]
    minItems: 1
    maxItems: 5
    description: User's fitness objectives (1-5 goals)
    example: ["muscle_gain", "strength"]
  equipment:
    type: array
    items:
      type: string
    nullable: true
    description: Available fitness equipment
    example: ["dumbbells", "barbell", "resistance_bands"]
  restrictions:
    type: array
    items:
      type: string
    nullable: true
    description: Physical limitations or injuries to avoid
    example: ["lower_back_pain", "knee_injury"]
  exerciseTypes:
    type: array
    items:
      type: string
      enum: [cardio, strength, hiit, yoga, flexibility, sports_specific]
    nullable: true
    description: Preferred exercise categories
    example: ["strength", "cardio"]
  workoutFrequency:
    type: string
    nullable: true
    description: Preferred workout schedule
    example: "3x per week"
  targetDuration:
    type: integer
    minimum: 15
    maximum: 180
    nullable: true
    description: Target workout duration in minutes
    example: 60
  experienceDetails:
    type: object
    nullable: true
    properties:
      yearsTraining:
        type: integer
        minimum: 0
        maximum: 50
        description: Years of training experience
      specificSports:
        type: array
        items:
          type: string
        description: Sports or activities with experience
      currentRoutine:
        type: string
        description: Description of current workout routine
    description: Additional experience context for personalization
example:
  fitnessLevel: intermediate
  goals: ["muscle_gain", "strength"]
  equipment: ["dumbbells", "barbell"]
  restrictions: ["lower_back_pain"]
  exerciseTypes: ["strength"]
  workoutFrequency: "4x per week"
  targetDuration: 75 