type: object
properties:
  limit:
    type: integer
    minimum: 1
    maximum: 100
    default: 10
    description: Maximum number of plans to return
    example: 20
  offset:
    type: integer
    minimum: 0
    default: 0
    description: Number of plans to skip for pagination
    example: 0
  searchTerm:
    type: string
    minLength: 2
    maxLength: 100
    nullable: true
    description: Search term for plan names or descriptions
    example: "strength"
  status:
    type: string
    enum: [draft, active, archived]
    nullable: true
    description: Filter by plan status
    example: active
  difficulty:
    type: string
    enum: [beginner, intermediate, advanced]
    nullable: true
    description: Filter by difficulty level
    example: intermediate
  sortBy:
    type: string
    enum: [created_at, updated_at, name]
    default: created_at
    description: Field to sort results by
    example: updated_at
  sortOrder:
    type: string
    enum: [asc, desc]
    default: desc
    description: Sort order
    example: desc
description: Query parameters for filtering workout plans list 