type: object
required: [status, message, code]
properties:
  status:
    type: string
    enum: [error]
    description: Response status indicator
  message:
    type: string
    description: Rate limit error message
  code:
    type: string
    enum: [WORKOUT_GEN_LIMIT_EXCEEDED, AI_OPERATION_LIMIT_EXCEEDED]
    description: Specific workout rate limit error code
  limitType:
    type: string
    enum: [generation, adjustment, ai_operations]
    description: Type of operation that was rate limited
  retryAfter:
    type: integer
    description: Seconds until the user can try again
  limits:
    type: object
    nullable: true
    properties:
      hourlyLimit:
        type: integer
        description: Hourly request limit
      remainingRequests:
        type: integer
        description: Remaining requests in current window
      resetTime:
        type: string
        format: date-time
        description: When the rate limit window resets
    description: Rate limit details
example:
  status: error
  message: Too many workout generation requests. Please try again later.
  code: WORKOUT_GEN_LIMIT_EXCEEDED
  limitType: generation
  retryAfter: 3600
  limits:
    hourlyLimit: 10
    remainingRequests: 0
    resetTime: "2024-01-15T11:30:00Z" 