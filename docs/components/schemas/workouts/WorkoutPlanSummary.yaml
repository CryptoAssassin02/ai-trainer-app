type: object
required: [id, name, status, createdAt]
properties:
  id:
    type: string
    format: uuid
    description: Unique workout plan identifier
  name:
    type: string
    description: Name of the workout plan
    example: "Upper Body Strength"
  description:
    type: string
    nullable: true
    description: Brief plan description
  difficulty:
    type: string
    enum: [beginner, intermediate, advanced]
    nullable: true
    description: Plan difficulty level
  estimatedDuration:
    type: integer
    nullable: true
    description: Estimated workout time in minutes
    example: 75
  exerciseCount:
    type: integer
    description: Number of exercises in the plan
    example: 6
  equipmentRequired:
    type: array
    items:
      type: string
    nullable: true
    description: Equipment needed for this plan
    example: ["barbell", "dumbbells"]
  tags:
    type: array
    items:
      type: string
    nullable: true
    description: Plan tags
    example: ["strength", "upper-body"]
  status:
    type: string
    enum: [draft, active, archived]
    description: Current plan status
  lastUsed:
    type: string
    format: date-time
    nullable: true
    description: When plan was last used for a workout
  usageCount:
    type: integer
    default: 0
    description: Number of times plan has been used
  aiGenerated:
    type: boolean
    description: Whether plan was AI-generated
  createdAt:
    type: string
    format: date-time
    description: Plan creation timestamp
  updatedAt:
    type: string
    format: date-time
    description: Plan last update timestamp 