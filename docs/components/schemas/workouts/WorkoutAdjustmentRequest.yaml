type: object
required: [adjustments]
properties:
  adjustments:
    oneOf:
      - type: string
        minLength: 5
        maxLength: 1000
        description: Natural language feedback for AI-powered adjustment
        example: "Make the workout more challenging and focus on compound movements"
      - type: object
        properties:
          exercisesToAdd:
            type: array
            items:
              type: string
            description: Specific exercises to add to the plan
            example: ["deadlifts", "pull-ups"]
          exercisesToRemove:
            type: array
            items:
              type: string
            description: Specific exercises to remove from the plan
            example: ["leg extensions", "bicep curls"]
          notesOrPreferences:
            type: string
            minLength: 5
            maxLength: 1000
            description: Additional preferences or feedback
            example: "Focus more on upper body and reduce leg volume"
          intensityAdjustment:
            type: string
            enum: [increase, decrease, maintain]
            description: Overall intensity modification
            example: increase
          volumeAdjustment:
            type: string
            enum: [increase, decrease, maintain]
            description: Overall volume modification
            example: maintain
        minProperties: 1
        description: Structured adjustment instructions
    description: Either natural language feedback or structured adjustment object
  userContext:
    type: object
    nullable: true
    properties:
      recentPerformance:
        type: string
        description: How recent workouts have been going
      energyLevels:
        type: string
        enum: [low, moderate, high]
        description: Current energy levels
      timeConstraints:
        type: string
        description: Any time limitations for workouts
      equipmentChanges:
        type: array
        items:
          type: string
        description: Changes in available equipment
    description: Additional context for better adjustments
example:
  adjustments: "Make the workout more challenging and add more compound movements"
  userContext:
    recentPerformance: "Workouts have been feeling too easy"
    energyLevels: high
    timeConstraints: "Need to finish in 60 minutes" 