type: object
required:
  - pushNotifications
  - workoutReminders
  - progressUpdates
properties:
  pushNotifications:
    type: object
    required:
      - enabled
      - allowCritical
    properties:
      enabled:
        type: boolean
        description: Master switch for all push notifications
        example: true
      allowCritical:
        type: boolean
        description: Allow critical/emergency notifications even when disabled
        example: true
      quietHours:
        type: object
        properties:
          enabled:
            type: boolean
            example: true
          startTime:
            type: string
            pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
            description: Start time in HH:MM format (24-hour)
            example: "22:00"
          endTime:
            type: string
            pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
            description: End time in HH:MM format (24-hour)
            example: "07:00"
          timezone:
            type: string
            description: User's timezone for quiet hours
            example: "America/New_York"
      categories:
        type: object
        properties:
          workouts:
            type: boolean
            example: true
          progress:
            type: boolean
            example: true
          social:
            type: boolean
            example: false
          achievements:
            type: boolean
            example: true
          reminders:
            type: boolean
            example: true
  workoutReminders:
    type: object
    required:
      - enabled
      - frequency
    properties:
      enabled:
        type: boolean
        description: Enable workout reminder notifications
        example: true
      frequency:
        type: string
        enum: [daily, weekdays_only, custom]
        description: Workout reminder frequency
        example: weekdays_only
      preferredTimes:
        type: array
        maxItems: 3
        description: Preferred workout reminder times
        items:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: "07:00"
      advanceNotice:
        type: integer
        description: Minutes before scheduled workout to send reminder
        minimum: 0
        maximum: 180
        example: 30
      restDayReminders:
        type: boolean
        description: Send reminders on scheduled rest days
        example: false
      customMessage:
        type: string
        maxLength: 100
        description: Custom reminder message
        example: "Time to crush your workout! 💪"
  progressUpdates:
    type: object
    required:
      - enabled
      - frequency
    properties:
      enabled:
        type: boolean
        description: Enable progress update notifications
        example: true
      frequency:
        type: string
        enum: [daily, weekly, monthly, milestone_only]
        description: Progress update frequency
        example: weekly
      preferredDay:
        type: string
        enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
        description: Preferred day for weekly progress updates
        example: sunday
      preferredTime:
        type: string
        pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        description: Preferred time for progress notifications
        example: "18:00"
      includeMetrics:
        type: object
        properties:
          weight:
            type: boolean
            example: true
          workouts:
            type: boolean
            example: true
          strength:
            type: boolean
            example: true
          adherence:
            type: boolean
            example: true
      motivationalMessages:
        type: boolean
        description: Include motivational messages in progress updates
        example: true
  achievements:
    type: object
    properties:
      enabled:
        type: boolean
        description: Enable achievement notifications
        example: true
      soundEnabled:
        type: boolean
        description: Play sound for achievement notifications
        example: true
      vibrationEnabled:
        type: boolean
        description: Enable vibration for achievement notifications
        example: true
      showBadges:
        type: boolean
        description: Show achievement badges in notifications
        example: true
  emailNotifications:
    type: object
    properties:
      enabled:
        type: boolean
        description: Enable email notifications as backup
        example: false
      weeklyDigest:
        type: boolean
        description: Send weekly progress digest via email
        example: true
      importantUpdates:
        type: boolean
        description: Send important app updates via email
        example: true
  smsNotifications:
    type: object
    properties:
      enabled:
        type: boolean
        description: Enable SMS notifications for critical updates
        example: false
      phoneNumber:
        type: string
        pattern: '^\+[1-9]\d{1,14}$'
        description: Phone number for SMS notifications (E.164 format)
        example: "+1234567890"
      criticalOnly:
        type: boolean
        description: Only send SMS for critical notifications
        example: true
description: Comprehensive mobile notification preferences including push notifications, workout reminders, progress updates, and multi-channel settings 