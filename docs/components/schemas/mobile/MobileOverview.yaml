type: object
required:
  - summary
  - charts
  - insights
properties:
  summary:
    type: object
    required:
      - workouts
      - adherence
      - progress
    properties:
      workouts:
        type: integer
        description: Total workouts completed in the timeframe
        minimum: 0
        example: 12
      adherence:
        type: integer
        description: Overall adherence percentage
        minimum: 0
        maximum: 100
        example: 85
      progress:
        type: string
        enum: [positive, neutral, negative, insufficient_data]
        description: Overall progress trend indicator
        example: positive
      currentStreak:
        type: integer
        description: Current workout streak in days
        minimum: 0
        example: 7
      weeklyGoal:
        type: object
        properties:
          target:
            type: integer
            minimum: 1
            example: 4
          completed:
            type: integer
            minimum: 0
            example: 3
          percentage:
            type: integer
            minimum: 0
            maximum: 100
            example: 75
  charts:
    type: object
    required:
      - compressed
      - dataPoints
    properties:
      compressed:
        type: boolean
        description: Indicates if chart data is compressed for mobile
        example: true
      dataPoints:
        type: array
        maxItems: 30
        description: Compressed chart data points (limited for mobile performance)
        items:
          type: object
          required:
            - date
            - value
          properties:
            date:
              type: string
              format: date
              example: "2024-01-15"
            value:
              type: number
              format: float
              example: 85.5
            type:
              type: string
              enum: [workout, weight, wellness, adherence]
              example: workout
      chartConfig:
        type: object
        properties:
          timeRange:
            type: string
            enum: [week, month, 3months]
            example: month
          primaryMetric:
            type: string
            enum: [workouts, weight, wellness, strength]
            example: workouts
  insights:
    type: array
    maxItems: 5
    description: Quick insights optimized for mobile display
    items:
      type: string
      maxLength: 100
      example: "Great consistency this week! 4 workouts completed."
  quickStats:
    type: object
    properties:
      thisWeek:
        type: object
        properties:
          workouts:
            type: integer
            example: 3
          avgRating:
            type: number
            format: float
            example: 8.5
      lastWeek:
        type: object
        properties:
          workouts:
            type: integer
            example: 4
          avgRating:
            type: number
            format: float
            example: 7.8
      improvement:
        type: object
        properties:
          workouts:
            type: integer
            example: -1
          avgRating:
            type: number
            format: float
            example: 0.7
description: Mobile-optimized analytics overview with compressed data structures and limited data points for performance 