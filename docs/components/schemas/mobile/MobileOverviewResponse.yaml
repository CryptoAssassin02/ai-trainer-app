type: object
required:
  - status
  - data  
  - metadata
properties:
  status:
    type: string
    enum: [success]
    description: Response status
    example: success
  data:
              $ref: './MobileOverview.yaml'
  metadata:
    type: object
    required:
      - payloadSize
      - optimizedForMobile
      - cacheUntil
    properties:
      payloadSize:
        type: integer
        description: Size of response payload in bytes (must be < 50KB for mobile optimization)
        maximum: 50000
        example: 45000
      optimizedForMobile:
        type: boolean
        description: Indicates if response is optimized for mobile consumption
        example: true
      cacheUntil:
        type: string
        format: date-time
        description: Timestamp until which this response can be cached
        example: "2024-01-01T12:05:00Z"
      compressionRatio:
        type: number
        format: float
        description: Data compression ratio applied
        minimum: 0.1
        maximum: 1.0
        example: 0.65
      responseTime:
        type: integer
        description: Response generation time in milliseconds
        example: 150
description: Response containing mobile-optimized analytics overview with size and caching metadata 