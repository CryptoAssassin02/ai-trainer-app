type: object
required:
  - userMetrics
  - peerGroupAverage
  - percentile
  - leaderboard
properties:
  userMetrics:
    type: object
    required:
      - workoutConsistency
      - strengthGains
      - overallFitness
    properties:
      workoutConsistency:
        type: number
        format: float
        description: User's workout consistency score (0.0-1.0)
        minimum: 0.0
        maximum: 1.0
        example: 0.85
      strengthGains:
        type: number
        format: float
        description: User's strength progression score (0.0-1.0)
        minimum: 0.0
        maximum: 1.0
        example: 0.72
      overallFitness:
        type: number
        format: float
        description: User's overall fitness score (0.0-1.0)
        minimum: 0.0
        maximum: 1.0
        example: 0.78
      adherenceRate:
        type: number
        format: float
        description: User's program adherence rate (0.0-1.0)
        minimum: 0.0
        maximum: 1.0
        example: 0.88
  peerGroupAverage:
    type: object
    required:
      - workoutConsistency
      - strengthGains
      - overallFitness
    properties:
      workoutConsistency:
        type: number
        format: float
        description: Peer group average workout consistency
        minimum: 0.0
        maximum: 1.0
        example: 0.68
      strengthGains:
        type: number
        format: float
        description: Peer group average strength gains
        minimum: 0.0
        maximum: 1.0
        example: 0.65
      overallFitness:
        type: number
        format: float
        description: Peer group average overall fitness
        minimum: 0.0
        maximum: 1.0
        example: 0.71
      adherenceRate:
        type: number
        format: float
        description: Peer group average adherence rate
        minimum: 0.0
        maximum: 1.0
        example: 0.75
  percentile:
    type: object
    required:
      - workoutConsistency
      - strengthGains
      - overallFitness
    properties:
      workoutConsistency:
        type: integer
        description: User's percentile rank for workout consistency
        minimum: 1
        maximum: 100
        example: 85
      strengthGains:
        type: integer
        description: User's percentile rank for strength gains
        minimum: 1
        maximum: 100
        example: 72
      overallFitness:
        type: integer
        description: User's percentile rank for overall fitness
        minimum: 1
        maximum: 100
        example: 78
      adherenceRate:
        type: integer
        description: User's percentile rank for adherence
        minimum: 1
        maximum: 100
        example: 92
  leaderboard:
    type: array
    maxItems: 10
    description: Top performers in peer group (anonymized, limited for mobile)
    items:
      type: object
      required:
        - rank
        - displayName
        - metric
        - isCurrentUser
      properties:
        rank:
          type: integer
          description: Rank position in leaderboard
          minimum: 1
          example: 3
        displayName:
          type: string
          description: Anonymized display name
          pattern: '^(Anonymous|User)[A-Z0-9]{3,6}$'
          example: "UserABC123"
        metric:
          type: number
          format: float
          description: Primary metric score for ranking
          minimum: 0.0
          maximum: 1.0
          example: 0.89
        isCurrentUser:
          type: boolean
          description: Whether this entry represents the current user
          example: false
        streak:
          type: integer
          description: Current workout streak in days
          minimum: 0
          example: 12
  insights:
    type: array
    maxItems: 3
    description: Peer comparison insights (limited for mobile)
    items:
      type: string
      maxLength: 80
      example: "You're in the top 15% for workout consistency!"
  challengeOpportunities:
    type: array
    maxItems: 2
    description: Areas where user can improve relative to peers
    items:
      type: object
      properties:
        category:
          type: string
          enum: [consistency, strength, endurance, adherence]
          example: strength
        improvementPotential:
          type: string
          enum: [low, medium, high]
          example: medium
        suggestion:
          type: string
          maxLength: 100
          example: "Focus on progressive overload to match peer strength gains"
description: Mobile-optimized peer comparison data with anonymized leaderboard and limited insights for performance 