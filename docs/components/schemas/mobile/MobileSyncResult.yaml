type: object
required:
  - syncStatus
  - recordsProcessed
  - conflictsResolved
  - nextSyncRecommended
properties:
  syncStatus:
    type: string
    enum: [completed, partial, failed, conflict_resolution_required]
    description: Overall status of the sync operation
    example: completed
  recordsProcessed:
    type: integer
    description: Total number of records processed during sync
    minimum: 0
    example: 25
  conflictsResolved:
    type: integer
    description: Number of data conflicts automatically resolved
    minimum: 0
    example: 2
  updatedAnalytics:
    type: object
    description: Compressed mobile analytics data updated as result of sync
    properties:
      workouts:
        type: object
        properties:
          updated:
            type: integer
            example: 5
          new:
            type: integer
            example: 2
      checkIns:
        type: object
        properties:
          updated:
            type: integer
            example: 3
          new:
            type: integer
            example: 1
      goals:
        type: object
        properties:
          progressUpdated:
            type: boolean
            example: true
          milestonesAchieved:
            type: integer
            example: 1
  nextSyncRecommended:
    type: string
    format: date-time
    description: Recommended timestamp for next sync operation
    example: "2024-01-01T12:00:00Z"
  conflictDetails:
    type: array
    description: Details of conflicts that were resolved
    items:
      type: object
      required:
        - recordType
        - recordId
        - resolutionStrategy
      properties:
        recordType:  
          type: string
          enum: [workout, check_in, goal, analytics]
          example: workout
        recordId:
          type: string
          example: "wl_123abc"
        resolutionStrategy:
          type: string
          enum: [server_wins, client_wins, merge, user_action_required]
          example: server_wins
        conflictReason:
          type: string
          enum: [timestamp_mismatch, data_inconsistency, version_conflict]
          example: timestamp_mismatch
        resolvedAt:
          type: string
          format: date-time
          example: "2024-01-01T12:00:00.500Z"
  warnings:
    type: array
    description: Non-critical warnings from sync operation
    items:
      type: object
      properties:
        code:
          type: string
          example: "OFFLINE_DATA_AGED"
        message:
          type: string
          example: "Some offline data is older than 7 days"
        severity:
          type: string
          enum: [low, medium, high]
          example: medium
  dataIntegrity:
    type: object
    description: Data integrity verification results
    properties:
      checksumValid:
        type: boolean
        example: true
      missingRecords:
        type: integer
        example: 0
      duplicatesRemoved:
        type: integer
        example: 1
description: Detailed results of mobile data synchronization including conflict resolution and data integrity information 