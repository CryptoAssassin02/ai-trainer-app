type: object
required:
  - status
  - data
  - metadata
properties:
  status:
    type: string
    enum: [success]
    description: Sync operation status
    example: success
  data:
              $ref: './MobileSyncResult.yaml'
  metadata:
    type: object
    required:
      - syncType
      - processingTime
    properties:
      syncType:
        type: string
        enum: [full, incremental, analytics_only]
        description: Type of sync operation performed
        example: incremental
      processingTime:
        type: integer
        description: Sync processing time in milliseconds
        minimum: 0
        example: 1250
      serverTimestamp:
        type: string
        format: date-time
        description: Server timestamp when sync was processed
        example: "2024-01-01T12:00:00.000Z"
      clientVersion:
        type: string
        description: Client app version that initiated sync
        pattern: '^\d+\.\d+\.\d+$'
        example: "2.1.0"
      payloadSize:
        type: integer
        description: Size of sync payload processed in bytes
        minimum: 0
        example: 15000
      networkLatency:
        type: integer
        description: Network latency during sync in milliseconds
        minimum: 0
        example: 45
description: Response from mobile data synchronization operation including conflict resolution results and processing metadata 