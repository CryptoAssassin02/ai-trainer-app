type: object
properties:
  view:
    type: string
    enum: [overview, trends, progress, goals, simplified]
    default: overview
    description: Type of mobile analytics view
  timeframe:
    type: string
    enum: [1week, 2weeks, 1month, 3months]
    default: 1month
    description: Time period for analytics (limited for mobile)
  metrics:
    type: array
    items:
      type: string
      enum: [workouts, progress, consistency, goals, streaks, achievements]
    maxItems: 3
    description: Specific metrics to include (max 3 for mobile)
  payloadLimit:
    type: integer
    minimum: 10000
    maximum: 50000
    default: 50000
    description: Maximum payload size in bytes
  compression:
    type: string
    enum: [none, gzip, minimal]
    default: gzip
    description: Response compression preference
  includeCharts:
    type: boolean
    default: false
    description: Whether to include chart data (impacts payload size)
  includeInsights:
    type: boolean
    default: true
    description: Whether to include AI insights
  maxInsights:
    type: integer
    minimum: 1
    maximum: 5
    default: 3
    description: Maximum number of insights (limited for mobile)
  priority:
    type: string
    enum: [essential, standard, detailed]
    default: essential
    description: Data priority level for mobile delivery
  connectionType:
    type: string
    enum: [wifi, cellular, slow, fast]
    description: User's connection type for optimization
  cachePreference:
    type: string
    enum: [prefer_cache, prefer_fresh, balanced]
    default: balanced
    description: Caching preference for mobile performance
  offline:
    type: boolean
    default: false
    description: Whether request is for offline preparation
  deviceInfo:
    type: object
    properties:
      platform:
        type: string
        enum: [ios, android, mobile_web]
      screenSize:
        type: string
        enum: [small, medium, large]
      appVersion:
        type: string
      osVersion:
        type: string
    description: Device information for optimization
  lastSync:
    type: string
    format: date-time
    description: Last successful sync timestamp
  partialUpdate:
    type: boolean
    default: false
    description: Whether to request only changes since last sync
  urgency:
    type: string
    enum: [low, normal, high]
    default: normal
    description: Request urgency for prioritization
  includeBackground:
    type: boolean
    default: false
    description: Whether this is a background request 