# Mobile Optimization Parameters - Used for mobile data efficiency

compressionLevel:
  name: compressionLevel
  in: query
  description: Data compression level for mobile optimization
  schema:
    type: string
    enum:
      - none
      - low
      - adaptive
      - high
    default: adaptive
    example: adaptive
  required: false
  style: form
  explode: false

connectionType:
  name: connectionType
  in: query
  description: Client connection type for data optimization
  schema:
    type: string
    enum:
      - wifi
      - cellular
      - unknown
      - slow
    default: unknown
    example: wifi
  required: false
  style: form
  explode: false

timeRange:
  name: timeRange
  in: query
  description: Time range for mobile-optimized data queries
  schema:
    type: string
    enum:
      - day
      - week
      - month
      - quarter
    default: month
    example: month
  required: false
  style: form
  explode: false 