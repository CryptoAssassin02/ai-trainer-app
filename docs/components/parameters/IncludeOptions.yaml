# Common Include Options - Multiple boolean flags for optional data inclusion

includeMilestones:
  name: includeMilestones
  in: query
  description: Include milestone tracking data and achievement status
  schema:
    type: boolean
    default: false
    example: true
  required: false
  style: form
  explode: false

includeAnalytics:
  name: includeAnalytics
  in: query
  description: Include calculated analytics, trends, and insights
  schema:
    type: boolean
    default: false
    example: true
  required: false
  style: form
  explode: false

includeProgress:
  name: includeProgress
  in: query
  description: Include detailed progress calculations and summaries
  schema:
    type: boolean
    default: true
    example: true
  required: false
  style: form
  explode: false 