description: Goal operation rate limit exceeded
headers:
  X-Request-ID:
    $ref: '../../headers/X-Request-ID.yaml'
  X-RateLimit-Limit:
    $ref: '../../headers/X-RateLimit-Limit.yaml'
  X-RateLimit-Remaining:
    $ref: '../../headers/X-RateLimit-Remaining.yaml'
  X-RateLimit-Reset:
    $ref: '../../headers/X-RateLimit-Reset.yaml'
  Retry-After:
    description: Number of seconds to wait before making another request
    schema:
      type: integer
      example: 1800
content:
  application/json:
    schema:
      $ref: '../../schemas/goals/GoalRateLimitError.yaml'
    examples:
      goal_creation_limit:
        summary: Goal creation rate limit exceeded
        value:
          status: error
          message: "Goal operation rate limit exceeded"
          details: "Goal creation limit of 10 per day has been exceeded"
          errorCode: "GOAL_RATE_LIMIT_EXCEEDED"
          rateLimit:
            operation: "goal-creation"
            limit: 10
            window: "24 hours"
            remaining: 0
            resetTime: "2024-01-21T19:00:00Z"
            retryAfter: 1800
          timestamp: "2024-01-20T19:30:00Z"
          requestId: "req_goals_001"
          suggestions:
            - "Wait until tomorrow to create more goals"
            - "Update existing goals instead of creating new ones"
      goal_prediction_limit:
        summary: AI prediction rate limit exceeded
        value:
          status: error
          message: "Goal operation rate limit exceeded"
          details: "AI prediction limit of 50 per hour has been exceeded"
          errorCode: "GOAL_RATE_LIMIT_EXCEEDED"
          rateLimit:
            operation: "ai-prediction"
            limit: 50
            window: "1 hour"
            remaining: 0
            resetTime: "2024-01-20T20:30:00Z"
            retryAfter: 1800
          timestamp: "2024-01-20T19:30:00Z"
          requestId: "req_goals_002"
          suggestions:
            - "Use cached predictions from recent requests"
            - "Wait for the rate limit to reset" 