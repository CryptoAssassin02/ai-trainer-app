description: Goal not found or not accessible
headers:
  X-Request-ID:
    $ref: '../../headers/X-Request-ID.yaml'
content:
  application/json:
    schema:
      $ref: '../../schemas/goals/GoalNotFoundError.yaml'
    examples:
      goal_not_found:
        summary: Specific goal ID not found
        value:
          status: error
          message: "Goal not found"
          details: "The requested goal does not exist or you don't have permission to access it"
          resourceType: "goal"
          resourceId: "550e8400-e29b-41d4-a716-nonexistent"
          timestamp: "2024-01-20T19:00:00Z"
          requestId: "req_goals_001"
          suggestions:
            - "Verify the goal ID is correct"
            - "Use GET /goals to list your available goals"
            - "Check that you have permission to access this goal"
      no_goals_for_user:
        summary: No goals found for the authenticated user
        value:
          status: error
          message: "No goals found"
          details: "No goals have been created for this user account"
          resourceType: "goals"
          userId: "user_123"
          timestamp: "2024-01-20T19:05:00Z"
          requestId: "req_goals_002"
          suggestions:
            - "Create your first goal with POST /goals"
            - "Import goals from another fitness app"
            - "Try the goal wizard to get started"
      filtered_goals_not_found:
        summary: No goals match the specified filters
        value:
          status: error
          message: "No goals found matching filters"
          details: "No goals were found matching the specified filter criteria"
          resourceType: "filtered-goals"
          appliedFilters:
            status: "completed"
            type: "endurance"
            timeframe: "1year"
          timestamp: "2024-01-20T19:10:00Z"
          requestId: "req_goals_003"
          suggestions:
            - "Remove some filters to see more results"
            - "Try different filter combinations"
            - "Check if you have goals of the specified type"
      goal_deleted:
        summary: Goal was previously deleted
        value:
          status: error
          message: "Goal not found"
          details: "This goal was deleted and is no longer accessible"
          resourceType: "goal"
          resourceId: "deleted-goal-123"
          deletedAt: "2024-01-15T10:00:00Z"
          timestamp: "2024-01-20T19:15:00Z"
          requestId: "req_goals_004"
          suggestions:
            - "Create a new goal with similar parameters"
            - "Check your goal history for archived goals"
            - "Contact support if this was deleted in error" 