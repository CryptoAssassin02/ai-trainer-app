description: Rate limit exceeded for workout log operations
content:
  application/json:
    schema:
      $ref: '../../schemas/workoutLogs/WorkoutLogRateLimitError.yaml'
    example:
      status: "error"
      message: "Rate limit exceeded for workout log operations"
      retryAfter: 3600
      limit: 20
      window: "1 hour"
      timestamp: "2025-01-15T18:30:00Z"
headers:
  Retry-After:
    description: Number of seconds to wait before retrying
    schema:
      type: integer
    example: 3600
  X-RateLimit-Limit:
    description: Maximum number of requests allowed in the time window
    schema:
      type: integer
    example: 20
  X-RateLimit-Remaining:
    description: Number of requests remaining in the current window
    schema:
      type: integer
    example: 0
  X-RateLimit-Reset:
    description: Time when the rate limit will reset (Unix timestamp)
    schema:
      type: integer
    example: 1642274400 