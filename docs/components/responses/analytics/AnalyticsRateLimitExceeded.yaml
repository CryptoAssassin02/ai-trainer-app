description: Analytics API rate limit exceeded
headers:
  X-Request-ID:
    $ref: '../../headers/X-Request-ID.yaml'
  X-RateLimit-Limit:
    $ref: '../../headers/X-RateLimit-Limit.yaml'
  X-RateLimit-Remaining:
    $ref: '../../headers/X-RateLimit-Remaining.yaml'
  X-RateLimit-Reset:
    $ref: '../../headers/X-RateLimit-Reset.yaml'
  Retry-After:
    description: Number of seconds to wait before making another request
    schema:
      type: integer
      example: 900
content:
  application/json:
    schema:
      $ref: '../../schemas/analytics/AnalyticsRateLimitError.yaml'
    examples:
      analytics_rate_limit:
        summary: Standard analytics rate limit exceeded
        value:
          status: error
          message: "Rate limit exceeded"
          details:
            limitType: "analytics_requests"
            limit: 50
            windowMinutes: 15
            remaining: 0
            resetTime: "2024-01-15T19:45:00Z"
            retryAfterSeconds: 900
            suggestions:
              - "Wait 15 minutes before making another analytics request"
              - "Use cached data if available"
              - "Consider upgrading to higher rate limits"
          timestamp: "2024-01-15T19:30:00Z"
          requestId: "req_123462"
      ai_analytics_rate_limit:
        summary: AI analytics rate limit exceeded
        value:
          status: error
          message: "AI analytics rate limit exceeded"
          details:
            limitType: "ai_analytics_requests"
            limit: 10
            windowMinutes: 60
            remaining: 0
            resetTime: "2024-01-15T20:30:00Z"
            retryAfterSeconds: 3600
            costReason: "AI processing requires significant computational resources"
            suggestions:
              - "Wait 1 hour before making another AI analytics request"
              - "Use standard analytics endpoints for basic insights"
              - "Cache AI results for repeated access"
          timestamp: "2024-01-15T19:30:00Z"
          requestId: "req_123463"
      refresh_rate_limit:
        summary: Analytics refresh rate limit exceeded
        value:
          status: error
          message: "Analytics refresh rate limit exceeded"
          details:
            limitType: "analytics_refresh"
            limit: 5
            windowMinutes: 60
            remaining: 0
            resetTime: "2024-01-15T20:30:00Z"
            retryAfterSeconds: 3600
            lastRefresh: "2024-01-15T18:45:00Z"
            suggestions:
              - "Analytics data is refreshed automatically every hour"
              - "Use existing cached analytics data"
              - "Manual refresh is limited to prevent system overload"
          timestamp: "2024-01-15T19:30:00Z"
          requestId: "req_123464" 