description: Analytics data not found
headers:
  X-Request-ID:
    $ref: '../../headers/X-Request-ID.yaml'
content:
  application/json:
    schema:
      $ref: '../../schemas/analytics/AnalyticsNotFoundError.yaml'
    examples:
      no_data_available:
        summary: No analytics data available for the specified timeframe
        value:
          status: error
          message: "No analytics data found"
          details:
            reason: "insufficient_data"
            description: "No workout or progress data available for the specified timeframe"
            timeframe: "6 months"
            dataPointsFound: 0
            minimumRequired: 5
            suggestions:
              - "Try a different timeframe with more recent data"
              - "Check if workout logging is enabled"
              - "Verify data sync is working properly"
          timestamp: "2024-01-15T19:15:00Z"
          requestId: "req_123459"
      user_data_not_found:
        summary: User analytics data not found or not accessible
        value:
          status: error
          message: "Analytics data not found"
          details:
            reason: "user_data_not_found"
            description: "User analytics data not found or not accessible"
            userId: "user_123"
            suggestions:
              - "Verify user ID is correct"
              - "Check if user has any recorded data"
              - "Ensure proper authentication"
          timestamp: "2024-01-15T19:20:00Z"
          requestId: "req_123460"
      analytics_not_generated:
        summary: Analytics have not been generated yet
        value:
          status: error
          message: "Analytics not available"
          details:
            reason: "analytics_not_generated"
            description: "Analytics have not been generated for this user yet"
            lastRefresh: null
            estimatedGenerationTime: "2-5 minutes"
            suggestions:
              - "Wait for initial analytics generation"
              - "Trigger analytics refresh if needed"
