description: Basic API health check successful
headers:
  X-Request-ID:
    $ref: '../../headers/X-Request-ID.yaml'
  X-Response-Time:
    schema:
      type: string
      pattern: '^\d+ms$'
    description: Time taken to process the health check request
    example: "8ms"

content:
  application/json:
    schema:
      $ref: '../../schemas/healthSystem/BasicHealthResponse.yaml'
    
    examples:
      production_api:
        summary: Production API health status
        description: API is healthy and running in production environment
        value:
          status: "ok"
          info:
            version: "1.0.0"
            environment: "production"
            timestamp: "2024-01-15T10:30:45.123Z"
      
      development_api:
        summary: Development API health status
        description: API is healthy and running in development environment
        value:
          status: "ok"
          info:
            version: "1.0.0-beta.3"
            environment: "development"
            timestamp: "2024-01-15T10:30:45.123Z"
      
      staging_api:
        summary: Staging API health status
        description: API is healthy and running in staging environment
        value:
          status: "ok"
          info:
            version: "1.0.0-rc.1"
            environment: "staging"
            timestamp: "2024-01-15T10:30:45.123Z" 