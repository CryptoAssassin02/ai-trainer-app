description: Database connectivity health check failed
headers:
  X-Request-ID:
    $ref: '../../headers/X-Request-ID.yaml'
  X-Response-Time:
    schema:
      type: string
      pattern: '^\d+ms$'
    description: Time taken to process the failed database health check request
    example: "5000ms"

content:
  application/json:
    schema:
      $ref: '../../schemas/healthSystem/DatabaseConnectionError.yaml'
    
    examples:
      connection_timeout:
        summary: Database connection timeout
        description: Database connection timed out during health check
        value:
          status: "error"
          message: "Database connection failed"
          error: "Connection timeout after 5000ms"
          timestamp: "2024-01-15T10:30:45.123Z"
          details:
            component: "supabase"
            errorType: "connection-timeout"
            connectionAttempted: true
            fallbackUsed: false
            retryable: true
      
      authentication_failed:
        summary: Database authentication failure
        description: Database authentication failed during health check
        value:
          status: "error"
          message: "Database connection failed"
          error: "Authentication failed: Invalid credentials"
          timestamp: "2024-01-15T10:30:45.123Z"
          details:
            component: "supabase"
            errorType: "authentication-failed"
            connectionAttempted: true
            fallbackUsed: false
            retryable: false
      
      network_error:
        summary: Network connectivity issue
        description: Network error prevented database connection
        value:
          status: "error"
          message: "Database connection failed"
          error: "Network unreachable: ENOTFOUND db.example.supabase.co"
          timestamp: "2024-01-15T10:30:45.123Z"
          details:
            component: "supabase"
            errorType: "network-error"
            connectionAttempted: true
            fallbackUsed: true
            retryable: true
      
      pool_exhausted:
        summary: Connection pool exhaustion
        description: Database connection pool is exhausted
        value:
          status: "error"
          message: "Database connection failed"
          error: "Connection pool exhausted: All connections in use"
          timestamp: "2024-01-15T10:30:45.123Z"
          details:
            component: "connection-pool"
            errorType: "pool-exhausted"
            connectionAttempted: false
            fallbackUsed: false
            retryable: true 