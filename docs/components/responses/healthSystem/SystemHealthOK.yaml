description: Comprehensive system health check successful
headers:
  X-Request-ID:
    $ref: '../../headers/X-Request-ID.yaml'
  X-Response-Time:
    schema:
      type: string
      pattern: '^\d+ms$'
    description: Time taken to process the health check request
    example: "12ms"

content:
  application/json:
    schema:
      $ref: '../../schemas/healthSystem/SystemHealthResponse.yaml'
    
    examples:
      healthy_system:
        summary: Healthy system with normal metrics
        description: System is running normally with good resource utilization
        value:
          status: "ok"
          timestamp: "2024-01-15T10:30:45.123Z"
          environment: "production"
          server:
            uptime:
              days: 5
              hours: 12
              minutes: 34
              seconds: 28
            nodeVersion: "v18.17.0"
            memoryUsage:
              rss: 125829120
              heapTotal: 83886080
              heapUsed: 56234896
              external: 2048576
              arrayBuffers: 1024000
            cpuLoad: [0.15, 0.23, 0.18]
            platform: "linux"
            arch: "x64"
      
      high_load_system:
        summary: System under high load but still healthy
        description: System experiencing higher than normal load but still operational
        value:
          status: "ok"
          timestamp: "2024-01-15T10:30:45.123Z"
          environment: "production"
          server:
            uptime:
              days: 0
              hours: 2
              minutes: 15
              seconds: 42
            nodeVersion: "v18.17.0"
            memoryUsage:
              rss: 425829120
              heapTotal: 183886080
              heapUsed: 156234896
              external: 12048576
              arrayBuffers: 5024000
            cpuLoad: [2.35, 2.78, 1.92]
            platform: "linux"
            arch: "x64" 