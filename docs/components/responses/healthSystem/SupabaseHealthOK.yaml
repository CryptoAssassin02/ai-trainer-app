description: Database connectivity health check successful
headers:
  X-Request-ID:
    $ref: '../../headers/X-Request-ID.yaml'
  X-Response-Time:
    schema:
      type: string
      pattern: '^\d+ms$'
    description: Time taken to process the health check request
    example: "45ms"

content:
  application/json:
    schema:
      $ref: '../../schemas/healthSystem/SupabaseHealthResponse.yaml'
    
    examples:
      fast_connection:
        summary: Fast database connection
        description: Database is responding quickly with optimal performance
        value:
          status: "ok"
          info:
            connected: true
            responseTime: "28ms"
            timestamp: "2024-01-15T10:30:45.123Z"
      
      normal_connection:
        summary: Normal database connection
        description: Database is responding within acceptable performance range
        value:
          status: "ok"
          info:
            connected: true
            responseTime: "156ms"
            timestamp: "2024-01-15T10:30:45.123Z"
      
      slower_connection:
        summary: Slower but acceptable database connection
        description: Database is responding more slowly but still within operational limits
        value:
          status: "ok"
          info:
            connected: true
            responseTime: "834ms"
            timestamp: "2024-01-15T10:30:45.123Z" 