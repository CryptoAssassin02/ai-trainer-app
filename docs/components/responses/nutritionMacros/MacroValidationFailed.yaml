description: Macro request validation failed
headers:
  X-Request-ID:
    $ref: '../../headers/X-Request-ID.yaml'
content:
  application/json:
    schema:
      $ref: '../../schemas/nutritionMacros/MacroValidationError.yaml'
    examples:
      weight_too_low:
        summary: Weight below minimum
        description: Weight value is below minimum requirement
        value:
          status: "error"
          error: "MACRO_VALIDATION_ERROR"
          message: "Weight value is below minimum requirement"
          details:
            field: "weight"
            value: 15
            constraint: "must be between 20 and 300"
            min: 20
            max: 300
          timestamp: "2024-01-15T10:30:00Z"
      
      invalid_height:
        summary: Invalid height format
        description: Height format validation failed
        value:
          status: "error"
          error: "MACRO_VALIDATION_ERROR"
          message: "Invalid height format for selected units"
          details:
            field: "height"
            value: "invalid"
            constraint: "must be number for metric or object with feet/inches for imperial"
          timestamp: "2024-01-15T10:30:00Z" 