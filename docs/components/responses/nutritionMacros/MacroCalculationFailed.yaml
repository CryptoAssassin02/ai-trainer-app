description: Macro calculation process failed
headers:
  X-Request-ID:
    $ref: '../../headers/X-Request-ID.yaml'
content:
  application/json:
    schema:
      $ref: '../../schemas/nutritionMacros/MacroCalculationError.yaml'
    examples:
      bmr_calculation_failed:
        summary: BMR calculation failed
        description: Unable to calculate BMR with provided data
        value:
          status: "error"
          error: "MACRO_CALCULATION_ERROR"
          message: "Unable to calculate BMR with provided data"
          details:
            step: "BMR_CALCULATION"
            reason: "User profile is incomplete"
            requirements: ["valid_height", "valid_weight", "valid_age"]
          timestamp: "2024-01-15T10:30:00Z"
      
      tdee_calculation_failed:
        summary: TDEE calculation failed
        description: Unable to calculate TDEE from BMR and activity level
        value:
          status: "error"
          error: "MACRO_CALCULATION_ERROR"
          message: "Failed to calculate TDEE from BMR and activity level"
          details:
            step: "TDEE_CALCULATION"
            reason: "Invalid activity level multiplier"
            requirements: ["valid_bmr", "valid_activity_level"]
          timestamp: "2024-01-15T10:30:00Z" 