description: Nutrition request validation failed
headers:
  X-Request-ID:
    $ref: '../../headers/X-Request-ID.yaml'
content:
  application/json:
    schema:
      $ref: '../../schemas/nutritionMacros/NutritionValidationError.yaml'
    examples:
      invalid_activity_level:
        summary: Invalid activity level
        description: Activity level validation failed
        value:
          status: "error"
          error: "NUTRITION_VALIDATION_ERROR"
          message: "Invalid activity level provided"
          details:
            field: "activityLevel"
            value: "super_active"
            constraint: "must be one of: sedentary, light, moderate, active, very_active"
            allowedValues: ["sedentary", "light", "moderate", "active", "very_active"]
          timestamp: "2024-01-15T10:30:00Z"
      
      invalid_goals:
        summary: Invalid goals array
        description: Goals array validation failed
        value:
          status: "error"
          error: "NUTRITION_VALIDATION_ERROR"
          message: "Invalid fitness goals provided"
          details:
            field: "goals"
            value: ["invalid_goal", "another_invalid"]
            constraint: "must contain valid fitness goals"
            allowedValues: ["weight_loss", "muscle_gain", "maintenance", "performance", "general_health", "endurance"]
          timestamp: "2024-01-15T10:30:00Z" 