description: Data transfer request validation failed
headers:
  X-Request-ID:
    $ref: '../../headers/X-Request-ID.yaml'
content:
  application/json:
    schema:
      $ref: '../../schemas/dataTransfer/DataTransferValidationError.yaml'
    examples:
      missingFormat:
        summary: Missing export format
        value:
          status: error
          message: "Export format is required."
          errorCode: "VALIDATION_ERROR"
          errors:
            - field: "format"
              message: "Export format is required"
      invalidDataTypes:
        summary: Invalid data types specified
        value:
          status: error
          message: "Invalid data types: invalid_type"
          errorCode: "VALIDATION_ERROR"
          errors:
            - field: "dataTypes"
              message: "Data types must be one of: profiles, workouts, workout_logs"
      emptyDataTypes:
        summary: Empty data types array
        value:
          status: error
          message: "At least one data type must be specified for export."
          errorCode: "VALIDATION_ERROR"
          errors:
            - field: "dataTypes"
              message: "At least one data type must be specified"
      invalidFormat:
        summary: Unsupported export format
        value:
          status: error
          message: "Unsupported export format: xml"
          errorCode: "VALIDATION_ERROR"
          errors:
            - field: "format"
              message: "Format must be one of: json, csv, xlsx, pdf" 