description: Data import completed successfully
headers:
  X-Request-ID:
    $ref: '../../headers/X-Request-ID.yaml'
content:
  application/json:
    schema:
      $ref: '../../schemas/dataTransfer/DataImportResponse.yaml'
    examples:
      completeSuccess:
        summary: All data imported successfully
        value:
          status: success
          message: "Data imported successfully."
          data:
            total: 25
            successful: 25
            failed: 0
            errors: []
      partialSuccess:
        summary: Some validation failures occurred
        value:
          status: success
          message: "Data imported with 3 validation failures."
          data:
            total: 25
            successful: 22
            failed: 3
            errors:
              - "Validation error for profiles: Age must be between 13 and 120 (age: required)"
              - "Validation error for workouts: Name is required (name: required)"
              - "Error processing workout_logs row: Invalid date format"
      csvImportSuccess:
        summary: Successful CSV import
        value:
          status: success
          message: "Data imported successfully."
          data:
            total: 100
            successful: 95
            failed: 5
            errors:
              - "Validation error for profiles: Invalid email format"
              - "Database error for workout_logs: Foreign key constraint violation" 