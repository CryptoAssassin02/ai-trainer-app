description: Data export completed successfully
headers:
  Content-Disposition:
    description: Attachment header with filename for download
    schema:
      type: string
      example: 'attachment; filename="trAIner-export-1705320600000.json"'
  X-Request-ID:
    $ref: '../../headers/X-Request-ID.yaml'
content:
  application/json:
    description: JSON format export response
    schema:
      $ref: '../../schemas/dataTransfer/DataExportJSONResponse.yaml'
    examples:
      profilesExport:
        summary: Profile data export
        value:
          exportDate: "2024-01-15T10:30:00.000Z"
          userId: "123e4567-e89b-12d3-a456-426614174000"
          data:
            profiles:
              - user_id: "123e4567-e89b-12d3-a456-426614174000"
                name: "John Doe"
                age: 30
                height: 180
                weight: 75
                experience_level: "intermediate"
  text/csv:
    description: CSV format export response (streaming)
    schema:
      type: string
      format: binary
      example: |
        data_type,user_id,name,age,height,weight,experience_level
        profiles,123e4567-e89b-12d3-a456-426614174000,John Doe,30,180,75,intermediate
  application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
    description: Excel XLSX format export response (streaming)
    schema:
      type: string
      format: binary
  application/pdf:
    description: PDF format export response (streaming)
    schema:
      type: string
      format: binary 