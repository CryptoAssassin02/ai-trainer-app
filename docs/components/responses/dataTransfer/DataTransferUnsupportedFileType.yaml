description: Uploaded file type is not supported for import
headers:
  X-Request-ID:
    $ref: '../../headers/X-Request-ID.yaml'
content:
  application/json:
    description: File type error details
    schema:
      $ref: '../../schemas/dataTransfer/DataTransferFileError.yaml'
    examples:
      textFile:
        summary: Plain text file not supported
        value:
          status: error
          message: "Unsupported file type: text/plain (data.txt)"
          errorCode: "UNSUPPORTED_FILE_TYPE"
          details:
            fileName: "data.txt"
            mimeType: "text/plain"
      wordDocument:
        summary: Word document not supported
        value:
          status: error
          message: "Unsupported file type: application/msword (workout_plan.doc)"
          errorCode: "UNSUPPORTED_FILE_TYPE"
          details:
            fileName: "workout_plan.doc"
            mimeType: "application/msword"
      pdfFile:
        summary: PDF file not supported for import
        value:
          status: error
          message: "Unsupported file type: application/pdf (export.pdf)"
          errorCode: "UNSUPPORTED_FILE_TYPE"
          details:
            fileName: "export.pdf"
            mimeType: "application/pdf"
      noFileExtension:
        summary: File without extension rejected
        value:
          status: error
          message: "Unsupported file type: application/octet-stream (datafile)"
          errorCode: "UNSUPPORTED_FILE_TYPE"
          details:
            fileName: "datafile"
            mimeType: "application/octet-stream" 