description: Mobile-optimized goal progress successfully retrieved
headers:
  X-Request-ID:
    $ref: '../../headers/X-Request-ID.yaml'
  X-RateLimit-Limit:
    $ref: '../../headers/X-RateLimit-Limit.yaml'
  X-RateLimit-Remaining:
    $ref: '../../headers/X-RateLimit-Remaining.yaml'
  X-RateLimit-Reset:
    $ref: '../../headers/X-RateLimit-Reset.yaml'
  Cache-Control:
    description: Mobile goal progress caching
    schema:
      type: string
      example: "max-age=900, must-revalidate"
  X-Payload-Size:
    description: Payload size optimized for mobile
    schema:
      type: integer
      example: 18500
