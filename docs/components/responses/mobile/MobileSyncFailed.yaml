description: Mobile sync operation failed with detailed recovery guidance
headers:
  X-Request-ID:
    $ref: '../../headers/X-Request-ID.yaml'
  X-RateLimit-Limit:
    $ref: '../../headers/X-RateLimit-Limit.yaml'
  X-RateLimit-Remaining:
    $ref: '../../headers/X-RateLimit-Remaining.yaml'
  X-RateLimit-Reset:
    $ref: '../../headers/X-RateLimit-Reset.yaml'
  Retry-After:
    description: Recommended retry delay in seconds
    schema:
      type: integer
      example: 120
  X-Sync-Version:
    description: Server sync version for conflict resolution
    schema:
      type: string
      example: "v2024.01.15.2100"
  X-Conflict-Resolution:
    description: Conflict resolution strategy required
    schema:
      type: string
      example: "manual_review"
