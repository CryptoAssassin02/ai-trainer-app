description: Mobile-optimized peer comparison analytics successfully retrieved
headers:
  X-Request-ID:
    $ref: '../../headers/X-Request-ID.yaml'
  X-RateLimit-Limit:
    $ref: '../../headers/X-RateLimit-Limit.yaml'
  X-RateLimit-Remaining:
    $ref: '../../headers/X-RateLimit-Remaining.yaml'
  X-RateLimit-Reset:
    $ref: '../../headers/X-RateLimit-Reset.yaml'
  Cache-Control:
    description: Mobile peer comparison caching
    schema:
      type: string
      example: "max-age=1800, stale-while-revalidate=300"
  X-Privacy-Level:
    description: Privacy level applied to peer data
    schema:
      type: string
      example: "anonymized"
