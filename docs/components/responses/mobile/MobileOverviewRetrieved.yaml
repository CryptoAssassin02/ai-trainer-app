description: Mobile-optimized analytics overview successfully retrieved
headers:
  X-Request-ID:
    $ref: '../../headers/X-Request-ID.yaml'
  X-RateLimit-Limit:
    $ref: '../../headers/X-RateLimit-Limit.yaml'
  X-RateLimit-Remaining:
    $ref: '../../headers/X-RateLimit-Remaining.yaml'
  X-RateLimit-Reset:
    $ref: '../../headers/X-RateLimit-Reset.yaml'
  Cache-Control:
    description: Mobile-optimized caching strategy
    schema:
      type: string
      example: "max-age=600, must-revalidate"
  X-Payload-Size:
    description: Actual payload size in bytes
    schema:
      type: integer
      example: 42500
  X-Mobile-Optimized:
    description: Indicates mobile optimization applied
    schema:
      type: boolean
      example: true
content:
  application/json:
    schema:
      $ref: '../../schemas/mobile/MobileOverviewResponse.yaml'
    examples:
      optimized_overview:
        summary: Mobile-optimized analytics overview under 50KB limit
        value:
          status: success
          data:
            summary:
              workouts: 18
              weeklyAdherence: 0.85
              progressTrend: "positive"
              currentStreak: 12
              weeklyGoal: 4
              completed: 3
            charts:
              compressed: true
              dataPoints:
                weight: [78.5, 78.2, 77.9, 77.6, 77.3]
                workouts: [3, 4, 2, 4, 3]
                mood: [7.5, 8.0, 7.8, 8.2, 8.5]
              trends:
                weight: "decreasing"
                fitness: "improving"
                consistency: "stable"
            insights:
              - "Your consistency improved 15% this week"
              - "Weight loss is on track for your goal"
              - "Consider adding 1 more cardio session"
            quickStats:
              totalWorkouts: 156
              avgSatisfaction: 8.3
              bestWeek: "Week of Jan 8"
              improvement: "+12% vs last month"
            goals:
              primary:
                type: "weight_loss"
                progress: 0.65
                status: "on_track"
                daysLeft: 42
              secondary:
                type: "strength"
                progress: 0.43
                status: "slightly_behind"
                daysLeft: 98
          metadata:
            payloadSize: 42500
            optimizedForMobile: true
            compressionRatio: 0.68
            cacheUntil: "2024-01-15T21:10:00Z"
            dataFreshness: "5 minutes"
            networkOptimized: true
      minimal_data:
        summary: Mobile overview with minimal data for new users
        value:
          status: success
          data:
            summary:
              workouts: 3
              weeklyAdherence: 0.60
              progressTrend: "starting"
              currentStreak: 2
              weeklyGoal: 3
              completed: 2
            charts:
              compressed: true
              dataPoints:
                weight: [82.1, 81.9, 81.7]
                workouts: [1, 1, 1]
                mood: [7.0, 7.5, 8.0]
              trends:
                weight: "stable"
                fitness: "improving"
                consistency: "building"
            insights:
              - "Great start! Keep up the momentum"
              - "Try to maintain consistent workout schedule"
              - "Track your progress daily for better results"
            quickStats:
              totalWorkouts: 3
              avgSatisfaction: 7.5
              bestWeek: "This week"
              improvement: "New user"
            goals:
              primary:
                type: "weight_loss"
                progress: 0.05
                status: "just_started"
                daysLeft: 168
          metadata:
            payloadSize: 28400
            optimizedForMobile: true
            compressionRatio: 0.72
            cacheUntil: "2024-01-15T21:05:00Z"
            dataFreshness: "2 minutes"
            networkOptimized: true 