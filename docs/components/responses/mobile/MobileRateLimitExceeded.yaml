description: Mobile rate limit exceeded with mobile-specific guidance
headers:
  X-Request-ID:
    $ref: '../../headers/X-Request-ID.yaml'
  X-RateLimit-Limit:
    $ref: '../../headers/X-RateLimit-Limit.yaml'
  X-RateLimit-Remaining:
    $ref: '../../headers/X-RateLimit-Remaining.yaml'
  X-RateLimit-Reset:
    $ref: '../../headers/X-RateLimit-Reset.yaml'
  Retry-After:
    description: Seconds to wait before next request
    schema:
      type: integer
      example: 300
  X-Mobile-Quota-Type:
    description: Type of mobile quota that was exceeded
    schema:
      type: string
      example: "sync_operations"
  X-Premium-Available:
    description: Whether premium upgrade can increase limits
    schema:
      type: boolean
      example: true
content:
  application/json:
    schema:
      $ref: '../../schemas/mobile/MobileRateLimitError.yaml'
    examples:
      mobile_sync_rate_limit:
        summary: Mobile sync operations rate limit exceeded
        value:
          error:
            code: "MOBILE_SYNC_RATE_LIMIT_EXCEEDED"
            message: "Mobile sync operations rate limit exceeded"
            details:
              limit: 10
              window: "1 hour"
              remaining: 0
              resetTime: "2024-01-15T21:45:00Z"
              retryAfter: 2700
              quotaType: "sync_operations"
