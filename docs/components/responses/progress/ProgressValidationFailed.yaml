description: Progress data validation failed
headers:
  X-Request-ID:
    $ref: '../../headers/X-Request-ID.yaml'
content:
  application/json:
    schema:
      $ref: '../../schemas/progress/ProgressValidationError.yaml'
    examples:
      invalid_check_in_data:
        summary: Check-in data validation failures
        value:
          status: error
          message: "Progress data validation failed"
          errors:
            - field: "weight"
              code: "VALUE_OUT_OF_RANGE"
              message: "Weight must be between 30 and 300 kg"
              value: 450.0
            - field: "bodyFatPercentage"
              code: "VALUE_OUT_OF_RANGE"
              message: "Body fat percentage must be between 1 and 50"
              value: 65.0
            - field: "date"
              code: "FUTURE_DATE_NOT_ALLOWED"
              message: "Check-in date cannot be in the future"
              value: "2024-12-31"
            - field: "wellnessMetrics.mood"
              code: "VALUE_OUT_OF_RANGE"
              message: "Mood must be between 1 and 10"
              value: 15
          timestamp: "2024-01-15T19:00:00Z"
          requestId: "req_progress_001"
      invalid_date_range:
        summary: Invalid date range in metrics calculation
        value:
          status: error
          message: "Progress data validation failed"
          errors:
            - field: "startDate"
              code: "DATE_FORMAT_INVALID"
              message: "Start date must be in ISO 8601 format (YYYY-MM-DD)"
              value: "2024/01/01"
            - field: "endDate"
              code: "DATE_RANGE_INVALID"
              message: "End date must be after start date and not more than 1 year from start date"
              value: "2024-01-01"
            - field: "dateRange"
              code: "RANGE_TOO_LARGE"
              message: "Date range cannot exceed 365 days"
              value: "400 days"
          timestamp: "2024-01-15T19:05:00Z"
          requestId: "req_progress_002"
      missing_required_fields:
        summary: Required fields missing from check-in request
        value:
          status: error
          message: "Progress data validation failed"
          errors:
            - field: "date"
              code: "FIELD_REQUIRED"
              message: "Check-in date is required"
              value: null
            - field: "userId"
              code: "FIELD_REQUIRED"
              message: "User ID is required and must be valid"
              value: null
            - field: "measurements"
              code: "INVALID_MEASUREMENTS"
              message: "At least one measurement (weight, body fat, or body measurements) is required"
              value: {}
          timestamp: "2024-01-15T19:10:00Z"
          requestId: "req_progress_003"
      duplicate_check_in:
        summary: Duplicate check-in for the same date
        value:
          status: error
          message: "Progress data validation failed"
          errors:
            - field: "date"
              code: "DUPLICATE_CHECK_IN"
              message: "A check-in already exists for this date. Use update instead of create."
              value: "2024-01-15"
              existingCheckInId: "ci_789abc123"
          timestamp: "2024-01-15T19:15:00Z"
          requestId: "req_progress_004"
          suggestions:
            - "Use PUT /progress/check-ins/{checkInId} to update existing check-in"
            - "Choose a different date for the new check-in" 