description: Check-in successfully recorded
headers:
  X-Request-ID:
    $ref: '../../headers/X-Request-ID.yaml'
  X-RateLimit-Limit:
    $ref: '../../headers/X-RateLimit-Limit.yaml'
  X-RateLimit-Remaining:
    $ref: '../../headers/X-RateLimit-Remaining.yaml'
  X-RateLimit-Reset:
    $ref: '../../headers/X-RateLimit-Reset.yaml'
content:
  application/json:
    schema:
      $ref: '../../schemas/progress/CheckInResponse.yaml'
    examples:
      comprehensive_check_in:
        summary: Complete check-in with all measurements and wellness data
        value:
          status: success
          data:
            checkInId: "ci_789abc123"
            userId: "user_123"
            date: "2024-01-15"
            weight: 77.5
            bodyFatPercentage: 18.2
            measurements:
              waist: 85.5
              chest: 102.0
              arms: 35.8
              legs: 58.2
              hips: 95.0
              shoulders: 118.5
              neck: 38.0
            wellnessMetrics:
              mood: 8
              sleepQuality: 7
              energyLevel: 8
              stressLevel: 3
            notes: "Feeling strong and energetic after last week's workouts. Sleep has been consistent."
            createdAt: "2024-01-15T08:30:00Z"
            progressSummary:
              weightChange: -0.8
              bodyFatChange: -0.5
              overallTrend: "positive"
          metadata:
            dataQuality: 0.95
            completeness: "full"
            lastUpdated: "2024-01-15T08:30:00Z"
      minimal_check_in:
        summary: Basic check-in with only weight and wellness data
        value:
          status: success
          data:
            checkInId: "ci_456def789"
            userId: "user_456"
            date: "2024-01-15"
            weight: 68.3
            wellnessMetrics:
              mood: 7
              sleepQuality: 8
              energyLevel: 7
            notes: "Quick check-in before work"
            createdAt: "2024-01-15T07:00:00Z"
            progressSummary:
              weightChange: -0.2
              overallTrend: "stable"
          metadata:
            dataQuality: 0.78
            completeness: "partial"
            lastUpdated: "2024-01-15T07:00:00Z"
      first_check_in:
        summary: First-time user check-in establishing baseline
        value:
          status: success
          data:
            checkInId: "ci_123ghi456"
            userId: "user_789"
            date: "2024-01-15"
            weight: 82.0
            bodyFatPercentage: 22.5
            measurements:
              waist: 92.0
              chest: 98.5
            wellnessMetrics:
              mood: 6
              sleepQuality: 6
              energyLevel: 6
              stressLevel: 5
            notes: "Starting my fitness journey today! Excited to track progress."
            createdAt: "2024-01-15T10:00:00Z"
            progressSummary:
              baseline: true
              message: "Baseline established for future progress tracking"
          metadata:
            dataQuality: 0.88
            completeness: "baseline"
            isFirstCheckIn: true
            lastUpdated: "2024-01-15T10:00:00Z" 