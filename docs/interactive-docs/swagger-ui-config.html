<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>trAIner API Documentation</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.11.0/swagger-ui.css">
    <style>
        /* Custom styling for trAIner brand */
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #0a0a0a;
        }
        
        .topbar {
            background-color: #1a1a1a !important;
            border-bottom: 2px solid #3E9EFF;
        }
        
        .topbar-wrapper {
            padding: 12px 20px;
        }
        
        .topbar-wrapper img {
            content: none;
        }
        
        .topbar-wrapper:before {
            content: "trAIner API";
            color: #F5F5F5;
            font-size: 24px;
            font-weight: bold;
        }
        
        .topbar-wrapper:after {
            content: " v1.0";
            color: #3E9EFF;
            font-size: 16px;
            margin-left: 8px;
        }
        
        .swagger-ui .info {
            margin: 30px 0;
        }
        
        .swagger-ui .info .title {
            color: #F5F5F5;
        }
        
        .swagger-ui .info .description {
            color: #B0B0B0;
        }
        
        .swagger-ui .scheme-container {
            background: #1a1a1a;
            box-shadow: none;
            border: 1px solid #2a2a2a;
            border-radius: 4px;
            padding: 15px;
        }
        
        .swagger-ui .btn.authorize {
            background-color: #3E9EFF;
            color: white;
            border: none;
        }
        
        .swagger-ui .btn.authorize:hover {
            background-color: #2E8EEF;
        }
        
        .swagger-ui .opblock.opblock-post {
            border-color: #3E9EFF;
            background: rgba(62, 158, 255, 0.05);
        }
        
        .swagger-ui .opblock.opblock-get {
            border-color: #61affe;
            background: rgba(97, 175, 254, 0.05);
        }
        
        .swagger-ui .opblock.opblock-put {
            border-color: #fca130;
            background: rgba(252, 161, 48, 0.05);
        }
        
        .swagger-ui .opblock.opblock-delete {
            border-color: #f93e3e;
            background: rgba(249, 62, 62, 0.05);
        }
        
        .swagger-ui select,
        .swagger-ui input[type=text],
        .swagger-ui input[type=password],
        .swagger-ui textarea {
            background: #1a1a1a;
            color: #F5F5F5;
            border: 1px solid #3a3a3a;
        }
        
        .swagger-ui .model-container {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 4px;
        }
        
        /* Dark theme for code blocks */
        .swagger-ui .highlight-code {
            background: #1a1a1a !important;
        }
        
        .swagger-ui pre {
            background: #1a1a1a;
            color: #F5F5F5;
            border: 1px solid #2a2a2a;
        }
        
        /* Rate limit badge styling */
        .rate-limit-badge {
            display: inline-block;
            background-color: #ff6b6b;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-left: 10px;
        }
        
        /* Loading screen */
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        
        .loader {
            border: 4px solid #1a1a1a;
            border-top: 4px solid #3E9EFF;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="loader"></div>
    </div>
    <div id="swagger-ui"></div>
    
    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.11.0/swagger-ui-bundle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.11.0/swagger-ui-standalone-preset.js"></script>
    <script>
        window.onload = function() {
            // Hide loading screen
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
            }, 500);
            
            // Initialize Swagger UI
            window.ui = SwaggerUIBundle({
                url: "../openapi.yaml",
                dom_id: '#swagger-ui',
                deepLinking: true,
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset
                ],
                plugins: [
                    SwaggerUIBundle.plugins.DownloadUrl
                ],
                layout: "StandaloneLayout",
                
                // Custom configuration
                docExpansion: "none",
                filter: true,
                showExtensions: true,
                showCommonExtensions: true,
                tryItOutEnabled: true,
                
                // Request interceptor for adding custom headers
                requestInterceptor: (request) => {
                    // Add custom headers if needed
                    request.headers['X-API-Client'] = 'SwaggerUI';
                    request.headers['X-Request-ID'] = generateRequestId();
                    
                    // Log requests for debugging
                    console.log('API Request:', {
                        url: request.url,
                        method: request.method,
                        headers: request.headers
                    });
                    
                    return request;
                },
                
                // Response interceptor for handling responses
                responseInterceptor: (response) => {
                    // Log responses for debugging
                    console.log('API Response:', {
                        url: response.url,
                        status: response.status,
                        headers: response.headers
                    });
                    
                    // Check for deprecation headers
                    if (response.headers['x-api-deprecated'] === 'true') {
                        console.warn('⚠️ This endpoint is deprecated. See:', response.headers['x-api-sunset']);
                    }
                    
                    // Check rate limit headers
                    const remaining = response.headers['x-ratelimit-remaining'];
                    const limit = response.headers['x-ratelimit-limit'];
                    if (remaining && limit) {
                        console.info(`Rate Limit: ${remaining}/${limit} requests remaining`);
                    }
                    
                    return response;
                },
                
                // Custom plugin to add rate limit badges
                wrapComponents: {
                    OperationSummary: (Original, { React }) => (props) => {
                        const { getComponent } = props;
                        const operation = props.operation;
                        
                        // Check for rate limit in operation extensions
                        const rateLimit = operation.get('x-rate-limit');
                        
                        return React.createElement('div', { style: { display: 'flex', alignItems: 'center' } },
                            React.createElement(Original, props),
                            rateLimit && React.createElement('span', {
                                className: 'rate-limit-badge',
                                title: 'Rate limit applies to this endpoint'
                            }, rateLimit)
                        );
                    }
                },
                
                // OAuth2 redirect URL (if using OAuth2)
                oauth2RedirectUrl: window.location.origin + '/api-docs/oauth2-redirect.html',
                
                // Validation
                validatorUrl: null,
                
                // UI customization
                defaultModelsExpandDepth: 1,
                defaultModelExpandDepth: 1,
                displayRequestDuration: true,
                
                // Syntax highlighting theme
                syntaxHighlight: {
                    activate: true,
                    theme: "monokai"
                }
            });
            
            // Function to generate request ID
            function generateRequestId() {
                return 'req_' + Math.random().toString(36).substring(2, 15);
            }
            
            // Add keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                // Ctrl/Cmd + K to focus search
                if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                    e.preventDefault();
                    const searchInput = document.querySelector('.operation-filter-input');
                    if (searchInput) searchInput.focus();
                }
                
                // Ctrl/Cmd + E to expand all
                if ((e.ctrlKey || e.metaKey) && e.key === 'e') {
                    e.preventDefault();
                    const expandButtons = document.querySelectorAll('.expand-methods button');
                    expandButtons.forEach(btn => {
                        if (btn.textContent.includes('Expand')) {
                            btn.click();
                        }
                    });
                }
            });
            
            // Add custom toolbar
            const toolbar = document.createElement('div');
            toolbar.style.cssText = 'position: fixed; bottom: 20px; right: 20px; z-index: 1000;';
            toolbar.innerHTML = `
                <div style="background: #1a1a1a; border: 1px solid #3E9EFF; border-radius: 8px; padding: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.3);">
                    <button onclick="downloadSpec()" style="background: #3E9EFF; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; margin-right: 10px;">
                        Download OpenAPI Spec
                    </button>
                    <button onclick="toggleDarkMode()" style="background: #3E9EFF; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer;">
                        Toggle Theme
                    </button>
                </div>
            `;
            document.body.appendChild(toolbar);
        };
        
        // Download OpenAPI spec
        function downloadSpec() {
            window.open('../openapi.yaml', '_blank');
        }
        
        // Toggle dark mode (placeholder)
        function toggleDarkMode() {
            alert('Dark mode is the default theme for trAIner API documentation');
        }
    </script>
</body>
</html>
