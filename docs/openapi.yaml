# OpenAPI 3.1.0 Specification for trAIner API
# This document follows the official OpenAPI Specification v3.1.0
# Reference: https://spec.openapis.org/oas/v3.1.0

# 1. OpenAPI Version Declaration (MANDATORY)
openapi: 3.1.0

# 2. Info Object (MANDATORY)
info:
  # Required fields
  title: trAIner API
  version: 1.0.0
  
  # Optional but recommended fields
  description: |
    The trAIner API provides comprehensive endpoints for AI-powered fitness tracking and personalized workout planning. 
    
    ## Overview
    This API enables:
    - User authentication and profile management via Supabase
    - AI-driven workout plan generation and customization
    - Progress tracking and analytics with AI insights
    - Nutrition logging and macro calculations
    - Data export/import functionality
    - Real-time health monitoring
    
    ## Authentication
    All protected endpoints require JWT authentication via Supabase Auth.
    
    ## Rate Limiting
    API requests are rate-limited to ensure service quality:
    - Authentication endpoints: 10 requests/15 minutes
    - Workout generation: 10 requests/hour
    - Data export: 3 requests/hour
    - Standard operations: 1000 requests/hour
    
    ## Data Security
    - All data transmission uses HTTPS encryption
    - JWT tokens for secure session management
    - Input validation and SQL injection protection
    - Medical data handled with appropriate security measures
  
  # Contact information (to be updated before deployment)
  contact:
    name: trAIner API Support
    url: https://trainer.app/support
    email: support@trainer.app
  
  # Terms of service URL (to be created before deployment)
  termsOfService: https://trainer.app/terms

# 3. Servers Array (MANDATORY)
servers:
  - url: http://localhost:8000/v1
    description: Local development server
  - url: https://dev-api.trainer.app/v1
    description: Development server
  - url: https://staging-api.trainer.app/v1
    description: Staging server
  - url: https://api.trainer.app/v1
    description: Production server

