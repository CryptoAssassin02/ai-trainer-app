          description: Primary workout validation error message
        errors:
          type: array
          items:
            type: object
            required: [field, message, type]
            properties:
              field:
                type: string
                description: Field that caused the error
              message:
                type: string
                description: Specific field error message
              type:
                type: string
                description: Validation error type
              value:
                description: Invalid value that was provided
          description: Detailed validation errors
      example:
        status: error
        message: Invalid workout generation parameters
        errors:
          - field: fitnessLevel
            message: Fitness level must be one of beginner, intermediate, advanced
            type: any.only
          - field: goals
            message: At least one goal must be provided
            type: array.min

    WorkoutGenerationError:
      type: object
      required: [status, message, errorType]
      properties:
        status:
          type: string
          enum: [error]
          description: Response status indicator
        message:
          type: string
          description: Workout generation error message
        errorType:
          type: string
          enum: [ai_generation_failed, research_unavailable, invalid_constraints, safety_violation, quota_exceeded, profile_incomplete]
          description: Specific error category
        details:
          type: object
          nullable: true
          properties:
            aiErrorMessage:
              type: string
              description: Error message from AI service
            researchErrors:
              type: array
              items:
                type: string
              description: Research-related errors
            conflictingConstraints:
              type: array
              items:
                type: string
              description: Conflicting user requirements
            safetyViolations:
              type: array
              items:
                type: string
              description: Safety concerns that prevented generation
            missingProfileData:
              type: array
              items:
                type: string
              description: Required profile fields that are missing
          description: Additional error context
        retryAfter:
          type: integer
          nullable: true
          description: Seconds to wait before retry (for quota errors)
        fallbackAvailable:
          type: boolean
          default: false
          description: Whether a fallback plan generation option exists
      example:
        status: error
        message: AI workout generation failed due to service unavailability
        errorType: ai_generation_failed
        details:
          aiErrorMessage: "OpenAI API temporarily unavailable"
        retryAfter: 300
        fallbackAvailable: true

