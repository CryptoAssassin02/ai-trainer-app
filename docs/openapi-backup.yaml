# Additional root-level extensions for API governance
x-api-governance:
  data-classification: public
  compliance:
    - GDPR
    - CCPA
    - HIPAA-partial
  sla:
    availability: 99.9
    response-time: 
      p50: 100ms
      p95: 500ms
      p99: 1000ms



# The components section will be expanded in Phase 2 with:
# - schemas (data models)
# - parameters (reusable parameters)  
# - responses (common responses)
# - examples (request/response examples)
