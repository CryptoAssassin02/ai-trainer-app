          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'

    TokenRefreshSuccess:
      description: Token refreshed successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TokenRefreshResponse'
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'

    SessionValidated:
      description: Session validated successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidateSessionResponse'

    UserProfileRetrieved:
      description: User profile retrieved successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserProfileResponse'

    EmailVerificationStatus:
      description: Email verification status retrieved
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EmailVerificationStatusResponse'

    EmailVerified:
      description: Email verified successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VerifyEmailSuccessResponse'

    GenericSuccess:
      description: Operation completed successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GenericSuccessResponse'

    # User Profiles Success Responses
    ProfileCreated:
      description: Profile created successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserProfileResponse'

    ProfileUpdated:
      description: Profile updated successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserProfileResponse'

    ProfileRetrieved:
      description: User profile retrieved successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserProfileResponse'

    ProfilePreferencesRetrieved:
      description: Profile preferences retrieved successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProfilePreferencesResponse'

    ProfilePreferencesUpdated:
      description: Profile preferences updated successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProfilePreferencesResponse'

    # Error Responses
    ValidationFailed:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'

    ProfileValidationFailed:
      description: Profile data validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProfileValidationError'

    UnitConversionFailed:
      description: Unit conversion failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnitConversionError'

    Unauthorized:
      description: Authentication required or token invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthenticationError'

    ProfileNotFound:
      description: User profile not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GenericError'

    EmailAlreadyExists:
      description: Email address already registered
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConflictError'

    AuthRateLimitExceeded:
      description: Too many authentication attempts
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthRateLimitError'
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GenericError'

    # Workout Management Success Responses
    WorkoutPlanGenerated:
      description: Workout plan generated successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkoutPlanResponse'
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'

    WorkoutPlanRetrieved:
      description: Workout plan retrieved successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkoutPlanResponse'

    WorkoutPlansListed:
      description: Workout plans list retrieved successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkoutPlansListResponse'

    WorkoutPlanAdjusted:
      description: Workout plan adjusted successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkoutAdjustmentResponse'
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'

    WorkoutPlanDeleted:
      description: Workout plan deleted successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GenericSuccessResponse'

    # Workout Management Error Responses
    WorkoutValidationFailed:
      description: Workout request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkoutValidationError'

    WorkoutGenerationFailed:
      description: AI workout generation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkoutGenerationError'

    WorkoutNotFound:
      description: Workout plan not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkoutNotFoundError'

    WorkoutPermissionDenied:
      description: Permission denied for workout operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkoutPermissionError'

    WorkoutAdjustmentFailed:
      description: Workout adjustment failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkoutAdjustmentError'

    WorkoutRateLimitExceeded:
      description: Workout operation rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WorkoutRateLimitError'
      headers:
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'

  # Common Response Headers
  headers:
    X-RateLimit-Limit:
      description: The number of allowed requests in the current period
      schema:
        type: integer
    X-RateLimit-Remaining:
      description: The number of remaining requests in the current period
      schema:
        type: integer
    X-RateLimit-Reset:
      description: The time at which the current rate limit window resets (Unix timestamp)
      schema:
        type: integer
    X-Request-ID:
      description: Unique identifier for the request (for debugging and support)
      schema:
        type: string
        format: uuid

# 5. Global Security Requirements
security:
  - SupabaseJWT: []

# 6. Tags Definition (Based on Verified Route Structure)
tags:
  - name: Authentication & User Management
    description: |
      User registration, login, password management, and session handling.
      Handles 12 authentication endpoints including signup, login, password reset, and email verification.
    externalDocs:
      description: Authentication Flow Documentation
      url: https://trainer.app/docs/auth

  - name: User Profiles
    description: |
      User profile management including demographics, preferences, and settings.
      Handles 5 profile endpoints for creating, updating, and retrieving user profiles and preferences.
    externalDocs:
      description: Profile Management Guide
      url: https://trainer.app/docs/profiles

  - name: Workout Management
    description: |
      AI-powered workout plan generation, customization, and management.
      Handles 5 workout endpoints including plan creation, retrieval, adjustment, and deletion.
    externalDocs:
      description: Workout Planning Guide
      url: https://trainer.app/docs/workouts

  - name: Workout Logging
    description: |
      Recording and tracking workout sessions, exercises, and performance metrics.
      Handles 5 workout logging endpoints for creating, retrieving, updating, and deleting workout logs.
    externalDocs:
      description: Workout Logging Guide
      url: https://trainer.app/docs/workout-logs

  - name: Nutrition & Macros
    description: |
      Nutrition planning, macro calculations, and dietary tracking.
      Handles 12 combined endpoints (7 nutrition + 5 macro endpoints) for comprehensive nutrition management.
    externalDocs:
      description: Nutrition Planning Guide
      url: https://trainer.app/docs/nutrition

  - name: Analytics & Progress
    description: |
      AI-powered analytics, progress tracking, and predictive insights.
      Handles 16 analytics endpoints including overview, trends, AI insights, pattern detection, and predictions.
    externalDocs:
      description: Analytics & Insights Guide
      url: https://trainer.app/docs/analytics

  - name: Progress Tracking
    description: |
      Progress check-ins, body metrics tracking, and milestone monitoring.
      Handles 4 progress endpoints for check-ins, metrics, and progress visualization.
    externalDocs:
      description: Progress Tracking Guide
      url: https://trainer.app/docs/progress

  - name: Data Transfer
    description: |
      Data export and import functionality for backup and portability.
      Handles 2 data transfer endpoints supporting multiple formats (JSON, CSV, XLSX, PDF).
    externalDocs:
      description: Data Transfer Guide
      url: https://trainer.app/docs/data-transfer

  - name: Notifications
    description: |
      Notification preferences and delivery management.
      Handles 3 notification endpoints for preference management and testing.
    externalDocs:
      description: Notification Settings Guide
      url: https://trainer.app/docs/notifications

  - name: Health Checks
    description: |
      System health monitoring and service status endpoints.
      Handles 2 health check endpoints for basic system health and Supabase connectivity status.
    externalDocs:
      description: Health Monitoring Guide
      url: https://trainer.app/docs/health

