get:
  tags:
    - Mobile Analytics
  summary: Get general mobile-optimized analytics with backward compatibility
  description: |
    Retrieve comprehensive mobile-optimized analytics with broad compatibility support and flexible configuration options for various mobile application needs.
    
    **Analytics Categories:**
    - Workout performance and consistency metrics
    - Progress tracking and trend analysis
    - Goal achievement and milestone progress
    - Wellness and health correlation insights
    - Social comparison and peer benchmarking
    
    **Mobile Optimization:**
    - Payload size management under 50KB limit
    - Network-adaptive content delivery
    - Battery-conscious data processing
    - Offline-capable analytics caching
    - Progressive loading for slower connections
    
    **Backward Compatibility:**
    - Support for legacy mobile app versions
    - Graceful degradation for older devices
    - Flexible API versioning support
    - Compatible data format options
    - Migration support for updated apps
    
    **Customization Features:**
    - Configurable metric prioritization
    - Custom time range and granularity
    - Personalized insight generation
    - Adaptive compression and formatting
    - User preference-based content filtering
    
    **Performance Features:**
    - Intelligent caching and data freshness
    - Compression algorithm optimization
    - Minimal processing overhead
    - Background sync preparation
    - Error recovery and retry mechanisms
  operationId: getMobileAnalytics
  security:
    - SupabaseJWT: []
  parameters:
    - name: analyticsType
      in: query
      description: Type of analytics to retrieve
      schema:
        type: string
        enum: [overview, detailed, performance, wellness, social, goals, custom]
        default: "overview"
        example: "overview"
    
    - name: timeRange
      in: query
      description: Time range for analytics data
      schema:
        type: string
        enum: [week, 2weeks, month, 3months, 6months, year]
        default: "month"
        example: "week"
    
    - name: compressionLevel
      in: query
      description: Data compression level for mobile optimization
      schema:
        type: string
        enum: [none, low, medium, high, adaptive, maximum]
        default: "adaptive"
        example: "high"
    
    - name: connectionType
      in: query
      description: Client connection type for optimization
      schema:
        type: string
        enum: [2G, 3G, 4G, 5G, WiFi, unknown]
        default: "unknown"
        example: "4G"
    
    - name: deviceCapabilities
      in: query
      description: Device capabilities for content adaptation
      schema:
        type: string
        enum: [basic, standard, advanced, premium]
        default: "standard"
        example: "advanced"
    
    - name: appVersion
      in: query
      description: Mobile app version for compatibility
      schema:
        type: string
        pattern: '^\\d+\\.\\d+(\\.\\d+)?$'
        example: "2.1.0"
    
    - name: legacySupport
      in: query
      description: Enable legacy compatibility mode
      schema:
        type: boolean
        default: false
        example: true
    
    - name: includeCharts
      in: query
      description: Include chart data for visualization
      schema:
        type: boolean
        default: true
        example: false
    
    - name: chartResolution
      in: query
      description: Chart data resolution for mobile display
      schema:
        type: string
        enum: [minimal, low, medium, high, adaptive]
        default: "adaptive"
        example: "low"
    
    - name: priorityMetrics
      in: query
      description: Priority metrics for limited display (comma-separated)  
      schema:
        type: string
        example: "weight,workouts,goals,adherence"
    
    - name: maxDataPoints
      in: query
      description: Maximum number of data points to include
      schema:
        type: integer
        minimum: 10
        maximum: 500
        default: 100
        example: 50
    
    - name: cacheStrategy
      in: query
      description: Caching strategy preference
      schema:
        type: string
        enum: [fresh, balanced, aggressive, offline_first]
        default: "balanced"
        example: "aggressive"
    
    - name: batteryOptimization
      in: query
      description: Enable battery optimization features
      schema:
        type: boolean
        default: false
        example: true
    
    - name: offlineMode
      in: query
      description: Prepare data for offline availability
      schema:
        type: boolean
        default: false
        example: true
    
    - name: customization
      in: query
      description: Custom configuration JSON string
      schema:
        type: string
        example: '{"theme":"dark","units":"metric","precision":2}'
    
    - name: format
      in: query
      description: Response format preference
      schema:
        type: string
        enum: [json, compressed, minimal, export]
        default: "json"
        example: "compressed"
  responses:
    '200':
      $ref: '../../components/responses/mobile/MobileOptimizedAnalyticsRetrieved.yaml'
    
    '400':
      $ref: '../../components/responses/mobile/MobileValidationFailed.yaml'
    
    '401':
      $ref: '../../components/responses/mobile/MobileAuthenticationRequired.yaml'
    
    '404':
      $ref: '../../components/responses/mobile/MobileAnalyticsNotFound.yaml'
    
    '413':
      $ref: '../../components/responses/mobile/MobilePayloadExceeded.yaml'
    
    '422':
      $ref: '../../components/responses/mobile/MobileAnalyticsProcessingFailed.yaml'
    
    '429':
      $ref: '../../components/responses/mobile/MobileRateLimitExceeded.yaml'
    
    '500':
      $ref: '../../components/responses/mobile/MobileDatabaseFailed.yaml'
    
    '503':
      $ref: '../../components/responses/mobile/MobileAnalyticsServiceUnavailable.yaml'
    
    '506':
      $ref: '../../components/responses/mobile/MobileVersionNotSupported.yaml' 