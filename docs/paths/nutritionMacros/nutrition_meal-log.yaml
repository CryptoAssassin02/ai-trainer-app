get:
  tags:
    - Nutrition & Macros
  summary: Get meal logs with optional filtering
  description: |
    Retrieve meal logs for the authenticated user with optional date filtering and pagination.
    
    **Query Parameters:**
    - `date`: Filter by specific date (YYYY-MM-DD)
    - `startDate` & `endDate`: Filter by date range
    - `page` & `pageSize`: Pagination controls
  operationId: getMealLogs
  security:
    - SupabaseJWT: []
  parameters:
    - name: date
      in: query
      description: Filter meal logs by specific date (YYYY-MM-DD)
      schema:
        type: string
        format: date
        example: "2024-01-15"
    
    - name: startDate
      in: query
      description: Filter meal logs from this date onwards (YYYY-MM-DD)
      schema:
        type: string
        format: date
        example: "2024-01-01"
    
    - name: endDate
      in: query
      description: Filter meal logs up to this date (YYYY-MM-DD)
      schema:
        type: string
        format: date
        example: "2024-01-31"
    
    - name: page
      in: query
      description: Page number for pagination
      schema:
        type: integer
        minimum: 1
        default: 1
        example: 1
    
    - name: pageSize
      in: query
      description: Number of items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
        example: 20
  responses:
    '200':
      $ref: '../../components/responses/nutritionMacros/MealLogsListed.yaml'
    
    '401':
      $ref: '../../components/responses/nutritionMacros/NutritionAuthenticationRequired.yaml'
    
    '500':
      $ref: '../../components/responses/nutritionMacros/NutritionDatabaseFailed.yaml'

post:
  tags:
    - Nutrition & Macros
  summary: Log a new meal
  description: |
    Create a new meal log entry with food items and nutritional information.
    
    The system will automatically calculate total macros consumed for the meal.
  operationId: logMeal
  security:
    - SupabaseJWT: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/nutritionMacros/MealLogRequest.yaml'
        examples:
          breakfast_log:
            summary: Breakfast meal log
            description: Log a typical breakfast with oatmeal and fruit
            value:
              mealName: "Breakfast"
              foods:
                - name: "Steel-cut oats"
                  portionSize: 100
                  units: "grams"
                  protein_g: 13.2
                  carbs_g: 67
                  fat_g: 7
                  calories: 389
                - name: "Blueberries"
                  portionSize: 80
                  units: "grams"
                  protein_g: 0.6
                  carbs_g: 11.5
                  fat_g: 0.3
                  calories: 46
              notes: "Perfect start to the day"
              loggedAt: "2024-01-15T07:30:00Z"
          
          post_workout_meal:
            summary: Post-workout meal
            description: Log post-workout meal with protein and carbs
            value:
              mealName: "Post-workout"
              foods:
                - name: "Grilled chicken breast"
                  portionSize: 150
                  units: "grams"
                  protein_g: 31
                  carbs_g: 0
                  fat_g: 3.6
                  calories: 165
                - name: "Sweet potato"
                  portionSize: 200
                  units: "grams"
                  protein_g: 4
                  carbs_g: 40
                  fat_g: 0.2
                  calories: 180
              notes: "Great recovery meal"
              loggedAt: "2024-01-15T15:30:00Z"
  responses:
    '201':
      $ref: '../../components/responses/nutritionMacros/MealLogCreated.yaml'
    
    '400':
      $ref: '../../components/responses/nutritionMacros/NutritionValidationFailed.yaml'
    
    '401':
      $ref: '../../components/responses/nutritionMacros/NutritionAuthenticationRequired.yaml'
    
    '500':
      $ref: '../../components/responses/nutritionMacros/NutritionDatabaseFailed.yaml' 