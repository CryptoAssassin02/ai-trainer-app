get:
  tags:
    - Nutrition & Macros
  summary: Get paginated list of macro plans
  description: |
    Retrieve a paginated list of user's macro plans with optional filtering by status, goal type, and date range.
    
    **Filtering Options:**
    - `status`: Filter by plan status (active, inactive, archived)
    - `goalType`: Filter by goal type (weight_loss, muscle_gain, etc.)
    - `startDate` & `endDate`: Filter by creation date range
    - `sortBy` & `sortOrder`: Control sorting
  operationId: getMacroPlans
  security:
    - SupabaseJWT: []
  parameters:
    - name: page
      in: query
      description: Page number for pagination
      schema:
        type: integer
        minimum: 1
        default: 1
        example: 1
    
    - name: pageSize
      in: query
      description: Number of items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
        example: 20
    
    - name: status
      in: query
      description: Filter by plan status
      schema:
        type: string
        enum: [active, inactive, archived]
        example: "active"
    
    - name: goalType
      in: query
      description: Filter by goal type
      schema:
        type: string
        enum: [weight_loss, maintenance, muscle_gain, performance, custom]
        example: "muscle_gain"
    
    - name: startDate
      in: query
      description: Filter plans created on or after this date
      schema:
        type: string
        format: date
        example: "2024-01-01"
    
    - name: endDate
      in: query
      description: Filter plans created on or before this date
      schema:
        type: string
        format: date
        example: "2024-12-31"
    
    - name: sortBy
      in: query
      description: Field to sort results by
      schema:
        type: string
        enum: [created_at, updated_at, calories, status]
        default: "created_at"
        example: "created_at"
    
    - name: sortOrder
      in: query
      description: Sort order
      schema:
        type: string
        enum: [asc, desc]
        default: "desc"
        example: "desc"
  responses:
    '200':
      $ref: '../../components/responses/nutritionMacros/MacroPlansListed.yaml'
    
    '401':
      $ref: '../../components/responses/nutritionMacros/MacroAuthenticationRequired.yaml'
    
    '500':
      $ref: '../../components/responses/nutritionMacros/MacroDatabaseFailed.yaml'

post:
  tags:
    - Nutrition & Macros
  summary: Create custom macro plan
  description: |
    Store a custom macro plan with user-defined targets.
    
    This endpoint allows users to create macro plans with custom calorie and macronutrient targets,
    bypassing the calculation process.
  operationId: createCustomMacroPlan
  security:
    - SupabaseJWT: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/nutritionMacros/CustomMacroRequest.yaml'
        examples:
          custom_bulk_plan:
            summary: Custom bulking macro plan
            description: High-calorie plan for lean bulking
            value:
              calories: 2800
              macros:
                protein: 180
                carbs: 350
                fat: 93
              bmr: 1750
              tdee: 2700
              goalType: "muscle_gain"
              calorieAdjustment: 100
              notes: "Custom plan for lean bulking phase"
          
          custom_cut_plan:
            summary: Custom cutting macro plan
            description: Lower-calorie plan for fat loss
            value:
              calories: 1600
              macros:
                protein: 140
                carbs: 120
                fat: 62
              goalType: "weight_loss"
              calorieAdjustment: -400
              notes: "Aggressive cut for competition prep"
  responses:
    '201':
      $ref: '../../components/responses/nutritionMacros/MacroPlanCreated.yaml'
    
    '400':
      $ref: '../../components/responses/nutritionMacros/MacroValidationFailed.yaml'
    
    '401':
      $ref: '../../components/responses/nutritionMacros/MacroAuthenticationRequired.yaml'
    
    '500':
      $ref: '../../components/responses/nutritionMacros/MacroDatabaseFailed.yaml' 