get:
  tags:
    - Analytics & Progress Tracking
  summary: Get strength progression analytics
  description: |
    Retrieve detailed strength progression metrics including exercise performance, volume progression, and strength gains over time.
    
    **Strength Analytics Include:**
    - Exercise-specific strength gains
    - Total volume progression (weight × reps × sets)
    - One-rep max estimations and progressions
    - Strength ratios and imbalance analysis
    - Performance consistency metrics
    
    **Analysis Features:**
    - Movement pattern analysis (squat, bench, deadlift, etc.)
    - Progressive overload tracking
    - Plateau identification and recommendations
  operationId: getStrengthProgression
  security:
    - SupabaseJWT: []
  parameters:
    - name: timeframe
      in: query
      description: Time period for strength analysis
      schema:
        type: string
        enum: ["6 weeks", "12 weeks", "6 months", "1 year"]
        default: "12 weeks"
        example: "12 weeks"
    
    - name: exerciseType
      in: query
      description: Filter by specific exercise type or movement pattern
      schema:
        type: string
        enum: [compound, isolation, upper_body, lower_body, push, pull, squat, bench, deadlift]
        example: "compound"
    
    - name: includeVolume
      in: query
      description: Include volume progression analysis
      schema:
        type: boolean
        default: true
        example: true
    
    - name: includeOneRepMax
      in: query
      description: Include estimated 1RM calculations and progressions
      schema:
        type: boolean
        default: true
        example: true
    
    - name: analysisDepth
      in: query
      description: Level of analysis detail
      schema:
        type: string
        enum: [basic, detailed, comprehensive]
        default: "detailed"
        example: "comprehensive"
  responses:
    '200':
      $ref: '../../components/responses/analytics/StrengthProgressionRetrieved.yaml'
    
    '400':
      $ref: '../../components/responses/analytics/AnalyticsValidationFailed.yaml'
    
    '401':
      $ref: '../../components/responses/analytics/AnalyticsAuthenticationRequired.yaml'
    
    '404':
      $ref: '../../components/responses/analytics/AnalyticsNotFound.yaml'
    
    '429':
      $ref: '../../components/responses/analytics/AnalyticsRateLimitExceeded.yaml'
    
    '500':
      $ref: '../../components/responses/analytics/AnalyticsDatabaseFailed.yaml' 