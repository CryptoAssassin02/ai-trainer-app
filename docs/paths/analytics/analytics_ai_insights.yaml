get:
  tags:
    - Analytics & Progress Tracking
    - AI-Powered Analytics
  summary: Get AI-powered fitness insights
  description: |
    Retrieve AI-generated insights about fitness progress, patterns, and recommendations using advanced machine learning analysis.
    
    **AI Insights Include:**
    - Progress assessment and trend analysis
    - Performance bottleneck identification
    - Personalized improvement recommendations
    - Motivation and adherence insights
    - Health and wellness pattern recognition
    
    **AI Processing:**
    - Uses OpenAI GPT models for natural language insights
    - Analyzes historical data patterns and correlations
    - Provides contextual recommendations based on user goals
    
    **Rate Limits:**
    - 10 requests per hour (due to AI processing costs)
    - Cached results for 1 hour to optimize performance
  operationId: getAIInsights
  security:
    - SupabaseJWT: []
  parameters:
    - name: timeframe
      in: query
      description: Time period for AI analysis
      schema:
        type: string
        enum: ["30 days", "12 weeks", "6 months"]
        default: "12 weeks"
        example: "12 weeks"
    
    - name: focusAreas
      in: query
      description: Specific areas for AI analysis (comma-separated)
      schema:
        type: string
        example: "performance,adherence,progression"
    
    - name: insightDepth
      in: query
      description: Depth of AI analysis and insights
      schema:
        type: string
        enum: [basic, detailed, comprehensive]
        default: "detailed"
        example: "comprehensive"
    
    - name: includeRecommendations
      in: query
      description: Include actionable recommendations in insights
      schema:
        type: boolean
        default: true
        example: true
    
    - name: maxInsights
      in: query
      description: Maximum number of insights to generate
      schema:
        type: integer
        minimum: 1
        maximum: 20
        default: 10
        example: 15
  responses:
    '200':
      $ref: '../../components/responses/analytics/AIInsightsRetrieved.yaml'
    
    '400':
      $ref: '../../components/responses/analytics/AnalyticsValidationFailed.yaml'
    
    '401':
      $ref: '../../components/responses/analytics/AnalyticsAuthenticationRequired.yaml'
    
    '404':
      $ref: '../../components/responses/analytics/AnalyticsNotFound.yaml'
    
    '429':
      $ref: '../../components/responses/analytics/AnalyticsRateLimitExceeded.yaml'
    
    '500':
      $ref: '../../components/responses/analytics/AnalyticsDatabaseFailed.yaml'
    
    '502':
      $ref: '../../components/responses/analytics/AIAnalyticsFailed.yaml' 