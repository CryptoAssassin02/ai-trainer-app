get:
  tags:
    - Health Checks
  summary: Basic API health status check
  description: |
    Performs a basic health check to verify that the API is running and responsive. 
    This lightweight endpoint returns essential service information including version, 
    environment, and availability status without the detailed system metrics provided 
    by the root health endpoint.
    
    **Key Features:**
    - API availability confirmation
    - Version information
    - Environment identification
    - Minimal response payload
    - Fast response time
    
    **Use Cases:**
    - Load balancer health checks
    - Container orchestration readiness probes
    - Basic API availability monitoring
    - Client-side connection testing
    - Lightweight service discovery
    
    **Comparison with /health:**
    - `/health` - Comprehensive system metrics (slower, detailed)
    - `/v1/health` - Basic API status (faster, lightweight)
    
    **No Authentication Required:** This endpoint is publicly accessible for 
    basic availability monitoring and does not require authentication.
  
  operationId: getBasicAPIHealth
  
  # No security requirement - public endpoint
  security: []
  
  responses:
    '200':
      $ref: '../../components/responses/healthSystem/BasicHealthOK.yaml'
    
    '500':
      $ref: '../../components/responses/healthSystem/HealthCheckFailed.yaml'
  
  # Rate limiting considerations
  x-rate-limit: "No rate limiting applied - basic health endpoint"
  
  # Additional metadata for documentation
  x-code-samples:
    - lang: 'curl'
      source: |
        curl -X GET "https://api.trainer.app/v1/health" \
          -H "Accept: application/json"
    
    - lang: 'JavaScript'
      source: |
        fetch('https://api.trainer.app/v1/health')
          .then(response => response.json())
          .then(data => console.log('API Health:', data))
          .catch(error => console.error('API health check failed:', error));
    
    - lang: 'Python'
      source: |
        import requests
        
        response = requests.get('https://api.trainer.app/v1/health')
        if response.status_code == 200:
            health_data = response.json()
            print(f"API Status: {health_data['status']}")
            print(f"Version: {health_data['info']['version']}")
            print(f"Environment: {health_data['info']['environment']}")
        else:
            print(f"API health check failed: {response.status_code}")
    
    - lang: 'Docker'
      label: 'Docker Healthcheck'
      source: |
        # Dockerfile HEALTHCHECK instruction
        HEALTHCHECK --interval=30s --timeout=3s --start-period=5s --retries=3 \
          CMD curl -f http://localhost:8000/v1/health || exit 1
  
  # Performance expectations
  x-performance:
    typical-response-time: "< 20ms"
    max-response-time: "< 100ms"
    availability-target: "99.9%" 