get:
  tags:
    - Health Checks
  summary: Database connectivity health check
  description: |
    Performs a comprehensive database connectivity health check to verify that the 
    application can successfully connect to and query the Supabase database. This 
    endpoint tests the full database connection stack including authentication, 
    network connectivity, and query execution.
    
    **Key Features:**
    - Database connection verification
    - Query response time measurement
    - Connection fallback testing
    - Authentication validation
    - Network connectivity assessment
    
    **Connection Testing Process:**
    1. **Primary Test**: Attempts to query a health check table using the anon key
    2. **Fallback Test**: If primary fails, tries direct database connection using service role
    3. **Performance Measurement**: Records actual response time for monitoring
    4. **Error Classification**: Provides detailed error information for troubleshooting
    
    **Use Cases:**
    - Database dependency monitoring
    - Connection pool health verification
    - Performance baseline establishment
    - Database migration readiness checks
    - Disaster recovery validation
    
    **Error Handling:**
    The endpoint implements intelligent fallback mechanisms and provides detailed
    error information including connection attempt details, fallback usage, and
    retry recommendations.
    
    **No Authentication Required:** This endpoint is publicly accessible for 
    infrastructure monitoring and does not require authentication.
  
  operationId: getSupabaseDatabaseHealth
  
  # No security requirement - public endpoint
  security: []
  
  responses:
    '200':
      $ref: '../../components/responses/healthSystem/SupabaseHealthOK.yaml'
    
    '500':
      $ref: '../../components/responses/healthSystem/DatabaseConnectionFailed.yaml'
  
  # Rate limiting considerations
  x-rate-limit: "No rate limiting applied - database health endpoint"
  
  # Additional metadata for documentation
  x-code-samples:
    - lang: 'curl'
      source: |
        curl -X GET "https://api.trainer.app/v1/health/supabase" \
          -H "Accept: application/json"
    
    - lang: 'JavaScript'
      source: |
        fetch('https://api.trainer.app/v1/health/supabase')
          .then(response => response.json())
          .then(data => {
            if (data.status === 'ok') {
              console.log('Database Health:', data);
              console.log(`Response Time: ${data.info.responseTime}`);
            } else {
              console.error('Database Error:', data.message);
            }
          })
          .catch(error => console.error('Database health check failed:', error));
    
    - lang: 'Python'
      source: |
        import requests
        
        response = requests.get('https://api.trainer.app/v1/health/supabase')
        health_data = response.json()
        
        if response.status_code == 200:
            print(f"Database Status: {health_data['status']}")
            print(f"Connected: {health_data['info']['connected']}")
            print(f"Response Time: {health_data['info']['responseTime']}")
        else:
            print(f"Database Health Check Failed: {health_data['message']}")
            if 'details' in health_data:
                print(f"Error Type: {health_data['details']['errorType']}")
                print(f"Retryable: {health_data['details']['retryable']}")
    
    - lang: 'Node.js'
      label: 'Monitoring Script'
      source: |
        const checkDatabaseHealth = async () => {
          try {
            const response = await fetch('https://api.trainer.app/v1/health/supabase');
            const data = await response.json();
            
            if (data.status === 'ok') {
              const responseTimeMs = parseInt(data.info.responseTime);
              if (responseTimeMs > 1000) {
                console.warn(`Slow database response: ${data.info.responseTime}`);
              }
              return true;
            } else {
              console.error('Database health check failed:', data);
              return false;
            }
          } catch (error) {
            console.error('Health check request failed:', error);
            return false;
          }
        };
        
        // Run health check every 30 seconds
        setInterval(checkDatabaseHealth, 30000);
  
  # Performance expectations and thresholds
  x-performance:
    typical-response-time: "< 100ms"
    acceptable-response-time: "< 500ms"
    slow-response-threshold: "> 1000ms"
    timeout-threshold: "> 5000ms"
    availability-target: "99.5%"
  
  # Fallback behavior documentation
  x-fallback-behavior:
    primary-method: "Supabase anon key query"
    fallback-method: "Direct database connection via service role"
    fallback-trigger: "Primary query failure or table not found"
    error-classification: "Detailed error typing for troubleshooting" 