get:
  tags:
    - Authentication & User Management
  summary: Check email verification status
  description: |
    Check whether the current user's email address has been verified.
    Returns verification status and timestamp if verified.
  operationId: checkEmailVerificationStatus
  responses:
    '200':
      $ref: '../../components/responses/auth/EmailVerificationStatus.yaml'
    '401':
      $ref: '../../components/responses/common/Unauthorized.yaml'
    '404':
      description: User not found
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/common/GenericError.yaml'
    '500':
      $ref: '../../components/responses/common/InternalServerError.yaml' 