post:
  tags:
    - Authentication & User Management
  summary: Reset password with token
  description: |
    Reset user password using a valid reset token received via email.
    Token has limited validity period.
  operationId: resetPassword
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/auth/ResetPasswordRequest.yaml'
  responses:
    '200':
      $ref: '../../components/responses/common/GenericSuccess.yaml'
    '400':
      $ref: '../../components/responses/common/ValidationFailed.yaml'
    '401':
      $ref: '../../components/responses/auth/Unauthorized.yaml'
    '500':
      $ref: '../../components/responses/common/InternalServerError.yaml'
  security: []  # Public endpoint 