post:
  tags:
    - Authentication & User Management
  summary: Update user password
  description: |
    Update the password for the authenticated user. Requires a valid session token.
    Password must meet complexity requirements.
  operationId: updatePassword
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/auth/UpdatePasswordRequest.yaml'
  responses:
    '200':
      $ref: '../../components/responses/common/GenericSuccess.yaml'
    '400':
      $ref: '../../components/responses/common/ValidationFailed.yaml'
    '401':
      $ref: '../../components/responses/auth/Unauthorized.yaml'
    '500':
      $ref: '../../components/responses/common/InternalServerError.yaml' 