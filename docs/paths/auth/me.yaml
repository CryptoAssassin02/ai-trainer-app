get:
  tags:
    - Authentication & User Management
  summary: Get current user profile
  description: |
    Retrieve the complete user profile for the authenticated user, including
    demographics, preferences, and fitness information.
  operationId: getCurrentUser
  responses:
    '200':
      $ref: '../../components/responses/profiles/UserProfileRetrieved.yaml'
    '401':
      $ref: '../../components/responses/auth/Unauthorized.yaml'
    '404':
      description: User profile not found
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/common/GenericError.yaml'
    '500':
      $ref: '../../components/responses/common/InternalServerError.yaml' 