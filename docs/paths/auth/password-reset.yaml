post:
  tags:
    - Authentication & User Management
  summary: Request password reset
  description: |
    Send a password reset email to the specified address. For security,
    always returns success regardless of whether the email exists.
  operationId: requestPasswordReset
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/auth/PasswordResetRequest.yaml'
  responses:
    '200':
      $ref: '../../components/responses/common/GenericSuccess.yaml'
    '400':
      $ref: '../../components/responses/common/ValidationError.yaml'
    '429':
      $ref: '../../components/responses/common/RateLimitExceeded.yaml'
    '500':
      $ref: '../../components/responses/common/InternalServerError.yaml'
  security: []  # Public endpoint 