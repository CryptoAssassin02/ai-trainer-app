get:
  tags:
    - Authentication & User Management
  summary: Validate current session
  description: |
    Validate the current JWT token and return user information if valid.
    Used to check session status without refreshing the token.
  operationId: validateSession
  responses:
    '200':
      $ref: '../../components/responses/auth/SessionValidated.yaml'
    '401':
      $ref: '../../components/responses/auth/Unauthorized.yaml'
    '500':
      $ref: '../../components/responses/common/InternalServerError.yaml' 