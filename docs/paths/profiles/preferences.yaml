get:
  tags:
    - User Profiles
  summary: Get user profile preferences
  description: |
    Retrieve only the preference-related fields from the user's profile,
    including unit preferences, goals, equipment, experience level, and workout frequency.
  operationId: getUserProfilePreferences
  responses:
    '200':
      $ref: '../../components/responses/profiles/ProfilePreferencesRetrieved.yaml'
    '401':
      $ref: '../../components/responses/common/Unauthorized.yaml'
    '404':
      $ref: '../../components/responses/profiles/ProfileNotFound.yaml'
    '500':
      $ref: '../../components/responses/common/InternalServerError.yaml'

put:
  tags:
    - User Profiles
  summary: Update user profile preferences
  description: |
    Update only the preference-related fields of the user's profile.
    At least one field must be provided. Content-Type must be application/json.
  operationId: updateUserProfilePreferences
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/profiles/ProfilePreferencesRequest.yaml'
  responses:
    '200':
      $ref: '../../components/responses/profiles/ProfilePreferencesUpdated.yaml'
    '400':
      $ref: '../../components/responses/profiles/ProfileValidationFailed.yaml'
    '401':
      $ref: '../../components/responses/common/Unauthorized.yaml'
    '404':
      $ref: '../../components/responses/profiles/ProfileNotFound.yaml'
    '500':
      $ref: '../../components/responses/common/InternalServerError.yaml' 