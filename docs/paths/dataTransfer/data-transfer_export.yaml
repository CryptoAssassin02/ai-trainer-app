post:
  tags:
    - Data Transfer
  summary: Export user data in specified format
  description: |
    Exports user's fitness data in the requested format (JSON, CSV, XLSX, or PDF).
    
    **Features:**
    - Multiple export formats supported
    - Selective data type export
    - Streaming responses for large datasets
    - CSV sanitization for security
    - User data isolation via RLS policies
    
    **Rate Limiting:**
    - Production: 5 requests per hour per user
    - Development: 100 requests per minute per user
    
    **File Size:**
    - Response files are streamed for memory efficiency
    - Large exports may take longer to generate
    
    **Security:**
    - Only authenticated users can export data
    - Users can only export their own data
    - All exports are logged for audit purposes
  operationId: exportUserData
  security:
    - SupabaseJWT: []
  requestBody:
    description: Export configuration specifying format and data types
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/dataTransfer/DataExportRequest.yaml'
        examples:
          jsonExport:
            summary: Export profiles and workouts as JSON
            value:
              format: json
              dataTypes: ['profiles', 'workouts']
          csvExport:
            summary: Export all data as CSV
            value:
              format: csv
              dataTypes: ['profiles', 'workouts', 'workout_logs']
          xlsxExport:
            summary: Export workout logs as Excel
            value:
              format: xlsx
              dataTypes: ['workout_logs']
          pdfExport:
            summary: Export user profile as PDF
            value:
              format: pdf
              dataTypes: ['profiles']
  responses:
    '200':
      $ref: '../../components/responses/dataTransfer/DataExportCompleted.yaml'
    '400':
      $ref: '../../components/responses/dataTransfer/DataTransferValidationFailed.yaml'
    '401':
      $ref: '../../components/responses/auth/Unauthorized.yaml'
    '429':
      $ref: '../../components/responses/dataTransfer/DataTransferRateLimitExceeded.yaml'
    '500':
      $ref: '../../components/responses/dataTransfer/DataTransferDatabaseFailed.yaml' 