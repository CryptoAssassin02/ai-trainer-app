type: object
description: Workout plan data structure for export operations
required:
  - user_id
  - name
  - plan_data
properties:
  id:
    type: string
    format: uuid
    description: Workout plan ID
    example: "456e7890-e89b-12d3-a456-426614174001"
  user_id:
    type: string
    format: uuid
    description: Associated user ID
    example: "123e4567-e89b-12d3-a456-426614174000"
  name:
    type: string
    description: Workout plan name
    example: "Full Body Strength Training"
  description:
    type: string
    nullable: true
    description: Workout plan description
    example: "Complete full body training routine focusing on compound movements"
  plan_data:
    type: object
    description: Detailed workout plan structure (exported as JSON string in non-JSON formats)
    example:
      exercises:
        - name: "Squats"
          sets: 3
          reps: 12
          weight: 70
  ai_generated:
    type: boolean
    nullable: true
    description: Whether this plan was generated by AI
    example: true
  status:
    type: string
    nullable: true
    enum: ['draft', 'active', 'archived']
    description: Current status of the workout plan
    example: "active"
  difficulty_level:
    type: string
    nullable: true
    enum: ['beginner', 'intermediate', 'advanced']
    description: Difficulty level of the workout
    example: "intermediate"
  estimated_duration:
    type: integer
    nullable: true
    description: Estimated duration in minutes
    example: 60
  schedule_frequency:
    type: string
    nullable: true
    enum: ['daily', 'weekly', 'monthly', 'custom']
    description: Recommended frequency for the workout
    example: "weekly"
  tags:
    type: array
    items:
      type: string
    nullable: true
    description: Tags associated with the workout (exported as JSON string in non-JSON formats)
    example: ["strength", "full_body", "beginner"]
  goals:
    type: array
    items:
      type: string
    nullable: true
    description: Fitness goals this workout addresses (exported as JSON string in non-JSON formats)
    example: ["muscle_gain", "strength"]
  equipment_required:
    type: array
    items:
      type: string
    nullable: true
    description: Equipment needed for this workout (exported as JSON string in non-JSON formats)
    example: ["barbell", "dumbbells", "bench"]
  ai_reasoning:
    type: object
    nullable: true
    description: AI reasoning for workout design (exported as JSON string in non-JSON formats)
    example:
      rationale: "Full body workout selected for beginner user with limited time"
      adjustments: "Reduced volume for recovery"
  version:
    type: integer
    nullable: true
    description: Version number of the workout plan
    example: 1
  advanced_splits:
    type: object
    nullable: true
    description: Advanced workout split information (exported as JSON string in non-JSON formats)
    example:
      push_day: ["chest", "shoulders", "triceps"]
      pull_day: ["back", "biceps"]
  created_at:
    type: string
    format: date-time
    nullable: true
    description: Plan creation timestamp
    example: "2024-01-15T10:30:00.000Z"
  updated_at:
    type: string
    format: date-time
    nullable: true
    description: Plan last update timestamp
    example: "2024-01-15T10:30:00.000Z"
examples:
  basicWorkout:
    summary: Basic workout plan for export
    value:
      id: "456e7890-e89b-12d3-a456-426614174001"
      user_id: "123e4567-e89b-12d3-a456-426614174000"
      name: "Push Day Workout"
      description: "Upper body pushing muscles workout"
      plan_data:
        exercises:
          - name: "Bench Press"
            sets: 3
            reps: 10
      ai_generated: true
      status: "active"
      difficulty_level: "intermediate"
  completeWorkout:
    summary: Complete workout plan with all fields
    value:
      id: "456e7890-e89b-12d3-a456-426614174001"
      user_id: "123e4567-e89b-12d3-a456-426614174000"
      name: "Advanced Full Body"
      description: "Comprehensive full body training for advanced users"
      plan_data:
        exercises:
          - name: "Deadlifts"
            sets: 4
            reps: 6
            weight: 120
          - name: "Squats"
            sets: 4
            reps: 8
            weight: 100
      ai_generated: true
      status: "active"
      difficulty_level: "advanced"
      estimated_duration: 90
      schedule_frequency: "weekly"
      tags: ["strength", "powerlifting", "advanced"]
      goals: ["strength", "muscle_gain"]
      equipment_required: ["barbell", "plates", "squat_rack"]
      ai_reasoning:
        rationale: "High intensity program for experienced lifter"
        focus: "Progressive overload with compound movements"
      version: 2
      created_at: "2024-01-10T08:00:00.000Z"
      updated_at: "2024-01-15T10:30:00.000Z" 