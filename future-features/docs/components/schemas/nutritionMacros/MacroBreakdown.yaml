type: object
description: Macronutrient breakdown with targets in grams and total calories
required:
  - protein_g
  - carbs_g
  - fat_g
  - calories
properties:
  protein_g:
    type: number
    minimum: 0
    maximum: 400
    description: Daily protein target in grams
    example: 150
  
  carbs_g:
    type: number
    minimum: 0
    maximum: 800
    description: Daily carbohydrate target in grams
    example: 260
  
  fat_g:
    type: number
    minimum: 0
    maximum: 200
    description: Daily fat target in grams
    example: 87
  
  calories:
    type: number
    minimum: 800
    maximum: 6000
    description: Total daily calorie target
    example: 2300

additionalProperties: false

example:
  protein_g: 140
  carbs_g: 210
  fat_g: 70
  calories: 2020 