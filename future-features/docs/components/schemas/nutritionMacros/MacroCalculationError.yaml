type: object
description: Error during macro calculation process
required:
  - status
  - error
  - message
properties:
  status:
    type: string
    enum: [error]
    description: Response status
    example: "error"
  
  error:
    type: string
    enum: [MACRO_CALCULATION_ERROR]
    description: Error type identifier
    example: "MACRO_CALCULATION_ERROR"
  
  message:
    type: string
    description: Human-readable error message
    example: "Failed to calculate macros"
  
  details:
    type: object
    properties:
      step:
        type: string
        description: Calculation step that failed
        example: "BMR_CALCULATION"
      
      reason:
        type: string
        description: Reason for calculation failure
        example: "Invalid user profile data"
      
      requirements:
        type: array
        items:
          type: string
        description: Required data that is missing or invalid
        example: ["valid_height", "valid_age", "complete_profile"]
    additionalProperties: false
    description: Calculation error details
  
  timestamp:
    type: string
    format: date-time
    description: When the error occurred
    example: "2024-01-15T10:30:00Z"

additionalProperties: false

example:
  status: "error"
  error: "MACRO_CALCULATION_ERROR"
  message: "Unable to calculate BMR with provided data"
  details:
    step: "BMR_CALCULATION"
    reason: "User profile is incomplete"
    requirements: ["valid_height", "valid_weight", "valid_age"]
  timestamp: "2024-01-15T10:30:00Z" 