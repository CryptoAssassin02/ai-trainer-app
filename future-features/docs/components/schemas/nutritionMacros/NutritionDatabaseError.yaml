type: object
description: Database error for nutrition operations
required:
  - status
  - error
  - message
properties:
  status:
    type: string
    enum: [error]
    description: Response status
    example: "error"
  
  error:
    type: string
    enum: [NUTRITION_DATABASE_ERROR]
    description: Error type identifier
    example: "NUTRITION_DATABASE_ERROR"
  
  message:
    type: string
    description: Human-readable error message
    example: "Database error occurred while processing nutrition data"
  
  details:
    type: object
    properties:
      operation:
        type: string
        description: Database operation that failed
        example: "INSERT"
      
      table:
        type: string
        description: Database table involved
        example: "nutrition_plans"
    additionalProperties: false
    description: Database error details
  
  timestamp:
    type: string
    format: date-time
    description: When the error occurred
    example: "2024-01-15T10:30:00Z"

additionalProperties: false

example:
  status: "error"
  error: "NUTRITION_DATABASE_ERROR"
  message: "Failed to save nutrition plan to database"
  details:
    operation: "INSERT"
    table: "nutrition_plans"
  timestamp: "2024-01-15T10:30:00Z" 