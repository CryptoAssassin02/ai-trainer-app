type: object
description: Response containing a logged meal entry
required:
  - status
  - message
  - data
properties:
  status:
    type: string
    enum: [success]
    description: Response status
    example: "success"
  
  message:
    type: string
    description: Response message
    example: "Meal logged successfully"
  
  data:
    $ref: './MealLog.yaml'

additionalProperties: false

