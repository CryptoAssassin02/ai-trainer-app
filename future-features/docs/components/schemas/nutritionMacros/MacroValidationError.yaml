type: object
description: Validation error for macro-related requests
required:
  - status
  - error
  - message
properties:
  status:
    type: string
    enum: [error]
    description: Response status
    example: "error"
  
  error:
    type: string
    enum: [MACRO_VALIDATION_ERROR]
    description: Error type identifier
    example: "MACRO_VALIDATION_ERROR"
  
  message:
    type: string
    description: Human-readable error message
    example: "Invalid macro calculation data"
  
  details:
    type: object
    properties:
      field:
        type: string
        description: Field that failed validation
        example: "weight"
      
      value:
        description: Value that failed validation
        example: 15
      
      constraint:
        type: string
        description: Validation constraint that was violated
        example: "must be between 20 and 300"
      
      min:
        type: number
        description: Minimum allowed value (if applicable)
        example: 20
      
      max:
        type: number
        description: Maximum allowed value (if applicable)
        example: 300
    additionalProperties: false
    description: Detailed validation error information
  
  timestamp:
    type: string
    format: date-time
    description: When the error occurred
    example: "2024-01-15T10:30:00Z"

additionalProperties: false

example:
  status: "error"
  error: "MACRO_VALIDATION_ERROR"
  message: "Weight value is below minimum requirement"
  details:
    field: "weight"
    value: 15
    constraint: "must be between 20 and 300"
    min: 20
    max: 300
  timestamp: "2024-01-15T10:30:00Z" 