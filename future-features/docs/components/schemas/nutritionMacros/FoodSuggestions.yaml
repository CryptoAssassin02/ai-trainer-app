type: object
description: Categorized food suggestions to help meet macronutrient targets
properties:
  protein:
    type: array
    items:
      type: string
    description: High-protein food suggestions
    example: ["chicken breast", "greek yogurt", "eggs", "salmon", "tofu", "lentils"]
  
  carbs:
    type: array
    items:
      type: string
    description: Carbohydrate-rich food suggestions
    example: ["brown rice", "sweet potato", "oats", "quinoa", "whole wheat bread", "fruits"]
  
  fat:
    type: array
    items:
      type: string
    description: Healthy fat food suggestions
    example: ["avocado", "olive oil", "nuts", "seeds", "fatty fish", "coconut oil"]
  
  vegetables:
    type: array
    items:
      type: string
    description: Vegetable suggestions for micronutrients and fiber
    example: ["spinach", "broccoli", "bell peppers", "carrots", "kale", "zucchini"]
  
  snacks:
    type: array
    items:
      type: string
    description: Balanced snack suggestions
    example: ["apple with almond butter", "greek yogurt with berries", "trail mix", "protein smoothie"]

additionalProperties: false

example:
  protein: ["lean beef", "chicken thighs", "cottage cheese", "protein powder", "black beans"]
  carbs: ["jasmine rice", "banana", "whole grain pasta", "steel-cut oats", "dates"]
  fat: ["walnuts", "flaxseeds", "extra virgin olive oil", "coconut", "dark chocolate"]
  vegetables: ["asparagus", "cauliflower", "tomatoes", "cucumber", "Brussels sprouts"]
  snacks: ["hummus with vegetables", "cheese and crackers", "mixed nuts", "protein bar"] 