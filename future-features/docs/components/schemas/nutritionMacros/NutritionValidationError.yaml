type: object
description: Validation error for nutrition-related requests
required:
  - status
  - error
  - message
properties:
  status:
    type: string
    enum: [error]
    description: Response status
    example: "error"
  
  error:
    type: string
    enum: [NUTRITION_VALIDATION_ERROR]
    description: Error type identifier
    example: "NUTRITION_VALIDATION_ERROR"
  
  message:
    type: string
    description: Human-readable error message
    example: "Invalid nutrition request data"
  
  details:
    type: object
    properties:
      field:
        type: string
        description: Field that failed validation
        example: "goals"
      
      value:
        description: Value that failed validation
        example: ["invalid_goal"]
      
      constraint:
        type: string
        description: Validation constraint that was violated
        example: "must be valid fitness goal"
      
      allowedValues:
        type: array
        items:
          type: string
        description: List of allowed values (if applicable)
        example: ["weight_loss", "muscle_gain", "maintenance", "performance", "general_health", "endurance"]
    additionalProperties: false
    description: Detailed validation error information
  
  timestamp:
    type: string
    format: date-time
    description: When the error occurred
    example: "2024-01-15T10:30:00Z"

additionalProperties: false

example:
  status: "error"
  error: "NUTRITION_VALIDATION_ERROR"
  message: "Invalid activity level provided"
  details:
    field: "activityLevel"
    value: "super_active"
    constraint: "must be one of: sedentary, light, moderate, active, very_active"
    allowedValues: ["sedentary", "light", "moderate", "active", "very_active"]
  timestamp: "2024-01-15T10:30:00Z" 