type: object
description: Request body for creating or updating user dietary preferences
properties:
  dietType:
    type: string
    enum:
      - standard
      - vegetarian
      - vegan
      - keto
      - paleo
      - mediterranean
      - low_carb
      - low_fat
      - gluten_free
    description: Primary diet type or eating pattern
    example: "vegetarian"
  
  mealFrequency:
    type: integer
    minimum: 1
    maximum: 8
    description: Number of meals per day
    example: 3
  
  mealTimingPrefs:
    type: string
    maxLength: 200
    description: Preferred meal timing or schedule
    example: "Early breakfast at 7am, late dinner after 7pm"
  
  timeConstraints:
    type: string
    maxLength: 200
    description: Time constraints for meal preparation
    example: "Limited to 30 minutes prep time"
  
  restrictions:
    type: array
    items:
      type: string
    description: Dietary restrictions or limitations
    example: ["dairy-free", "nut-free"]
  
  allergies:
    type: array
    items:
      type: string
    description: Food allergies
    example: ["shellfish", "peanuts"]
  
  dislikedFoods:
    type: array
    items:
      type: string
    description: Foods to avoid based on preference
    example: ["broccoli", "mushrooms"]
  
  preferredCuisine:
    type: string
    maxLength: 100
    description: Preferred cuisine types
    example: "Mediterranean, Asian"
  
  performanceGoals:
    type: string
    maxLength: 200
    description: Performance-related dietary goals
    example: "Increase energy for morning workouts"

additionalProperties: false

example:
  dietType: "vegetarian"
  mealFrequency: 4
  mealTimingPrefs: "Small breakfast, large lunch"
  timeConstraints: "Quick prep meals on weekdays"
  restrictions: ["dairy-free"]
  allergies: ["shellfish"]
  dislikedFoods: ["spinach"]
  preferredCuisine: "Mediterranean"
  performanceGoals: "Better recovery after workouts" 