description: >
  Defines the request body for updating user notification preferences, including all standard and mobile-specific settings.
type: object
properties:
  email_enabled:
    type: boolean
    description: Enable or disable email notifications.
    example: true
  sms_enabled:
    type: boolean
    description: Enable or disable SMS notifications.
    example: false
  push_enabled:
    type: boolean
    description: Enable or disable push notifications.
    example: true
  in_app_enabled:
    type: boolean
    description: Enable or disable in-app notifications.
    example: true
  quiet_hours_start:
    type: string
    pattern: '^([01]\d|2[0-3]):([0-5]\d)$'
    description: Start time for quiet hours in HH:MM format (24-hour clock).
    example: "22:00"
    nullable: true
  quiet_hours_end:
    type: string
    pattern: '^([01]\d|2[0-3]):([0-5]\d)$'
    description: End time for quiet hours in HH:MM format (24-hour clock).
    example: "08:00"
    nullable: true
  workout_reminders:
    type: boolean
    description: Enable/disable workout reminder notifications.
    example: true
  progress_updates:
    type: boolean
    description: Enable/disable progress update notifications.
    example: true
  goal_achievements:
    type: boolean
    description: Enable/disable goal achievement notifications.
    example: true 