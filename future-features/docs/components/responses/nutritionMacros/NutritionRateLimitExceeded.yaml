description: Rate limit exceeded for nutrition operations
headers:
  X-Request-ID:
    $ref: '../../headers/X-Request-ID.yaml'
  X-RateLimit-Limit:
    $ref: '../../headers/X-RateLimit-Limit.yaml'
  X-RateLimit-Remaining:
    $ref: '../../headers/X-RateLimit-Remaining.yaml'
  X-RateLimit-Reset:
    $ref: '../../headers/X-RateLimit-Reset.yaml'
  Retry-After:
    description: Seconds to wait before retrying
    schema:
      type: integer
      example: 3600
content:
  application/json:
    schema:
      $ref: '../../schemas/nutritionMacros/NutritionRateLimitError.yaml'
    examples:
      calculation_rate_limit:
        summary: Nutrition calculation rate limit
        description: Too many nutrition calculation requests
        value:
          status: "error"
          error: "NUTRITION_RATE_LIMIT_EXCEEDED"
          message: "Too many nutrition calculation requests. Please try again later."
          details:
            limit: 5
            window: "1 hour"
            retryAfter: 3600
          timestamp: "2024-01-15T10:30:00Z" 