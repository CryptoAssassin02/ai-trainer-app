description: Authentication required for nutrition operations
headers:
  X-Request-ID:
    $ref: '../../headers/X-Request-ID.yaml'
content:
  application/json:
    schema:
      $ref: '../../schemas/nutritionMacros/NutritionAuthenticationError.yaml'
    examples:
      missing_token:
        summary: Missing authentication token
        description: No authentication token provided
        value:
          status: "error"
          error: "NUTRITION_AUTHENTICATION_ERROR"
          message: "Authentication required to access nutrition data"
          details:
            reason: "missing_token"
          timestamp: "2024-01-15T10:30:00Z"
      
      expired_token:
        summary: Expired authentication token
        description: Authentication token has expired
        value:
          status: "error"
          error: "NUTRITION_AUTHENTICATION_ERROR"
          message: "Invalid or expired authentication token"
          details:
            reason: "expired_token"
          timestamp: "2024-01-15T10:30:00Z" 