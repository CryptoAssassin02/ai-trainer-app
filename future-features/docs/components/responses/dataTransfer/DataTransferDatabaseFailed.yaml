description: Database operation failed during data transfer
headers:
  X-Request-ID:
    $ref: '../../headers/X-Request-ID.yaml'
content:
  application/json:
    schema:
      $ref: '../../schemas/dataTransfer/DataTransferDatabaseError.yaml'
    examples:
      exportDatabaseError:
        summary: Database error during export
        value:
          status: error
          message: "Failed to export data due to a database issue."
          errorCode: "DATABASE_ERROR"
          details:
            operation: "export"
            affectedDataType: "profiles"
      importDatabaseError:
        summary: Database error during import
        value:
          status: error
          message: "Failed to import data due to a database issue."
          errorCode: "DATABASE_ERROR"
          details:
            operation: "import"
            affectedDataType: "workout_logs"
            batchSize: 100
      batchInsertError:
        summary: Error during batch insert operation
        value:
          status: error
          message: "Database error importing XLSX data: Batch error for workout_plans"
          errorCode: "DATABASE_ERROR"
          details:
            operation: "import"
            affectedDataType: "workouts"
            batchSize: 50
      connectionError:
        summary: Database connection issue
        value:
          status: error
          message: "Failed to import data due to a database issue."
          errorCode: "DATABASE_ERROR"
          details:
            operation: "validation" 