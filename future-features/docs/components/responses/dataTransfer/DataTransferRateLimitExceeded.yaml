description: Data transfer rate limit exceeded
headers:
  X-RateLimit-Limit:
    $ref: '../../headers/X-RateLimit-Limit.yaml'
  X-RateLimit-Remaining:
    $ref: '../../headers/X-RateLimit-Remaining.yaml'
  X-RateLimit-Reset:
    $ref: '../../headers/X-RateLimit-Reset.yaml'
  X-Request-ID:
    $ref: '../../headers/X-Request-ID.yaml'
  Retry-After:
    description: Seconds until rate limit resets
    schema:
      type: integer
      example: 3600
content:
  application/json:
    schema:
      $ref: '../../schemas/dataTransfer/DataTransferRateLimitError.yaml'
    examples:
      exportRateLimit:
        summary: Export rate limit exceeded
        value:
          status: error
          message: "Too many export requests. Please try again later."
          errorCode: "RATE_LIMIT_EXCEEDED"
          details:
            retryAfter: 3600
            limit: 5
            windowMs: 3600000
            operation: "export"
      importRateLimit:
        summary: Import rate limit exceeded
        value:
          status: error
          message: "Too many import requests. Please try again later."
          errorCode: "RATE_LIMIT_EXCEEDED"
          details:
            retryAfter: 3600
            limit: 3
            windowMs: 3600000
            operation: "import" 