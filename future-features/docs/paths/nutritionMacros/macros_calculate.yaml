post:
  tags:
    - Nutrition & Macros
  summary: Calculate and store macro targets
  description: |
    Calculate macronutrient targets based on user data including BMR, TDEE, and goal-specific adjustments.
    
    **Calculation Process:**
    1. Calculate BMR using Mifflin-St Jeor equation
    2. Calculate TDEE using activity level multipliers
    3. Adjust calories based on goal (weight loss, muscle gain, etc.)
    4. Distribute macros based on goal-specific ratios
    
    **Rate Limits:**
    - 5 requests per hour (production)
    - 100 requests per minute (test environment)
  operationId: calculateMacros
  security:
    - SupabaseJWT: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/nutritionMacros/MacroCalculationRequest.yaml'
        examples:
          muscle_gain_calculation:
            summary: Muscle gain macro calculation
            description: Calculate macros for muscle gain with metric units
            value:
              weight: 75
              height: 180
              age: 28
              gender: "male"
              activityLevel: "active"
              goal: "muscle_gain"
              units: "metric"
              useExternalApi: true
          
          weight_loss_calculation:
            summary: Weight loss macro calculation
            description: Calculate macros for weight loss with imperial units
            value:
              weight: 165
              height:
                feet: 5
                inches: 6
              age: 32
              gender: "female"
              activityLevel: "moderate"
              goal: "weight_loss"
              units: "imperial"
              useExternalApi: false
  responses:
    '200':
      $ref: '../../components/responses/nutritionMacros/MacroCalculationCompleted.yaml'
    
    '400':
      $ref: '../../components/responses/nutritionMacros/MacroValidationFailed.yaml'
    
    '401':
      $ref: '../../components/responses/nutritionMacros/MacroAuthenticationRequired.yaml'
    
    '422':
      $ref: '../../components/responses/nutritionMacros/MacroCalculationFailed.yaml'
    
    '429':
      $ref: '../../components/responses/nutritionMacros/MacroRateLimitExceeded.yaml'
    
    '500':
      $ref: '../../components/responses/nutritionMacros/MacroDatabaseFailed.yaml' 