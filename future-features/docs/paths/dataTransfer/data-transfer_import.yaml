post:
  tags:
    - Data Transfer
  summary: Import user data from uploaded file
  description: |
    Imports fitness data from uploaded files in JSON, CSV, or XLSX format.
    
    **Supported Formats:**
    - JSON: Complete trAIner export files
    - CSV: Flat data with auto-detected data types
    - XLSX: Multi-sheet Excel files with data type detection
    
    **Features:**
    - Batch processing (100 records per batch)
    - Data validation and sanitization
    - Partial import support (some records can fail)
    - Auto-linking orphaned workout logs
    - Comprehensive error reporting
    
    **File Constraints:**
    - Maximum file size: 10MB
    - Supported MIME types: application/json, text/csv, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
    
    **Rate Limiting:**
    - Production: 3 requests per hour per user
    - Development: 100 requests per minute per user
    
    **Data Processing:**
    - JSON fields are processed and validated
    - Foreign key relationships are maintained
    - User ID is automatically associated with imported data
    - RLS policies ensure data isolation
    
    **Error Handling:**
    - Up to 10 errors are reported per import
    - Validation failures don't stop the entire import
    - Database errors are logged and reported
  operationId: importUserData
  security:
    - SupabaseJWT: []
  requestBody:
    description: File upload for data import (multipart/form-data)
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          required:
            - file
          properties:
            file:
              type: string
              format: binary
              description: |
                File containing data to import. Must be one of:
                - JSON file (application/json) - Complete trAIner export format
                - CSV file (text/csv) - Flat data with headers
                - Excel file (.xlsx) - Multi-sheet workbook format
                
                **Maximum file size: 10MB**
        examples:
          jsonFile:
            summary: JSON export file for import
            value:
              file: "(binary data of JSON file)"
          csvFile:
            summary: CSV data file for import
            value:
              file: "(binary data of CSV file)"
          xlsxFile:
            summary: Excel workbook for import
            value:
              file: "(binary data of XLSX file)"
  responses:
    '200':
      $ref: '../../components/responses/dataTransfer/DataImportCompleted.yaml'
    '400':
      description: Import validation failed or file issues
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '../../components/schemas/dataTransfer/DataTransferValidationError.yaml'
              - $ref: '../../components/schemas/dataTransfer/DataTransferFileError.yaml'
          examples:
            noFileUploaded:
              summary: No file provided
              value:
                status: error
                message: "No file uploaded."
                errorCode: "NO_FILE_UPLOADED"
            fileSizeExceeded:
              summary: File size exceeds limit
              value:
                status: error
                message: "File size exceeds the 10MB limit."
                errorCode: "FILE_SIZE_EXCEEDED"
                details:
                  fileSize: 15728640
                  maxSize: 10485760
                  fileName: "large_data.xlsx"
            unsupportedFileType:
              summary: Unsupported file type
              value:
                status: error
                message: "Unsupported file type: text/plain (data.txt)"
                errorCode: "UNSUPPORTED_FILE_TYPE"
                details:
                  fileName: "data.txt"
                  mimeType: "text/plain"
            invalidJsonFormat:
              summary: Invalid JSON file format
              value:
                status: error
                message: "Invalid JSON file format."
                errorCode: "INVALID_FILE_FORMAT"
                details:
                  fileName: "invalid.json"
                  mimeType: "application/json"
            allDataFailed:
              summary: All data validation failed
              value:
                status: error
                message: "All data validation failed."
                data:
                  total: 10
                  successful: 0
                  failed: 10
                  errors:
                    - "Validation error for profiles: User ID must be a valid UUID"
                    - "Missing required field: name"
    '401':
      $ref: '../../components/responses/common/Unauthorized.yaml'
    '429':
      $ref: '../../components/responses/dataTransfer/DataTransferRateLimitExceeded.yaml'
    '500':
      $ref: '../../components/responses/dataTransfer/DataTransferDatabaseFailed.yaml' 